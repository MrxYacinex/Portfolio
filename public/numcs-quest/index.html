st(np.asarray(r)) == [3, 40, 100], f'gefunden: {r}'"}], "hints": ["Energiespektrum: `p = np.abs(np.fft.fft(y))**2`.", "Nur `p[1:n//2]` anschauen, `np.argsort(...)[::-1][:m]` liefert die grössten, dann +1 (wegen des Offsets) und sortieren."], "ref": "Skript Code 3.2.15", "boss": false, "kind": "code"}, {"id": "ft-c7", "title": "Rauschfilter", "text": "Entrausche ein Signal: Berechne c = fft(y), behalte nur die K Koeffizienten mit dem grössten Betrag (alle anderen auf 0) und transformiere zurück. Schreibe `entrauschen(y, K)` (reelles Ergebnis).", "template": "import numpy as np\nimport matplotlib.pyplot as plt\n\ndef entrauschen(y, K):\n    c = np.fft.fft(y)\n    # TODO\n    return y\n\nrng = np.random.default_rng(1)\nN = 2**11\nx = np.linspace(0, 2000, N, endpoint=False)\nf = lambda x: np.sin((x/200)**2) * np.exp(-((x-1e3)/400)**2)\ny = f(x) + 2*rng.random(N) - 1\nfy = entrauschen(y, 60)\nprint(np.max(np.abs(y - f(x))), np.max(np.abs(fy - f(x))))\nplt.plot(x, y, alpha=.4); plt.plot(x, fy); plt.savefig(\"./cx_out/filter.png\")\n", "solution": "", "tests": [{"name": "genau K Koeffizienten bleiben", "code": "y = np.random.default_rng(2).random(64); fy = entrauschen(y, 5); assert np.sum(np.abs(np.fft.fft(fy)) > 1e-9) <= 5, 'es sollen höchstens K Koeffizienten übrig bleiben'"}, {"name": "Rauschen deutlich kleiner", "code": "rng = np.random.default_rng(1); N = 2**11; x = np.linspace(0, 2000, N, endpoint=False); f = lambda x: np.sin((x/200)**2)*np.exp(-((x-1e3)/400)**2); y = f(x) + 2*rng.random(N) - 1; e0 = np.sqrt(np.mean((y-f(x))**2)); e1 = np.sqrt(np.mean((entrauschen(y, 60)-f(x))**2)); assert e1 < 0.4*e0, f'RMS-Fehler vorher {e0:.3f}, nachher {e1:.3f}'"}, {"name": "reell", "code": "assert np.isrealobj(entrauschen(np.ones(8), 1)), 'Ergebnis soll reell sein'"}], "hints": ["`idx = np.argsort(np.abs(c))[::-1]` sortiert die Indizes nach Betrag absteigend.", "`c[idx[K:]] = 0` löscht alle ausser den K grössten; dann `np.real(np.fft.ifft(c))`."], "ref": "Skript 3.2, Serie", "boss": false, "kind": "code"}, {"id": "ft-c8", "title": "Konvergenzkurve convtrig (Serie)", "text": "Schreibe `convtrig(f, N, lev)`: Für n = 2, 4, …, 2^lev interpoliere f an n Punkten, werte mit Zero-Padding an N Punkten aus und miss den Maximumsfehler. Gib `(vn, vlinf)` zurück. Die Funktion `evaliptrig` ist schon da. Plotte die Kurven für f(t) = 1/√(1 − α sin 2πt), α = 0.5 und 0.9 im semilogy.", "template": "import numpy as np\nimport matplotlib.pyplot as plt\n\ndef evaliptrig(y, N):\n    n = len(y); c = np.fft.fft(y)/n\n    a = np.zeros(N, dtype=complex); a[:n//2] = c[:n//2]; a[N-n//2:] = c[n//2:]\n    return np.real(np.fft.ifft(a)*N)\n\ndef convtrig(f, N, lev):\n    tt = np.linspace(0, 1, N, endpoint=False)\n    vn = 2**np.arange(1, lev + 1)\n    vlinf = np.zeros(lev)\n    # TODO\n    return vn, vlinf\n\nfor alpha in [0.5, 0.9]:\n    f = lambda t: 1/np.sqrt(1 - alpha*np.sin(2*np.pi*t))\n    vn, e = convtrig(f, 2**12, 9)\n    plt.semilogy(vn, e, 'o-', label=str(alpha))\nplt.legend(); plt.savefig(\"./cx_out/convtrig.png\")\n", "solution": "", "tests": [{"name": "Rückgabe", "code": "vn, e = convtrig(np.cos, 256, 5); assert list(vn) == [2, 4, 8, 16, 32] and len(e) == 5, f'vn = {vn}'"}, {"name": "exponentielle Konvergenz α = 0.5", "code": "f = lambda t: 1/np.sqrt(1 - 0.5*np.sin(2*np.pi*t)); vn, e = convtrig(f, 1024, 7); assert e[-1] < 1e-12 and e[0] > 1e-2, f'Fehler {e}'"}, {"name": "α = 0.9 konvergiert langsamer", "code": "g = lambda al: (lambda t: 1/np.sqrt(1 - al*np.sin(2*np.pi*t))); e5 = convtrig(g(0.5), 1024, 5)[1]; e9 = convtrig(g(0.9), 1024, 5)[1]; assert e9[-1] > 100*e5[-1], f'bei n = 32: α=0.5 → {e5[-1]:.1e}, α=0.9 → {e9[-1]:.1e}'"}, {"name": "Bild", "code": "import os; assert os.path.exists('cx_out/convtrig.png'), 'Bild fehlt'"}], "hints": ["In der Schleife: `t = np.linspace(0, 1, n, endpoint=False)`, `v = evaliptrig(f(t), N)`.", "`vlinf[i] = np.max(np.abs(v - f(tt)))`."], "ref": "Skript 3.5, Serie", "boss": false, "kind": "code"}, {"id": "ft-boss", "title": "Boss: FFT-Phönix", "text": "Implementiere die rekursive FFT für n = 2ᴸ (Code 3.3.4): Teile y in gerade und ungerade Indizes, berechne beide FFTs rekursiv und kombiniere mit den Faktoren e^{−2πik/n}. `np.fft` ist verboten. Danach: Laufzeitvergleich mit `dft`.", "template": "import numpy as np\n\ndef fftrec(y):\n    n = len(y)\n    if n == 1:\n        return y.astype(complex)\n    # TODO: c0 = fftrec(gerade), c1 = fftrec(ungerade), kombinieren\n    pass\n\ny = np.arange(8.)\nprint(np.round(fftrec(y), 6))\nprint(np.round(np.fft.fft(y), 6))\n", "solution": "", "tests": [{"name": "n = 1", "code": "assert np.allclose(fftrec(np.array([3.])), [3.]), 'n = 1'"}, {"name": "n = 2", "code": "assert np.allclose(fftrec(np.array([1., 2.])), [3., -1.]), f'{fftrec(np.array([1., 2.]))}'"}, {"name": "n = 8", "code": "y = np.random.default_rng(1).random(8); assert np.allclose(fftrec(y), np.fft.fft(y)), 'n = 8 falsch'"}, {"name": "n = 1024 komplex", "code": "y = np.random.default_rng(2).random(1024) + 1j; assert np.allclose(fftrec(y), np.fft.fft(y)), 'n = 1024 falsch'"}, {"name": "ohne np.fft", "code": "body = _SRC.split('def fftrec')[1].split('y = np.arange')[0]; assert 'np.fft' not in body, 'np.fft ist verboten'"}], "hints": ["`c0 = fftrec(y[::2])`, `c1 = fftrec(y[1::2])` – beide haben Länge n/2.", "Weil die halben DFTs n/2-periodisch sind, stapelt man sie doppelt: `np.hstack((c0, c0))`.", "`return np.hstack((c0, c0)) + np.exp(-2j*np.pi*np.arange(n)/n) * np.hstack((c1, c1))`."], "ref": "Skript 3.3, Code 3.3.4", "boss": true, "kind": "boss"}], "group": "kapitel"}, {"id": "sp", "title": "Splines", "chap": "Skript Kapitel 4", "blurb": "Stückweise linear, kubische Hermite, Splines, PCHIP.", "rooms": [{"id": "sp1", "title": "Stückweise & Hermite", "cards": [{"title": "Stückweise Interpolation", "text": "Statt eines Polynoms hohen Grades: auf jedem Teilintervall [xⱼ₋₁, xⱼ] ein Polynom niedrigen Grades.\n**Stückweise linear:** stetig, nicht differenzierbar, Fehler O(h²).\n**Kubische Hermite:** braucht Werte yⱼ **und** Ableitungen cⱼ; global C¹, Fehler O(h⁴) bei exakten cⱼ.\nBasisfunktionen auf [0, 1]: φ(t) = t²(3 − 2t) (Wert) und ψ(t) = t²(t − 1) (Ableitung).", "code": null}, {"title": "Wo kommen die cⱼ her?", "text": "Sind nur die yⱼ bekannt, muss man die cⱼ schätzen: Differenzenquotienten, **Akima**/makima, oder **PCHIP**.\nPCHIP ist **formerhaltend**: monotone Daten geben einen monotonen Interpolanten (kein Überschwingen).\nMit geschätzten Ableitungen sinkt die Konvergenzordnung (PCHIP: deutlich unter 4).", "code": null}], "qs": [{"t": "mc", "q": "Was ist der Hauptvorteil stückweiser Interpolation gegenüber einem globalen Polynom hohen Grades?", "code": null, "opts": ["Sie ist immer exakt", "Kein Runge-Phänomen: der Fehler sinkt mit kleinerem h, auch für äquidistante Punkte", "Sie braucht weniger Punkte", "Sie ist unendlich oft differenzierbar"], "a": 1, "ex": "Der Grad bleibt klein; man verfeinert h statt den Grad zu erhöhen.", "hint": null}, {"t": "mc", "q": "Welche Glattheit hat der stückweise lineare Interpolant?", "code": null, "opts": ["C⁰ (stetig, Knicke an den Knoten)", "C¹", "C²", "C^∞"], "a": 0, "ex": "An den Knoten ist er im Allgemeinen nicht differenzierbar.", "hint": null}, {"t": "mc", "q": "Welche Bedingungen legen das kubische Hermite-Polynom auf einem Teilintervall fest?", "code": null, "opts": ["4 Funktionswerte", "Werte und Ableitungen an beiden Intervallenden", "Werte und zweite Ableitungen", "nur die Werte"], "a": 1, "ex": "4 Bedingungen für 4 Koeffizienten: s(xⱼ₋₁), s(xⱼ), s'(xⱼ₋₁), s'(xⱼ).", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus? (φ ist die Hermite-Basisfunktion für Werte)", "code": "phi = lambda t: t**2*(3 - 2*t)\nprint(phi(np.array([0., 0.5, 1.])))", "opts": ["[0.  0.5 1. ]", "[0. 1. 0.]", "[1.  0.5 0. ]", "[0.   0.25 1.  ]"], "a": 0, "ex": "φ(0) = 0, φ(1) = 1 und φ'(0) = φ'(1) = 0.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus? (ψ ist die Basisfunktion für Ableitungen)", "code": "psi = lambda t: t**2*(t - 1)\nprint(psi(np.array([0., 1.])))", "opts": ["[-0.  0.]", "[0. 1.]", "[1. 0.]", "[-1.  0.]"], "a": 0, "ex": "ψ verschwindet an beiden Enden (−0. ist eine Null mit Vorzeichen, weil 0·(0−1) = −0), hat aber ψ'(1) = 1 – sie trägt nur zur Ableitung bei.", "hint": null}, {"t": "mc", "q": "Kubische Hermite-Interpolation mit exakten Ableitungen: Wie sinkt der Fehler, wenn h halbiert wird?", "code": null, "opts": ["Faktor 2", "Faktor 4", "Faktor 8", "Faktor 16"], "a": 3, "ex": "Fehler O(h⁴) → 2⁴ = 16.", "hint": null}, {"t": "mc", "q": "Welcher Interpolant garantiert, dass monotone Daten einen monotonen Interpolanten ergeben?", "code": null, "opts": ["Kubischer Spline", "Akima", "PCHIP (PchipInterpolator)", "Baryzentrische Polynom-Interpolation"], "a": 2, "ex": "PCHIP wählt die Ableitungen so, dass keine Überschwinger entstehen (Abb. 4.2.1).", "hint": null}, {"t": "mc", "q": "Bei der Variablentransformation x = xⱼ₋₁ + h·t: wie verändert sich die Ableitung?", "code": null, "opts": ["d/dx = d/dt", "d/dx = h · d/dt", "d/dx = (1/h) · d/dt", "d/dx = h² · d/dt"], "a": 2, "ex": "Kettenregel. Deshalb steht in der Hermite-Formel der Faktor h vor den cⱼψ-Termen.", "hint": null}], "kind": "quiz"}, {"id": "sp-c1", "title": "Stückweise linear", "text": "Schreibe `plin(x, y, t)`: stückweise lineare Interpolation der Daten (xⱼ, yⱼ) (x sortiert) an den Punkten t. Finde für jedes t sein Intervall mit `np.searchsorted` – `np.interp` ist verboten.", "template": "import numpy as np\n\ndef plin(x, y, t):\n    # TODO: j = Index des Intervalls [x[j-1], x[j]] für jedes t\n    pass\n\nx = np.array([0., 1., 3.]); y = np.array([0., 2., 0.])\nprint(plin(x, y, np.array([0.5, 1., 2.])))   # [1. 2. 1.]\n", "solution": "", "tests": [{"name": "Beispiel", "code": "r = plin(np.array([0., 1., 3.]), np.array([0., 2., 0.]), np.array([0.5, 1., 2.])); assert np.allclose(r, [1, 2, 1]), f'{r}'"}, {"name": "wie np.interp", "code": "x = np.sort(np.random.default_rng(1).random(10)); x[0], x[-1] = 0, 1; y = np.sin(5*x); t = np.linspace(0, 1, 77); assert np.allclose(plin(x, y, t), np.interp(t, x, y)), 'stimmt nicht mit np.interp überein'"}, {"name": "Randpunkte", "code": "x = np.array([0., 1., 2.]); assert np.allclose(plin(x, x**2, np.array([0., 2.])), [0., 4.]), 'an den Rändern falsch'"}, {"name": "ohne np.interp", "code": "body = _SRC.split('def plin')[1].split('x = np.array')[0]; assert 'interp' not in body, 'np.interp ist verboten'"}], "hints": ["`j = np.searchsorted(x, t)` gibt den Index des rechten Knotens. Mit `np.clip(j, 1, len(x)-1)` bleiben auch die Randpunkte gültig.", "Lokale Koordinate s = (t − x[j−1])/(x[j] − x[j−1]), dann `y[j-1]*(1-s) + y[j]*s`."], "ref": "Skript 4.1", "boss": false, "kind": "code"}, {"id": "sp2", "title": "Kubische Splines", "cards": [{"title": "Splines", "text": "Spline vom Grad d: stückweise Polynom vom Grad ≤ d und (d−1)-mal stetig differenzierbar.\nDimension: dim S_{d,G} = N(d+1) − (N−1)d = N + d. Kubisch (d = 3): N + 3 Freiheitsgrade, aber nur N + 1 Werte →\n**zwei Zusatzbedingungen**: vollständig (eingespannt, s' am Rand gegeben), natürlich (s'' = 0 am Rand),\nperiodisch, oder not-a-knot (s''' stetig an x₁ und x_{N−1}).\nDie cⱼ = s'(xⱼ) erfüllen ein **tridiagonales** lineares System → Aufwand O(N).", "code": null}], "qs": [{"t": "mc", "q": "Welche Glattheit hat ein kubischer Spline?", "code": null, "opts": ["C⁰", "C¹", "C² (zweimal stetig differenzierbar)", "C³"], "a": 2, "ex": "Das unterscheidet ihn von der kubischen Hermite-Interpolation (nur C¹).", "hint": null}, {"t": "mc", "q": "Wie viele Freiheitsgrade hat der Raum der kubischen Splines zu N Teilintervallen?", "code": null, "opts": ["N − 1", "N + 1", "N + 3", "4N"], "a": 2, "ex": "N(d+1) − (N−1)d mit d = 3 ergibt N + 3.", "hint": null}, {"t": "mc", "q": "Wie viele Zusatzbedingungen braucht ein interpolierender kubischer Spline neben den N + 1 Werten?", "code": null, "opts": ["0", "1", "2", "4"], "a": 2, "ex": "N + 3 − (N + 1) = 2, typischerweise eine am linken und eine am rechten Rand.", "hint": null}, {"t": "mc", "q": "Was bedeutet die Randbedingung „natürlich“?", "code": null, "opts": ["s'(a) = s'(b) = 0", "s''(a) = s''(b) = 0", "s(a) = s(b)", "s''' stetig in x₁ und x_{N−1}"], "a": 1, "ex": "Die zweite Ableitung verschwindet an den Rändern. 'not-a-knot' ist die letzte Option.", "hint": null}, {"t": "mc", "q": "Welche Struktur hat das Gleichungssystem für die Spline-Steigungen cⱼ?", "code": null, "opts": ["voll besetzt", "tridiagonal", "diagonal", "obere Dreiecksmatrix"], "a": 1, "ex": "Jede Gleichung koppelt nur cⱼ₋₁, cⱼ, cⱼ₊₁ – lösbar in O(N).", "hint": null}, {"t": "mc", "q": "Welche Randbedingung ist Standard in `scipy.interpolate.CubicSpline`?", "code": null, "opts": ["natural", "clamped", "periodic", "not-a-knot"], "a": 3, "ex": "Ohne `bc_type` wird 'not-a-knot' verwendet.", "hint": null}, {"t": "mc", "q": "Für welche Funktionen eignet sich `bc_type='periodic'`?", "code": null, "opts": ["Für alle", "Nur wenn y[0] == y[-1] (periodische Daten)", "Nur für Polynome", "Nur für monotone Daten"], "a": 1, "ex": "SciPy verlangt dann, dass erster und letzter Wert übereinstimmen.", "hint": null}, {"t": "mc", "q": "Ein kubischer Spline interpoliert eine glatte Funktion. Typische Fehlerordnung in h?", "code": null, "opts": ["O(h)", "O(h²)", "O(h⁴)", "exponentiell"], "a": 2, "ex": "Mit passenden Randbedingungen O(h⁴) – bei 'natural' für nicht passende Funktionen am Rand schlechter.", "hint": null}], "kind": "quiz"}, {"id": "sp-c2", "title": "Kubische Hermite-Interpolation", "text": "Gegeben Werte yⱼ und Ableitungen cⱼ an den Knoten. Auf [xⱼ₋₁, xⱼ] mit h = xⱼ − xⱼ₋₁, s = (t − xⱼ₋₁)/h:\np = yⱼ₋₁φ(1−s) + yⱼφ(s) + h(cⱼψ(s) − cⱼ₋₁ψ(1−s)) mit φ(s) = s²(3−2s), ψ(s) = s²(s−1) (Skript 4.2). Schreibe `hermite(x, y, c, t)`.", "template": "import numpy as np\n\ndef hermite(x, y, c, t):\n    phi = lambda s: s**2*(3 - 2*s)\n    psi = lambda s: s**2*(s - 1)\n    j = np.clip(np.searchsorted(x, t), 1, len(x) - 1)\n    # TODO\n    pass\n\nx = np.array([0., 1., 2.])\nprint(hermite(x, x**3, 3*x**2, np.array([0.5, 1.5])), np.array([0.5, 1.5])**3)\n", "solution": "", "tests": [{"name": "Kubische Polynome exakt", "code": "x = np.array([0., 0.3, 1., 2.5]); f = lambda t: t**3 - 2*t + 1; df = lambda t: 3*t**2 - 2; t = np.linspace(0, 2.5, 101); assert np.allclose(hermite(x, f(x), df(x), t), f(t)), 'kubische Polynome müssen exakt reproduziert werden'"}, {"name": "interpoliert", "code": "x = np.linspace(0, 1, 5); y = np.sin(x); assert np.allclose(hermite(x, y, np.cos(x), x), y), 'an den Knoten muss p = y gelten'"}, {"name": "Fehler O(h⁴)", "code": "e = []\nfor N in [8, 16]:\n    x = np.linspace(0, 3, N + 1); t = np.linspace(0, 3, 999); e.append(np.max(np.abs(hermite(x, np.sin(x), np.cos(x), t) - np.sin(t))))\nr = e[0]/e[1]; assert 12 < r < 20, f'Fehler-Verhältnis {r:.1f}, erwartet ≈ 16'"}], "hints": ["Wie bei `plin`: zuerst j, h und s berechnen.", "Dann die Formel direkt hinschreiben – alles vektorisiert."], "ref": "Skript 4.2", "boss": false, "kind": "code"}, {"id": "sp-c3", "title": "SciPy-Splines im Vergleich", "text": "Benutze `scipy.interpolate.CubicSpline` für f(x) = 1/(1 + 25x²) mit 21 äquidistanten Punkten auf [−1, 1], einmal mit `bc_type='natural'` und einmal mit dem Standard ('not-a-knot'). Speichere die maximalen Fehler (auf 2001 Punkten) in `err_nat` und `err_nak`. Zum Vergleich: Polynom-Interpolation divergiert hier (Runge)!", "template": "import numpy as np\nfrom scipy.interpolate import CubicSpline\n\nf = lambda x: 1/(1 + 25*x**2)\nx = np.linspace(-1, 1, 21)\nt = np.linspace(-1, 1, 2001)\n# TODO\nerr_nat = None\nerr_nak = None\nprint(err_nat, err_nak)\n", "solution": "", "tests": [{"name": "Fehler berechnet", "code": "assert err_nat is not None and err_nak is not None, 'err_nat / err_nak fehlen'"}, {"name": "Splines konvergieren", "code": "assert 0 < err_nat < 0.05 and 0 < err_nak < 0.05, f'Fehler {err_nat}, {err_nak}'"}, {"name": "verschiedene Randbedingungen", "code": "assert not np.isclose(err_nat, err_nak, rtol=1e-12, atol=0), 'die beiden Fehler sind gleich – unterschiedliche bc_type verwendet?'"}], "hints": ["`s = CubicSpline(x, f(x), bc_type='natural')` gibt ein aufrufbares Objekt: `s(t)` wertet aus.", "Ohne bc_type ist 'not-a-knot' der Standard."], "ref": "Skript 4.3", "boss": false, "kind": "code"}, {"id": "sp-c4", "title": "Formerhaltung: PCHIP", "text": "Die Daten y = [0, 0, 0, 1, 1, 1] an x = 0…5 sind monoton. Prüfe, ob die Interpolanten **über­schwingen**:\nSetze `ueber_spline = True/False` (geht `CubicSpline` irgendwo über 1 oder unter 0?) und dasselbe als\n`ueber_pchip` für `PchipInterpolator`. Werte auf 1001 Punkten aus.", "template": "import numpy as np\nfrom scipy.interpolate import CubicSpline, PchipInterpolator\n\nx = np.arange(6.)\ny = np.array([0., 0., 0., 1., 1., 1.])\nt = np.linspace(0, 5, 1001)\n# TODO\nueber_spline = None\nueber_pchip = None\nprint(ueber_spline, ueber_pchip)\n", "solution": "", "tests": [{"name": "Spline schwingt über", "code": "assert ueber_spline is True, f'ueber_spline = {ueber_spline!r}'"}, {"name": "PCHIP bleibt monoton", "code": "assert ueber_pchip is False, f'ueber_pchip = {ueber_pchip!r}'"}], "hints": ["`vs = CubicSpline(x, y)(t)` und `vp = PchipInterpolator(x, y)(t)`.", "Überschwingen: `vs.max() > 1` oder `vs.min() < 0` (mit kleiner Toleranz). Das Ergebnis mit `bool(...)` in True/False umwandeln."], "ref": "Skript 4.2 (Abb. 4.2.1)", "boss": false, "kind": "code"}, {"id": "sp-boss", "title": "Boss: Hermite-Hydra", "text": "Miss die Konvergenzordnung der kubischen Hermite-Interpolation für f(x) = sin(πx) auf [0, 2] mit N = 8, 16, …, 128 Teilintervallen, (a) mit exakten Ableitungen cⱼ = f'(xⱼ) und (b) mit geschätzten Ableitungen `np.gradient(y, x)`. Speichere die Ordnungen als `p_exakt` und `p_grad` (Steigung im log-log via polyfit).", "template": "import numpy as np\n\ndef hermite(x, y, c, t):\n    phi = lambda s: s**2*(3 - 2*s); psi = lambda s: s**2*(s - 1)\n    j = np.clip(np.searchsorted(x, t), 1, len(x) - 1)\n    h = x[j] - x[j-1]; s = (t - x[j-1]) / h\n    return y[j-1]*phi(1 - s) + y[j]*phi(s) + h*(c[j]*psi(s) - c[j-1]*psi(1 - s))\n\nf = lambda x: np.sin(np.pi*x)\ndf = lambda x: np.pi*np.cos(np.pi*x)\nNs = 2**np.arange(3, 8)\nt = np.linspace(0, 2, 5001)\n# TODO: Fehler für beide Varianten, dann Ordnungen\np_exakt = None\np_grad = None\nprint(p_exakt, p_grad)\n", "solution": "", "tests": [{"name": "p_exakt ≈ 4", "code": "assert p_exakt is not None and 3.7 < p_exakt < 4.3, f'p_exakt = {p_exakt}'"}, {"name": "p_grad deutlich kleiner", "code": "assert p_grad is not None and 1.5 < p_grad < 3.5, f'p_grad = {p_grad}'"}, {"name": "Vergleich", "code": "assert p_exakt > p_grad + 0.5, 'mit exakten Ableitungen sollte die Ordnung höher sein'"}], "hints": ["Für jedes N: Knoten `x = np.linspace(0, 2, N+1)`, dann zwei Fehler mit hermite(...).", "Ordnung: `-np.polyfit(np.log(Ns), np.log(err), 1)[0]`.", "np.gradient schätzt die Ableitungen nur mit O(h²) (am Rand sogar O(h)) – das kostet Ordnung."], "ref": "Skript 4.2 (Theorem 4.2.2)", "boss": true, "kind": "boss"}], "group": "kapitel"}, {"id": "qu", "title": "Quadratur", "chap": "Skript Kapitel 5", "blurb": "Mittelpunkt, Trapez, Simpson, Ordnung, Gauss, adaptive Quadratur.", "rooms": [{"id": "qu1", "title": "Quadratur-Grundlagen", "cards": [{"title": "Quadraturformeln", "text": "Qₙ(f) = Σ ωᵢ f(cᵢ) ≈ ∫ₐᵇ f(x) dx mit Knoten cᵢ und Gewichten ωᵢ.\nIdee: f durch ein Interpolationspolynom ersetzen und das exakt integrieren → Gewichte ωⱼ = ∫ ℓⱼ(x) dx.\n**Ordnung p:** exakt für alle Polynome vom Grad ≤ p − 1 (Definition 5.3.8). Symmetrische Formeln haben gerade Ordnung.\nMittelpunkt: Ordnung 2, Trapez: Ordnung 2, Simpson: Ordnung 4.", "code": null}, {"title": "Summierte Regeln", "text": "Intervall in N Stücke der Länge h teilen und die lokale Regel auf jedes anwenden.\nIst die lokale Regel von Ordnung p und f glatt genug, gilt: Fehler = O(hᵖ) = O(N⁻ᵖ) (Theorem 5.4.4).\nGlattheit begrenzt die Ordnung: Für f mit Knick bringt Simpson nicht mehr als Trapez.\nAb Newton-Cotes-Ordnung 8 treten negative Gewichte auf – schlecht für die Stabilität.", "code": "x, h = np.linspace(a, b, N + 1, retstep=True)\nI = h/2 * (f(x[0]) + 2*np.sum(f(x[1:-1])) + f(x[-1]))   # Trapez"}], "qs": [{"t": "mc", "q": "Wann hat eine Quadraturformel Ordnung p?", "code": null, "opts": ["Wenn sie p Knoten hat", "Wenn sie alle Polynome vom Grad ≤ p − 1 exakt integriert (und xᵖ nicht)", "Wenn der Fehler wie p·h fällt", "Wenn sie p Gewichte hat"], "a": 1, "ex": "Definition 5.3.8.", "hint": null}, {"t": "mc", "q": "Welche Ordnung hat die Mittelpunktsregel Q(f) = (b − a)·f((a + b)/2)?", "code": null, "opts": ["1", "2", "3", "4"], "a": 1, "ex": "Sie ist exakt für lineare Funktionen (Symmetrie!), nicht für x².", "hint": null}, {"t": "mc", "q": "Warum hat die Simpson-Regel Ordnung 4, obwohl sie nur auf einer Parabel (Grad 2) beruht?", "code": null, "opts": ["Zufall", "Weil sie symmetrisch ist – symmetrische Formeln haben gerade Ordnung (Theorem 5.3.11)", "Weil sie 4 Knoten hat", "Weil h klein ist"], "a": 1, "ex": "Exakt bis Grad 2 → Ordnung ≥ 3, symmetrisch → gerade → 4.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "f = lambda x: x**3\nprint(2/6 * (f(0) + 4*f(1) + f(2)))", "opts": ["4.0", "3.0", "4.666666666666667", "2.0"], "a": 0, "ex": "Simpson auf [0, 2] mit h = 1: (b−a)/6·(f(a) + 4f(m) + f(b)) = 4 – exakt, weil Ordnung 4.", "hint": null}, {"t": "mc", "q": "Die summierte Trapezregel hat Fehler O(h²). Du verdoppelst N. Der Fehler wird …", "code": null, "opts": ["halbiert", "geviertelt", "durch 16 geteilt", "gleich bleiben"], "a": 1, "ex": "h halbiert → h² geviertelt.", "hint": null}, {"t": "mc", "q": "f hat bei x = 0.5 einen Knick (nur C⁰). Was bringt Simpson gegenüber Trapez?", "code": null, "opts": ["Ordnung 4 statt 2", "Kaum etwas – die fehlende Glattheit begrenzt die Konvergenz", "Exakte Ergebnisse", "Simpson divergiert"], "a": 1, "ex": "Die Ordnung aus Theorem 5.4.4 setzt genug Glattheit voraus.", "hint": null}, {"t": "mc", "q": "Wie bekommt man die Gewichte einer interpolatorischen Quadraturformel?", "code": null, "opts": ["ωⱼ = f(cⱼ)", "ωⱼ = ∫ₐᵇ ℓⱼ(x) dx (Integral des Lagrange-Polynoms)", "ωⱼ = 1/n", "zufällig"], "a": 1, "ex": "Bemerkung 5.3.7.", "hint": null}, {"t": "mc", "q": "Was ist das Problem bei Newton-Cotes-Formeln hoher Ordnung (äquidistante Knoten)?", "code": null, "opts": ["Sie sind zu langsam", "Ab Ordnung 8 gibt es negative Gewichte → Auslöschung und Instabilität", "Sie sind nicht exakt für Konstanten", "Keines"], "a": 1, "ex": "Ausserdem steckt das Runge-Phänomen dahinter.", "hint": null}, {"t": "fill", "q": "Ergänze die summierte Simpson-Regel (2N+1 Punkte, Abstand h).", "code": "I = h/3 * np.sum(f(x[:-2:2]) + ____*f(x[1:-1:2]) + f(x[2::2]))", "acc": ["4", "4.", "4.0"], "check": "assert abs(I - (np.e - 1)) < 1e-6", "ex": "Gewichte 1, 4, 1 pro Doppelintervall.", "hint": null, "pre": "f = np.exp\nN = 8\nx, h = np.linspace(0, 1, 2*N + 1, retstep=True)"}], "kind": "quiz"}, {"id": "qu-c1", "title": "Summierte Mittelpunktsregel", "text": "Schreibe `mpr(f, a, b, N)`: summierte Mittelpunktsregel mit N gleich langen Teilintervallen, h·Σ f(Mittelpunkte). Ohne Schleife!", "template": "import numpy as np\n\ndef mpr(f, a, b, N):\n    # TODO\n    pass\n\nprint(mpr(np.exp, 0, 1, 100), np.e - 1)\n", "solution": "", "tests": [{"name": "exakt für Geraden", "code": "assert np.isclose(mpr(lambda x: 3*x + 1, 0, 2, 3), 8), 'lineare Funktionen müssen exakt sein'"}, {"name": "exp genau", "code": "assert abs(mpr(np.exp, 0, 1, 100) - (np.e - 1)) < 2e-5, 'zu ungenau'"}, {"name": "Ordnung 2", "code": "e1 = abs(mpr(np.exp, 0, 1, 10) - (np.e-1)); e2 = abs(mpr(np.exp, 0, 1, 20) - (np.e-1)); assert 3.8 < e1/e2 < 4.2, f'Verhältnis {e1/e2:.2f}, erwartet 4'"}, {"name": "ohne Schleife", "code": "body = _SRC.split('def mpr')[1].split('print(')[0]; assert 'for ' not in body, 'bitte vektorisiert'"}], "hints": ["Mittelpunkte: `a + h*(np.arange(N) + 0.5)` mit `h = (b - a)/N`.", "Ergebnis `h * np.sum(f(m))`."], "ref": "Skript 5.4", "boss": false, "kind": "code"}, {"id": "qu2", "title": "Gauss & Adaptivität", "cards": [{"title": "Gauss-Legendre und Clenshaw-Curtis", "text": "Mit n Knoten erreicht **Gauss-Legendre** die maximal mögliche Ordnung **2n** (Knoten = Nullstellen des Legendre-Polynoms Pₙ).\nGewichte sind positiv. Berechnung: Golub-Welsch (Eigenwerte einer Tridiagonalmatrix, O(n³)) oder schneller O(n).\n**Clenshaw-Curtis:** Knoten = Chebyshev-Abszissen, Gewichte via FFT in O(n log n); für glatte f fast so gut wie Gauss.", "code": null}, {"title": "Adaptive Quadratur", "text": "Idee: dort verfeinern, wo der Fehler gross ist. Lokale Fehlerschätzung = Differenz zweier Regeln\nunterschiedlicher Ordnung (z.B. |Simpson − Trapez|) – fast gratis, weil die Mittelpunkte wiederverwendet werden.\nAbbruch, wenn der geschätzte Gesamtfehler < rtol·|I| oder < abstol (für I ≈ 0).", "code": null}], "qs": [{"t": "mc", "q": "Welche Ordnung hat Gauss-Legendre mit n Knoten?", "code": null, "opts": ["n", "n + 1", "2n", "2n + 1"], "a": 2, "ex": "Exakt für alle Polynome vom Grad ≤ 2n − 1.", "hint": null}, {"t": "mc", "q": "Was sind die Gauss-Legendre-Knoten?", "code": null, "opts": ["äquidistante Punkte", "Chebyshev-Abszissen", "die Nullstellen des Legendre-Polynoms Pₙ", "zufällige Punkte"], "a": 2, "ex": "Golub-Welsch berechnet sie als Eigenwerte der Jacobi-Matrix.", "hint": null}, {"t": "mc", "q": "Welches Vorzeichen haben die Gauss-Legendre-Gewichte?", "code": null, "opts": ["immer positiv", "abwechselnd", "können negativ sein", "alle gleich"], "a": 0, "ex": "Theorem 5.5.15: bᵢ = ∫ ℓᵢ(t)² dt > 0.", "hint": null}, {"t": "mc", "q": "Was ist der Vorteil von Clenshaw-Curtis gegenüber Gauss?", "code": null, "opts": ["Höhere Ordnung", "Knoten und Gewichte via FFT in O(n log n), und die Knoten sind verschachtelt (wiederverwendbar)", "Negative Gewichte", "Exakt für alle Funktionen"], "a": 1, "ex": "Für glatte f konvergieren beide ähnlich schnell.", "hint": null}, {"t": "mc", "q": "Wie schätzt die adaptive Quadratur aus Code 5.6.2 den lokalen Fehler?", "code": null, "opts": ["Mit der exakten Lösung", "Mit |Simpson − Trapez| auf jedem Teilintervall", "Mit Monte-Carlo", "Gar nicht"], "a": 1, "ex": "Die genauere Regel liefert den Wert, die Differenz den Fehlerindikator.", "hint": null}, {"t": "mc", "q": "Wozu braucht die adaptive Quadratur eine absolute Toleranz `abstol` neben `rtol`?", "code": null, "opts": ["Damit sie schneller ist", "Falls das Integral ≈ 0 ist – dann ist eine relative Toleranz sinnlos", "Für negative Funktionen", "Gar nicht"], "a": 1, "ex": "rtol·|I| wäre dann ≈ 0 und die Rekursion würde nie aufhören.", "hint": null}, {"t": "mc", "q": "Für f(x) = exp(6 sin 2πx): wo setzt die adaptive Quadratur die meisten Punkte?", "code": null, "opts": ["gleichmässig", "dort, wo f sich schnell ändert (um die Spitze bei x ≈ 0.25)", "nur am Rand", "bei x = 0.75"], "a": 1, "ex": "Wo |Simpson − Trapez| gross ist, wird verfeinert.", "hint": null}, {"t": "mc", "q": "Gauss mit 5 Punkten integriert welche Polynome exakt?", "code": null, "opts": ["bis Grad 4", "bis Grad 5", "bis Grad 9", "bis Grad 10"], "a": 2, "ex": "Ordnung 2n = 10 → exakt bis Grad 9.", "hint": null}], "kind": "quiz"}, {"id": "qu-c2", "title": "Trapez- und Simpson-Regel", "text": "Schreibe die summierten Regeln wie im Skript (Code 5.4.6, 5.4.7):\n`trapez(f, a, b, N)` mit N Teilintervallen und `simpson(f, a, b, N)` mit N Teilintervallen (also 2N+1 Punkte).", "template": "import numpy as np\n\ndef trapez(f, a, b, N):\n    x, h = np.linspace(a, b, N + 1, retstep=True)\n    # TODO\n    pass\n\ndef simpson(f, a, b, N):\n    x, h = np.linspace(a, b, 2*N + 1, retstep=True)\n    # TODO\n    pass\n\nprint(trapez(np.exp, 0, 1, 10), simpson(np.exp, 0, 1, 10), np.e - 1)\n", "solution": "", "tests": [{"name": "Trapez exakt für Geraden", "code": "assert np.isclose(trapez(lambda x: 2*x, 0, 3, 4), 9), 'Trapez: Geraden exakt'"}, {"name": "Trapez Ordnung 2", "code": "e1 = abs(trapez(np.exp, 0, 1, 16) - (np.e-1)); e2 = abs(trapez(np.exp, 0, 1, 32) - (np.e-1)); assert 3.8 < e1/e2 < 4.2, f'Verhältnis {e1/e2:.2f}'"}, {"name": "Simpson exakt für Kubik", "code": "assert np.isclose(simpson(lambda x: x**3, 0, 2, 1), 4), 'Simpson: x³ exakt (Ordnung 4)'"}, {"name": "Simpson Ordnung 4", "code": "e1 = abs(simpson(np.exp, 0, 1, 8) - (np.e-1)); e2 = abs(simpson(np.exp, 0, 1, 16) - (np.e-1)); assert 14 < e1/e2 < 18, f'Verhältnis {e1/e2:.2f}, erwartet 16'"}], "hints": ["Trapez: Randpunkte mit Gewicht h/2, innere mit h: `h/2*(f(x[0]) + 2*np.sum(f(x[1:-1])) + f(x[-1]))`.", "Simpson: `h/3*np.sum(f(x[:-2:2]) + 4*f(x[1:-1:2]) + f(x[2::2]))` – Muster 1, 4, 1 pro Teilintervall."], "ref": "Skript Code 5.4.6–5.4.7", "boss": false, "kind": "code"}, {"id": "qu-c3", "title": "Ordnung einer Quadraturformel", "text": "Eine Quadraturformel auf [−1, 1] hat **Ordnung p**, wenn sie alle Polynome vom Grad ≤ p−1 exakt integriert und x^p nicht mehr (Definition 5.3.8). Schreibe `ordnung(knoten, gewichte)`, die p durch Testen der Monome x⁰, x¹, x², … findet. Exakt: ∫₋₁¹ xᵏ dx = (1 − (−1)^{k+1})/(k+1).", "template": "import numpy as np\n\ndef ordnung(knoten, gewichte):\n    c = np.asarray(knoten, dtype=float); w = np.asarray(gewichte, dtype=float)\n    # TODO: k = 0, 1, 2, ... bis zum ersten Fehler\n    pass\n\nprint(ordnung([0.], [2.]))                     # Mittelpunkt: 2\nprint(ordnung([-1., 0., 1.], [1/3, 4/3, 1/3]))   # Simpson: 4\n", "solution": "", "tests": [{"name": "Mittelpunktsregel: 2", "code": "assert ordnung([0.], [2.]) == 2, f'{ordnung([0.], [2.])}'"}, {"name": "Trapezregel: 2", "code": "assert ordnung([-1., 1.], [1., 1.]) == 2, f'{ordnung([-1., 1.], [1., 1.])}'"}, {"name": "Simpson: 4", "code": "assert ordnung([-1., 0., 1.], [1/3, 4/3, 1/3]) == 4, 'Simpson'"}, {"name": "Gauss 2 Punkte: 4", "code": "s = 1/np.sqrt(3); assert ordnung([-s, s], [1., 1.]) == 4, 'Gauss-2'"}, {"name": "Gauss 5 Punkte: 10", "code": "x, w = np.polynomial.legendre.leggauss(5); assert ordnung(x, w) == 10, f'{ordnung(x, w)}'"}], "hints": ["Für k = 0, 1, 2, …: vergleiche `np.sum(w * c**k)` mit dem exakten Integral (Toleranz ~1e-12).", "Das erste k, das nicht passt, ist die Ordnung."], "ref": "Skript 5.3.8–5.3.11", "boss": false, "kind": "code"}, {"id": "qu-c4", "title": "Vom Referenzintervall nach [a, b]", "text": "Knoten ĉ und Gewichte ŵ sind auf [−1, 1] gegeben. Auf [a, b] gilt cᵢ = (a+b)/2 + (b−a)/2·ĉᵢ und wᵢ = (b−a)/2·ŵᵢ. Schreibe `transformiere(knoten, gewichte, a, b)` → `(c, w)` und `quad(f, a, b, knoten, gewichte)`.", "template": "import numpy as np\n\ndef transformiere(knoten, gewichte, a, b):\n    # TODO\n    pass\n\ndef quad(f, a, b, knoten, gewichte):\n    # TODO\n    pass\n\nprint(quad(lambda x: x**3, 0, 2, [-1., 0., 1.], [1/3, 4/3, 1/3]))   # 4\n", "solution": "", "tests": [{"name": "Simpson auf [0, 2]", "code": "assert np.isclose(quad(lambda x: x**3, 0, 2, [-1., 0., 1.], [1/3, 4/3, 1/3]), 4), 'x³ auf [0, 2]'"}, {"name": "Knoten auf [2, 6]", "code": "c, w = transformiere(np.array([-1., 0., 1.]), np.array([1/3, 4/3, 1/3]), 2, 6); assert np.allclose(c, [2, 4, 6]) and np.isclose(w.sum(), 4), f'c = {c}, w = {w}'"}, {"name": "Gauss auf [0, 1]", "code": "x, w = np.polynomial.legendre.leggauss(8); assert abs(quad(np.exp, 0, 1, x, w) - (np.e - 1)) < 1e-14, 'Gauss-8 auf [0,1]'"}], "hints": ["Die Summe der Gewichte muss die Intervalllänge b − a ergeben.", "`quad` = `np.sum(w * f(c))` mit den transformierten c, w."], "ref": "Skript 5.3", "boss": false, "kind": "code"}, {"id": "qu-c5", "title": "Gauss-Legendre mit Golub-Welsch", "text": "Die Gauss-Knoten sind die Eigenwerte der symmetrischen Jacobi-Matrix J mit Nebendiagonale bᵢ = i/√(4i² − 1), i = 1…n−1; die Gewichte sind 2·(erste Komponente des Eigenvektors)² (Code 5.5.16). Schreibe `gaussquad(n)` → `(x, w)`. `leggauss` ist verboten.", "template": "import numpy as np\n\ndef gaussquad(n):\n    i = np.arange(1, n)\n    # TODO: b, J, eigh, Gewichte\n    pass\n\nx, w = gaussquad(3)\nprint(x, w)   # [-0.7746  0.  0.7746] [0.5556 0.8889 0.5556]\n", "solution": "", "tests": [{"name": "wie leggauss", "code": "for n in [2, 5, 10]:\n    x, w = gaussquad(n); xr, wr = np.polynomial.legendre.leggauss(n)\n    assert np.allclose(np.sort(x), xr) and np.allclose(w[np.argsort(x)], wr), f'n = {n} falsch'"}, {"name": "Ordnung 2n", "code": "x, w = gaussquad(4); assert np.isclose(np.sum(w*x**6), 2/7) and not np.isclose(np.sum(w*x**8), 2/9), 'Gauss mit 4 Punkten ist exakt bis Grad 7'"}, {"name": "positive Gewichte", "code": "x, w = gaussquad(12); assert np.all(w > 0) and np.isclose(w.sum(), 2), 'Gewichte positiv, Summe 2'"}, {"name": "ohne leggauss", "code": "body = _SRC.split('def gaussquad')[1].split('x, w =')[0]; assert 'leggauss' not in body, 'leggauss ist verboten'"}], "hints": ["`J = np.diag(b, -1) + np.diag(b, 1)` – symmetrisch, also `np.linalg.eigh`.", "`x, ev = np.linalg.eigh(J)`, Gewichte `2 * ev[0, :]**2`."], "ref": "Skript 5.5, Code 5.5.16", "boss": false, "kind": "code"}, {"id": "qu-c6", "title": "h-adaptive Quadratur", "text": "Implementiere `adaptquad(f, M, rtol, abstol)` nach Code 5.6.2: lokale Trapez- und Simpsonwerte auf jedem Intervall des Gitters M, Fehlerschätzung |Simpson − Trapez|, und rekursive Verfeinerung der Intervalle mit grossem Fehler.", "template": "import numpy as np\n\ndef adaptquad(f, M, rtol, abstol):\n    h = np.diff(M)\n    mp = 0.5*(M[:-1] + M[1:])\n    fx = f(M); fm = f(mp)\n    trp_loc = h*(fx[:-1] + 2*fm + fx[1:]) / 4\n    simp_loc = h*(fx[:-1] + 4*fm + fx[1:]) / 6\n    I = simp_loc.sum()\n    # TODO: Fehlerschätzung und Verfeinerung\n    return I\n\nf = lambda x: np.exp(6*np.sin(2*np.pi*x))\nprint(adaptquad(f, np.arange(11.)/10, 1e-6, 1e-10))\n", "solution": "", "tests": [{"name": "exp(6 sin 2πx)", "code": "from scipy import integrate; f = lambda x: np.exp(6*np.sin(2*np.pi*x)); ex = integrate.quad(f, 0, 1, epsabs=1e-13)[0]; I = adaptquad(f, np.arange(11.)/10, 1e-6, 1e-10); assert abs(I-ex)/ex < 1e-6, f'rel. Fehler {abs(I-ex)/ex:.1e}'"}, {"name": "Spitze bei 0", "code": "from scipy import integrate; f = lambda x: 1/(1e-4 + x**2); ex = integrate.quad(f, 0, 1, points=[0], epsabs=1e-12)[0]; I = adaptquad(f, np.linspace(0, 1, 11), 1e-6, 1e-10); assert abs(I-ex)/ex < 1e-5, f'rel. Fehler {abs(I-ex)/ex:.1e}'"}, {"name": "rekursiv", "code": "assert _SRC.count('adaptquad(') >= 3, 'adaptquad soll sich selbst aufrufen'"}], "hints": ["`est_loc = np.abs(simp_loc - trp_loc)`, `err_tot = est_loc.sum()`.", "Verfeinern, wenn `err_tot > rtol*abs(I) and err_tot > abstol`: Intervalle mit `est_loc > 0.9*err_tot/len(est_loc)` bekommen ihren Mittelpunkt dazu.", "`I = adaptquad(f, np.sort(np.append(M, mp[refcells])), rtol, abstol)`."], "ref": "Skript 5.6, Code 5.6.2", "boss": false, "kind": "code"}, {"id": "qu-boss", "title": "Boss: Quadratur-Titan", "text": "Vergleiche für f(x) = exp(x)·cos(3x) auf [0, 2] die summierte Trapez- und Simpsonregel mit N = 2, 4, …, 256 und Gauss-Legendre mit n = 1, …, 12 Punkten. Bestimme die Konvergenzordnungen `p_tr`, `p_si` (polyfit im log-log über N) und den Gauss-Fehler `err_gauss12` bei n = 12. Plotte alles (Fehler über Anzahl Funktionsauswertungen) als\n`./cx_out/quadratur.png`.", "template": "import numpy as np\nimport matplotlib.pyplot as plt\n\nf = lambda x: np.exp(x)*np.cos(3*x)\na, b = 0., 2.\nexakt = (np.exp(2)*(np.cos(6) + 3*np.sin(6)) - 1) / 10\n\ndef trapez(f, a, b, N):\n    x, h = np.linspace(a, b, N + 1, retstep=True)\n    return h/2*(f(x[0]) + 2*np.sum(f(x[1:-1])) + f(x[-1]))\n\ndef simpson(f, a, b, N):\n    x, h = np.linspace(a, b, 2*N + 1, retstep=True)\n    return h/3*np.sum(f(x[:-2:2]) + 4*f(x[1:-1:2]) + f(x[2::2]))\n\nNs = 2**np.arange(1, 9)\n# TODO: Fehler, Ordnungen p_tr, p_si, Gauss-Fehler, Plot\np_tr = p_si = err_gauss12 = None\nprint(p_tr, p_si, err_gauss12)\n", "solution": "", "tests": [{"name": "Trapez Ordnung ≈ 2", "code": "assert p_tr is not None and 1.8 < p_tr < 2.2, f'p_tr = {p_tr}'"}, {"name": "Simpson Ordnung ≈ 4", "code": "assert p_si is not None and 3.6 < p_si < 4.4, f'p_si = {p_si}'"}, {"name": "Gauss mit 12 Punkten sehr genau", "code": "assert err_gauss12 is not None and err_gauss12 < 1e-10, f'err_gauss12 = {err_gauss12}'"}, {"name": "Bild", "code": "import os; assert os.path.exists('cx_out/quadratur.png'), 'cx_out/quadratur.png fehlt'"}], "hints": ["Fehler-Arrays mit einer List-Comprehension: `np.array([abs(trapez(f, a, b, N) - exakt) for N in Ns])`.", "Bei Simpson erreicht der Fehler bei grossen N schon fast eps – fitte die Ordnung nur über die ersten N-Werte (z.B. `Ns[:6]`).", "Gauss auf [a, b]: Knoten/Gewichte aus `np.polynomial.legendre.leggauss(n)` transformieren."], "ref": "Skript 5.4–5.5", "boss": true, "kind": "boss"}], "group": "kapitel"}, {"id": "la", "title": "Lineare Algebra", "chap": "Werkzeug · numpy.linalg, scipy.linalg", "blurb": "@, dot, vdot, outer, kron, einsum, solve, lstsq, QR, SVD, LU, Cholesky, Kondition.", "rooms": [{"id": "la1", "title": "@, dot, vdot, outer, kron", "cards": [{"title": "Fünf Produkte, fünf Bedeutungen", "text": "`a * b` – elementweise (gleiche Form oder Broadcasting).\n`a @ b` oder `np.dot(a, b)` – Skalarprodukt Σ aᵢbᵢ, **ohne** Konjugation. Bei Matrizen: Matrixprodukt.\n`np.vdot(b, a)` – komplexes Skalarprodukt bᴴa: das **erste** Argument wird konjugiert.\n`np.outer(a, b)` – Tensorprodukt abᵀ, Matrix mit Einträgen aᵢbⱼ (dasselbe wie `a[:, None] * b[None, :]`).\n`np.kron(A, B)` – Kronecker-Produkt: jeder Eintrag Aᵢⱼ wird durch den Block Aᵢⱼ·B ersetzt.", "code": "a = np.array([1., 2., 3.])\nb = np.array([4.j, 5.j, 6.j])\na * b          # [ 4j 10j 18j]\nb @ a          # 32j       (keine Konjugation)\nnp.vdot(b, a)  # -32j      (b konjugiert)\nnp.outer(a, a) # 3x3-Matrix a_i a_j"}, {"title": "Formen beachten", "text": "1D-Arrays sind in NumPy weder Zeile noch Spalte. `A @ x` mit x der Länge n gibt wieder ein 1D-Array.\n`x @ A` rechnet xᵀA (Zeile mal Matrix).\n`@` verlangt Arrays mit mindestens einer Dimension – Skalar mal Matrix schreibt man mit `*`.\n`np.kron(A, B)` für A (m×n) und B (l×k) hat die Form (m·l) × (n·k).", "code": "A = np.array([[1, 2], [3, 4]])\nx = np.array([1, 1])\nA @ x   # [3 7]  Zeilensummen\nx @ A   # [4 6]  Spaltensummen"}], "qs": [{"t": "out", "q": "Was gibt dieser Code aus?", "code": "a = np.array([1, 2, 3])\nb = np.array([4, 5, 6])\nprint(a @ b)", "opts": ["32", "[ 4 10 18]", "[5 7 9]", "ValueError"], "a": 0, "ex": "1·4 + 2·5 + 3·6 = 32. Für 1D-Arrays ist `@` das Skalarprodukt.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "print(np.outer([1, 2], [3, 4]))", "opts": ["[[3 4]\n [6 8]]", "11", "[3 8]", "[[3 6]\n [4 8]]"], "a": 0, "ex": "Eintrag (i, j) ist aᵢ·bⱼ: Zeile 1 = 1·[3, 4], Zeile 2 = 2·[3, 4].", "hint": null}, {"t": "out", "q": "Komplex! Was gibt dieser Code aus?", "code": "b = np.array([1j, 2])\nprint(np.vdot(b, b))", "opts": ["(5+0j)", "(3+0j)", "5", "(-1+4j)"], "a": 0, "ex": "vdot konjugiert das erste Argument: |i|² + |2|² = 1 + 4 = 5. Das ist die Norm zum Quadrat.", "hint": null}, {"t": "out", "q": "Und ohne Konjugation?", "code": "b = np.array([1j, 2])\nprint(b @ b)", "opts": ["(3+0j)", "(5+0j)", "5", "(-1+4j)"], "a": 0, "ex": "i·i + 2·2 = −1 + 4 = 3. Für komplexe Vektoren ist `@` also **kein** Skalarprodukt im Sinne der Norm.", "hint": null}, {"t": "mc", "q": "Welche Zeile berechnet das komplexe Skalarprodukt ⟨b, a⟩ = bᴴa?", "code": null, "opts": ["b @ a", "np.dot(b, a)", "np.vdot(b, a)", "np.outer(b, a)"], "a": 2, "ex": "Nur `np.vdot` konjugiert. Alternativ `np.dot(b.conj(), a)` (Skript Code 1.3.1).", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "B = np.array([[1, 2], [3, 4]])\nprint(np.kron(np.eye(2), B))", "opts": ["[[1. 2. 0. 0.]\n [3. 4. 0. 0.]\n [0. 0. 1. 2.]\n [0. 0. 3. 4.]]", "[[1. 0. 2. 0.]\n [0. 1. 0. 2.]\n [3. 0. 4. 0.]\n [0. 3. 0. 4.]]", "[[1. 2.]\n [3. 4.]]", "[[1. 0.]\n [0. 4.]]"], "a": 0, "ex": "I ⊗ B ist eine Block-Diagonalmatrix mit B auf der Diagonale. (B ⊗ I wäre die zweite Option.)", "hint": null}, {"t": "typ", "q": "Tippe die Form (shape).", "code": "print(np.kron(np.ones((2, 3)), np.ones((4, 5))).shape)", "acc": ["(8, 15)"], "ex": "(2·4) × (3·5) – die Zeilen multiplizieren sich, die Spalten auch.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "A = np.array([[1, 2], [3, 4]])\nx = np.array([1, 1])\nprint(x @ A)", "opts": ["[4 6]", "[3 7]", "10", "[[1 2]\n [3 4]]"], "a": 0, "ex": "x @ A = xᵀA: Summe der Zeilen, also Spaltensummen. A @ x gäbe die Zeilensummen [3 7].", "hint": null}, {"t": "mc", "q": "Was passiert bei `2 @ A` (A ist eine 2×2-Matrix)?", "code": null, "opts": ["Ergebnis 2·A", "ValueError: @ braucht Arrays mit mindestens einer Dimension – für Skalare nimmt man *", "Spur von A mal 2", "A wird quadriert"], "a": 1, "ex": "Für Skalar mal Matrix schreibt man `2 * A`.", "hint": null}, {"t": "fill", "q": "Ergänze so, dass M dasselbe wie np.outer(a, b) ist (Broadcasting).", "code": "M = a[:, None] * ____", "acc": ["b[None,:]", "b[None, :]", "b", "b[np.newaxis,:]", "b[np.newaxis, :]"], "check": "assert np.allclose(M, np.outer(a, b))", "ex": "Spalte (n, 1) mal Zeile (1, m) ergibt (n, m).", "hint": null, "pre": "a = np.array([1., 2., 3.])\nb = np.array([4., 5.])"}], "kind": "quiz"}, {"id": "la-c1", "title": "Produkte-Parcours", "text": "Berechne mit den passenden NumPy-Funktionen:\n`skal` = ⟨b, a⟩ = bᴴa (komplexes Skalarprodukt, b konjugiert),\n`dyad` = a·bᵀ (Tensorprodukt, **ohne** Konjugation),\n`K` = A ⊗ B (Kronecker-Produkt),\n`y` = A·(A·v) – mit zwei Matrix-Vektor-Produkten, nicht mit A·A.", "template": "import numpy as np\na = np.array([1., 2., 3.])\nb = np.array([1j, 2., 1 - 1j])\nA = np.array([[1., 2.], [3., 4.]])\nB = np.array([[0., 1.], [1., 0.]])\nv = np.array([1., -1.])\n\nskal = None   # TODO\ndyad = None   # TODO\nK = None      # TODO\ny = None      # TODO\nprint(skal, dyad.shape if dyad is not None else None, K, y, sep='\\n')\n", "solution": "", "tests": [{"name": "skal = bᴴa", "code": "assert skal is not None and np.isclose(skal, np.sum(np.conj(b)*a)), f'skal = {skal}'"}, {"name": "dyad = a bᵀ", "code": "assert dyad is not None and np.allclose(dyad, a[:, None]*b[None, :]), 'dyad stimmt nicht (keine Konjugation!)'"}, {"name": "K = A ⊗ B", "code": "assert K is not None and K.shape == (4, 4) and np.allclose(K[2:, :2], 3*B), 'K stimmt nicht'"}, {"name": "y = A(Av)", "code": "assert y is not None and np.allclose(y, np.array([[7., 10.], [15., 22.]]) @ v), f'y = {y}'"}, {"name": "ohne A @ A", "code": "assert 'A @ A' not in _SRC and 'A@A' not in _SRC, 'bitte zwei Matrix-Vektor-Produkte statt A @ A'"}], "hints": ["`np.vdot(b, a)` konjugiert b. `np.outer(a, b)` konjugiert nicht.", "`np.kron(A, B)`; für y: `A @ (A @ v)` – Klammern bestimmen den Aufwand: O(n²) statt O(n³)."], "ref": "Skript Code 1.3.1–1.3.2", "boss": false, "kind": "code"}, {"id": "la2", "title": "einsum", "cards": [{"title": "Einstein-Summation", "text": "Jedes Argument bekommt einen Buchstaben pro Achse. **Ein Index, der in den Eingaben vorkommt, aber nicht nach `->` steht, wird aufsummiert.**\nNach `->` steht die Form des Ergebnisses. Ohne `->` werden die nicht wiederholten Indizes alphabetisch sortiert ausgegeben.", "code": "np.einsum('i,i->', a, b)        # Skalarprodukt  a @ b\nnp.einsum('i,j->ij', a, b)      # outer(a, b)\nnp.einsum('ij,j->i', A, x)      # A @ x\nnp.einsum('ik,kj->ij', A, B)    # A @ B\nnp.einsum('ii->', A)            # Spur\nnp.einsum('ii->i', A)           # Diagonale\nnp.einsum('ij->ji', A)          # Transponierte\nnp.einsum('ij->j', A)           # Spaltensummen\nnp.einsum('s,st,t->', x, A, x)  # quadratische Form xᵀAx"}], "qs": [{"t": "out", "q": "Was gibt dieser Code aus?", "code": "A = np.array([[1, 2], [3, 4]])\nprint(np.einsum('ii->', A))", "opts": ["5", "[1 4]", "10", "[[1 0]\n [0 4]]"], "a": 0, "ex": "i taucht zweimal auf und verschwindet: Σᵢ Aᵢᵢ = 1 + 4, die Spur.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "A = np.array([[1, 2], [3, 4]])\nprint(np.einsum('ij->j', A))", "opts": ["[4 6]", "[3 7]", "10", "[1 4]"], "a": 0, "ex": "i wird aufsummiert, j bleibt: Summe über die Zeilen = Spaltensummen.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "A = np.array([[1, 2], [3, 4]])\nprint(np.einsum('ij->ji', A))", "opts": ["[[1 3]\n [2 4]]", "[[1 2]\n [3 4]]", "[4 6]", "10"], "a": 0, "ex": "Nichts wird summiert, nur die Achsen vertauscht: die Transponierte.", "hint": null}, {"t": "mc", "q": "Was berechnet `np.einsum('ik,kj->ij', A, B)`?", "code": null, "opts": ["A * B", "A @ B", "A.T @ B", "np.kron(A, B)"], "a": 1, "ex": "k kommt in beiden Faktoren vor und wird summiert: Σₖ AᵢₖBₖⱼ – das Matrixprodukt.", "hint": null}, {"t": "mc", "q": "Was berechnet `np.einsum('i,j->ij', a, b)`?", "code": null, "opts": ["a @ b", "np.outer(a, b)", "a * b", "np.vdot(a, b)"], "a": 1, "ex": "Kein Index wird summiert, beide bleiben: Matrix aᵢbⱼ.", "hint": null}, {"t": "fill", "q": "Ergänze so, dass y = A @ x berechnet wird.", "code": "y = np.einsum('____', A, x)", "acc": ["ij,j->i", "ij,j"], "check": "assert np.allclose(y, A @ x)", "ex": "A hat die Indizes ij, x den Index j. j soll summiert werden, i bleibt.", "hint": null, "pre": "A = np.arange(6.).reshape(2, 3)\nx = np.array([1., 2., 3.])"}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "A = np.array([[1., 2.], [3., 4.]])\nx = np.array([1., 2.])\nprint(np.einsum('s,st,t->', x, A, x))", "opts": ["27.0", "[ 5. 11.]", "30.0", "13.0"], "a": 0, "ex": "xᵀAx = 1·1·1 + 1·2·2 + 2·3·1 + 2·4·2 = 1 + 4 + 6 + 16 = 27.", "hint": null}, {"t": "typ", "q": "Tippe die Ausgabe.", "code": "print(np.einsum('ii->i', np.arange(9).reshape(3, 3)))", "acc": ["[0 4 8]"], "ex": "'ii->i' liest die Diagonale aus.", "hint": null}, {"t": "mc", "q": "Was ist `np.einsum('ij,ij->', A, B)`?", "code": null, "opts": ["A @ B", "Summe aller Aᵢⱼ·Bᵢⱼ (Frobenius-Skalarprodukt)", "Spur von A @ B.T ist es nicht", "Ein Fehler"], "a": 1, "ex": "Beide Indizes werden summiert: Σᵢⱼ AᵢⱼBᵢⱼ = np.sum(A * B). Das ist übrigens gleich der Spur von Aᵀ B.", "hint": null}], "kind": "quiz"}, {"id": "la-c2", "title": "einsum-Übersetzer", "text": "Schreibe jede Funktion **nur mit `np.einsum`** (kein `@`, kein `.T`, kein `np.sum`, kein `np.trace`):\n`spur(A)`, `diagonale(A)`, `matvec(A, x)` = A·x, `matmul(A, B)` = A·B, `frob(A, B)` = Σᵢⱼ AᵢⱼBᵢⱼ, `transp(A)` = Aᵀ.", "template": "import numpy as np\n\ndef spur(A):       return None   # TODO\ndef diagonale(A):  return None   # TODO\ndef matvec(A, x):  return None   # TODO\ndef matmul(A, B):  return None   # TODO\ndef frob(A, B):    return None   # TODO\ndef transp(A):     return None   # TODO\n\nA = np.arange(9.).reshape(3, 3)\nprint(spur(A), diagonale(A))\n", "solution": "", "tests": [{"name": "spur & diagonale", "code": "A = np.random.default_rng(1).random((4, 4)); assert np.isclose(spur(A), np.trace(A)) and np.allclose(diagonale(A), np.diag(A)), 'spur/diagonale falsch'"}, {"name": "matvec", "code": "rng = np.random.default_rng(2); A = rng.random((3, 5)); x = rng.random(5); assert np.allclose(matvec(A, x), A @ x), 'matvec falsch'"}, {"name": "matmul (rechteckig)", "code": "rng = np.random.default_rng(3); A = rng.random((2, 4)); B = rng.random((4, 3)); assert np.allclose(matmul(A, B), A @ B), 'matmul falsch'"}, {"name": "frob & transp", "code": "rng = np.random.default_rng(4); A, B = rng.random((2, 3, 3)); assert np.isclose(frob(A, B), np.sum(A*B)) and np.allclose(transp(A), A.T), 'frob/transp falsch'"}, {"name": "nur einsum", "code": "body = _SRC.split('A = np.arange')[0]; assert all(s not in body for s in ['@', '.T', 'np.sum', 'np.trace', 'np.diag', 'dot(']), 'nur np.einsum verwenden'"}], "hints": ["Wiederholter Index wird summiert, nach `->` steht das Ergebnis.", "Spur 'ii->', Diagonale 'ii->i', A·x 'ij,j->i', A·B 'ik,kj->ij', Frobenius 'ij,ij->', Transponierte 'ij->ji'."], "ref": "Skript Code 1.3.2", "boss": false, "kind": "code"}, {"id": "la3", "title": "numpy.linalg", "cards": [{"title": "Die wichtigsten Funktionen", "text": "`np.linalg.solve(A, b)` – löst Ax = b (LU, O(n³)). `inv` nur, wenn man die Inverse wirklich braucht.\n`np.linalg.norm(x)` – 2-Norm für Vektoren, Frobenius für Matrizen; `norm(A, 2)` Spektralnorm, `norm(A, np.inf)` max. Zeilensumme.\n`np.linalg.det`, `np.linalg.matrix_rank`, `np.linalg.cond(A)` = σ_max/σ_min.\n`np.linalg.eig` (allgemein), `np.linalg.eigh` (symmetrisch: reelle Eigenwerte, **aufsteigend** sortiert).", "code": null}, {"title": "Zerlegungen: QR, SVD, lstsq", "text": "`Q, R = np.linalg.qr(A)` – reduzierte QR-Zerlegung A = QR.\n`U, s, Vh = np.linalg.svd(A)` – **s ist ein 1D-Array** (absteigend), A = U @ np.diag(s) @ Vh (bei `full_matrices=False`).\nBeste Rang-k-Approximation: `U[:, :k] * s[:k] @ Vh[:k, :]`, Fehler in der 2-Norm = s[k].\n`x, res, rank, sv = np.linalg.lstsq(A, b, rcond=None)` – Kleinste-Quadrate-Lösung.", "code": "U, s, Vh = np.linalg.svd(A, full_matrices=False)\nA2 = U[:, :2] * s[:2] @ Vh[:2, :]     # beste Rang-2-Approximation\nx = np.linalg.lstsq(A, b, rcond=None)[0]"}], "qs": [{"t": "out", "q": "Was gibt dieser Code aus?", "code": "print(np.linalg.norm([3., 4.]))", "opts": ["5.0", "7.0", "25.0", "4.0"], "a": 0, "ex": "Die Standardnorm für Vektoren ist die 2-Norm: √(9 + 16).", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "A = np.array([[1., 2.], [3., 4.]])\nprint(np.linalg.norm(A, np.inf))", "opts": ["7.0", "6.0", "5.477225575051661", "4.0"], "a": 0, "ex": "Die ∞-Norm einer Matrix ist die maximale Zeilensumme der Beträge: max(1+2, 3+4) = 7.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "A = np.array([[1., 2.], [3., 4.]])\nprint(round(np.linalg.det(A), 6))", "opts": ["-2.0", "2.0", "10.0", "-2"], "a": 0, "ex": "1·4 − 2·3 = −2. round, weil det über LU berechnet wird und kleine Rundungsfehler hat.", "hint": null}, {"t": "mc", "q": "Was gibt `np.linalg.svd(A)` zurück?", "code": null, "opts": ["U, Σ (Matrix), V", "U, s (1D, absteigend), Vh mit A = U @ np.diag(s) @ Vh", "nur die Singulärwerte", "Q, R"], "a": 1, "ex": "Achtung: s ist ein Vektor und das dritte Ergebnis ist schon Vᴴ, nicht V.", "hint": null}, {"t": "mc", "q": "Wann nimmt man `np.linalg.eigh` statt `eig`?", "code": null, "opts": ["Immer", "Bei symmetrischen/hermiteschen Matrizen – reelle Eigenwerte, aufsteigend sortiert, stabiler", "Bei Dreiecksmatrizen", "Nie"], "a": 1, "ex": "Golub-Welsch für die Gauss-Knoten nutzt genau deshalb `eigh`.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "print(np.linalg.eigh(np.array([[2., 1.], [1., 2.]]))[0])", "opts": ["[1. 3.]", "[3. 1.]", "[2. 2.]", "(1.0, 3.0)"], "a": 0, "ex": "Eigenwerte 1 und 3, von eigh aufsteigend sortiert.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus? (Vorzeichen von QR sind nicht eindeutig, darum abs)", "code": "Q, R = np.linalg.qr(np.array([[3., 0.], [4., 5.]]))\nprint(np.round(np.abs(R), 6))", "opts": ["[[5. 4.]\n [0. 3.]]", "[[3. 0.]\n [4. 5.]]", "[[5. 0.]\n [4. 3.]]", "[[1. 0.]\n [0. 1.]]"], "a": 0, "ex": "Erste Spalte [3, 4] hat Länge 5. Projektion der zweiten Spalte auf q₁ = [0.6, 0.8] ergibt 4, der Rest [−2.4, 1.8] hat Länge 3.", "hint": null}, {"t": "mc", "q": "Was liefert `np.linalg.lstsq(A, b, rcond=None)`?", "code": null, "opts": ["nur x", "(x, Residuen, Rang, Singulärwerte) – x ist das erste Element", "Q und R", "die Pseudoinverse"], "a": 1, "ex": "Darum schreibt man oft `np.linalg.lstsq(A, b, rcond=None)[0]`.", "hint": null}, {"t": "typ", "q": "Tippe die Ausgabe.", "code": "print(np.linalg.matrix_rank(np.outer([1, 2, 3], [1, 1])))", "acc": ["1"], "ex": "Ein Tensorprodukt zweier Vektoren hat immer Rang 1.", "hint": null}, {"t": "mc", "q": "Was misst `np.linalg.cond(A)`?", "code": null, "opts": ["die Determinante", "σ_max/σ_min – wie stark relative Fehler in b sich im Ergebnis von Ax = b verstärken können", "die Anzahl Nullen", "die Laufzeit"], "a": 1, "ex": "Faustregel: man verliert etwa log₁₀(cond) Stellen Genauigkeit.", "hint": null}, {"t": "bug", "q": "Die beste Rang-1-Approximation soll gebildet werden, aber es kommt ein ValueError. Welche Zeile?", "lines": ["U, s, Vh = np.linalg.svd(A)", "k = 1", "A1 = U[:, :k] @ s[:k] @ Vh[:k, :]", "err = np.linalg.norm(A - A1, 2)"], "bug": 2, "fix": "A1 = U[:, :k] * s[:k] @ Vh[:k, :]", "check": "assert np.isclose(err, np.linalg.svd(A)[1][1])", "ex": "s ist ein 1D-Array. `U[:, :k] @ s[:k]` macht daraus einen Vektor. Man skaliert die Spalten von U mit `*` (Broadcasting) – oder nimmt `np.diag(s[:k])`.", "hint": null, "pre": "A = np.array([[3., 1.], [1., 3.], [1., 1.]])"}], "kind": "quiz"}, {"id": "la-c3", "title": "Einmal zerlegen, oft lösen", "text": "Schreibe `loese_alle(A, rhs)`: rhs ist eine **Liste** von rechten Seiten b₁, b₂, … Berechne die LU-Zerlegung **einmal** mit\n`scipy.linalg.lu_factor` und löse dann jedes System mit `lu_solve`. Gib die Lösungen als Liste zurück. Prüfe anschliessend mit `scipy.linalg.lu`, dass A = P·L·U gilt.", "template": "import numpy as np\nfrom scipy.linalg import lu, lu_factor, lu_solve\n\ndef loese_alle(A, rhs):\n    # TODO: einmal lu_factor, dann lu_solve für jedes b\n    pass\n\nA = np.array([[4., 3., 0.], [3., 4., -1.], [0., -1., 4.]])\nrhs = [np.array([24., 30., -24.]), np.array([1., 0., 0.])]\nprint(loese_alle(A, rhs))\nP, L, U = lu(A)\nprint(np.allclose(A, P @ L @ U))\n", "solution": "", "tests": [{"name": "richtige Lösungen", "code": "rng = np.random.default_rng(5); A = rng.random((6, 6)) + 6*np.eye(6); bs = [rng.random(6) for _ in range(4)]; xs = loese_alle(A, bs); assert xs is not None and len(xs) == 4 and all(np.allclose(A @ x, b) for x, b in zip(xs, bs)), 'Lösungen falsch'"}, {"name": "Beispiel", "code": "xs = loese_alle(np.array([[4., 3., 0.], [3., 4., -1.], [0., -1., 4.]]), [np.array([24., 30., -24.])]); assert np.allclose(xs[0], [3, 4, -5]), f'{xs[0]}'"}, {"name": "lu_factor nur einmal", "code": "body = _SRC.split('def loese_alle')[1].split('A = np.array')[0]; assert body.count('lu_factor(') == 1 and 'lu_solve' in body and 'for' in body.split('lu_factor(')[1] and 'lu_factor' not in body.split('for')[1], 'lu_factor genau einmal vor der Schleife aufrufen'"}], "hints": ["`lu_piv = lu_factor(A)` vor der Schleife.", "`return [lu_solve(lu_piv, b) for b in rhs]`"], "ref": "Skript Kap. 7 (LU), scipy.linalg", "boss": false, "kind": "code"}, {"id": "la4", "title": "scipy.linalg", "cards": [{"title": "Mehr Zerlegungen", "text": "`scipy.linalg` hat dieselben Grundfunktionen wie `numpy.linalg` und dazu:\n`P, L, U = lu(A)` mit A = P @ L @ U (Zeilenpivotisierung).\n`lu, piv = lu_factor(A)` einmal (O(n³)), dann beliebig oft `lu_solve((lu, piv), b)` (je O(n²)).\n`cholesky(A)` für symmetrisch positiv definite A – gibt **standardmässig die obere** Matrix R mit A = RᵀR (NumPy gibt die untere L!).\n`solve_triangular(R, b, lower=False)` – Rückwärtseinsetzen in O(n²).\n`solve_banded((l, u), ab, b)` – Bandmatrizen in O(n). `qr(A, mode='economic')`, `svdvals(A)`.", "code": "from scipy.linalg import lu_factor, lu_solve, cholesky, solve_triangular\nlu_piv = lu_factor(A)\nx1 = lu_solve(lu_piv, b1)\nx2 = lu_solve(lu_piv, b2)     # kein neues O(n^3)!\nR = cholesky(S)               # S = R.T @ R"}], "qs": [{"t": "mc", "q": "`np.linalg.cholesky(A)` gibt L (untere Dreiecksmatrix). Was gibt `scipy.linalg.cholesky(A)` standardmässig?", "code": null, "opts": ["auch L", "R (obere Dreiecksmatrix) mit A = RᵀR", "L und U", "die Eigenwerte"], "a": 1, "ex": "Mit `lower=True` bekommt man auch in SciPy die untere. Eine klassische Falle!", "hint": null}, {"t": "mc", "q": "Was liefert `P, L, U = scipy.linalg.lu(A)`?", "code": null, "opts": ["A = L @ U ohne Pivot", "A = P @ L @ U mit Permutationsmatrix P", "P = Pivotindizes als Vektor", "A = U @ L"], "a": 1, "ex": "lu_factor dagegen speichert L und U kompakt in einer Matrix plus Pivot-Vektor.", "hint": null}, {"t": "mc", "q": "Warum `lu_factor` + `lu_solve` statt jedes Mal `solve`?", "code": null, "opts": ["Weil solve falsch rechnet", "Bei vielen rechten Seiten: die Zerlegung kostet einmal O(n³), jede weitere Lösung nur O(n²)", "Weil es weniger Speicher braucht", "Kein Unterschied"], "a": 1, "ex": "Typisch bei Newton-Verfahren oder Zeitschritten mit gleicher Matrix.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.linalg import solve_triangular\nR = np.array([[2., 1.], [0., 4.]])\nprint(solve_triangular(R, np.array([4., 8.])))", "opts": ["[1. 2.]", "[2. 2.]", "[2. 1.]", "[4. 2.]"], "a": 0, "ex": "Rückwärts: 4x₂ = 8 → x₂ = 2, dann 2x₁ + 2 = 4 → x₁ = 1.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.linalg import cholesky\nprint(cholesky(np.array([[4., 2.], [2., 5.]])))", "opts": ["[[2. 1.]\n [0. 2.]]", "[[2. 0.]\n [1. 2.]]", "[[4. 2.]\n [2. 5.]]", "[[2. 1.]\n [1. 2.]]"], "a": 0, "ex": "Obere Dreiecksmatrix R: r₁₁ = √4 = 2, r₁₂ = 2/2 = 1, r₂₂ = √(5 − 1) = 2. Check: RᵀR = A.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.linalg import lu\nP, L, U = lu(np.array([[1., 2.], [3., 4.]]))\nprint(L)", "opts": ["[[1.         0.        ]\n [0.33333333 1.        ]]", "[[1. 0.]\n [3. 1.]]", "[[3. 4.]\n [0. 1.]]", "[[1. 0.]\n [0. 1.]]"], "a": 0, "ex": "Mit Pivotisierung kommt die Zeile [3, 4] (grösster Betrag in Spalte 1) nach oben, darum l₂₁ = 1/3.", "hint": null}, {"t": "mc", "q": "Wofür ist `scipy.linalg.solve_banded` gut?", "code": null, "opts": ["für Zufallsmatrizen", "für Bandmatrizen, z.B. tridiagonale Systeme wie bei Splines – Aufwand O(n) statt O(n³)", "für Dreiecksmatrizen", "für Eigenwerte"], "a": 1, "ex": "Die Matrix wird dabei kompakt als (l+u+1) × n-Array übergeben.", "hint": null}, {"t": "fill", "q": "Ergänze die Lösung mit der gespeicherten LU-Zerlegung.", "code": "x = lu_solve(____, b)", "acc": ["lu_piv"], "check": "assert np.allclose(A @ x, b)", "ex": "lu_solve bekommt das Ergebnis von lu_factor (das Tupel) als erstes Argument.", "hint": null, "pre": "from scipy.linalg import lu_factor, lu_solve\nA = np.array([[4., 1.], [2., 3.]])\nb = np.array([1., 2.])\nlu_piv = lu_factor(A)"}, {"t": "mc", "q": "Welcher Aufruf löst Rx = b für eine obere Dreiecksmatrix R in O(n²)?", "code": null, "opts": ["np.linalg.inv(R) @ b", "scipy.linalg.solve_triangular(R, b)", "np.linalg.solve(R, b)", "np.linalg.lstsq(R, b)"], "a": 1, "ex": "solve und inv wissen nicht, dass R dreieckig ist, und rechnen O(n³).", "hint": null}], "kind": "quiz"}, {"id": "la-c4", "title": "Ausgleichsgerade: lstsq und QR", "text": "Passe die Gerade y ≈ c₀ + c₁·x an die Messdaten an (kleinste Quadrate), auf zwei Arten:\n`c_lstsq` mit `np.linalg.lstsq`, und `c_qr` über die QR-Zerlegung: A = QR, dann R·c = Qᵀy mit `scipy.linalg.solve_triangular`. A ist die Matrix mit den Spalten [1, x].", "template": "import numpy as np\nfrom scipy.linalg import solve_triangular\n\nx = np.array([0., 1., 2., 3., 4., 5.])\ny = np.array([1.1, 2.9, 5.2, 7.1, 8.8, 11.2])\nA = None        # TODO: Spalten [1, x]\nc_lstsq = None  # TODO\nc_qr = None     # TODO\nprint(c_lstsq, c_qr)\n", "solution": "", "tests": [{"name": "A hat Form (6, 2)", "code": "assert A is not None and A.shape == (6, 2) and np.allclose(A[:, 0], 1), 'A soll die Spalten [1, x] haben'"}, {"name": "lstsq stimmt", "code": "ref = np.polyfit(x, y, 1)[::-1]; assert c_lstsq is not None and np.allclose(c_lstsq, ref), f'c_lstsq = {c_lstsq}, erwartet {ref}'"}, {"name": "QR stimmt", "code": "ref = np.polyfit(x, y, 1)[::-1]; assert c_qr is not None and np.allclose(c_qr, ref), f'c_qr = {c_qr}'"}, {"name": "QR-Weg benutzt", "code": "assert 'qr(' in _SRC and 'solve_triangular(' in _SRC.split('import')[-1], 'np.linalg.qr und solve_triangular verwenden'"}], "hints": ["`A = np.column_stack([np.ones_like(x), x])`.", "`np.linalg.lstsq(A, y, rcond=None)[0]`.", "`Q, R = np.linalg.qr(A)`, dann `solve_triangular(R, Q.T @ y)`."], "ref": "Skript 8.1", "boss": false, "kind": "code"}, {"id": "la-c5", "title": "Bestapproximation mit SVD", "text": "Schreibe `best_rang_k(A, k)`, die die beste Rang-k-Approximation von A (in der 2-Norm) mit `np.linalg.svd` berechnet. Satz (Eckart-Young): ‖A − Aₖ‖₂ = σₖ₊₁. Teste das am Beispiel.", "template": "import numpy as np\n\ndef best_rang_k(A, k):\n    U, s, Vh = np.linalg.svd(A, full_matrices=False)\n    # TODO\n    pass\n\nA = np.random.default_rng(0).random((8, 5))\nA2 = best_rang_k(A, 2)\ns = np.linalg.svd(A, compute_uv=False)\nprint(np.linalg.norm(A - A2, 2), s[2])\n", "solution": "", "tests": [{"name": "Form", "code": "A = np.random.default_rng(1).random((7, 4)); assert best_rang_k(A, 2).shape == (7, 4), 'falsche Form'"}, {"name": "Rang k", "code": "A = np.random.default_rng(1).random((7, 4)); assert np.linalg.matrix_rank(best_rang_k(A, 2)) == 2, 'Rang ist nicht k'"}, {"name": "Eckart-Young", "code": "A = np.random.default_rng(2).random((9, 6)); s = np.linalg.svd(A, compute_uv=False)\nfor k in [1, 3, 5]:\n    assert np.isclose(np.linalg.norm(A - best_rang_k(A, k), 2), s[k]), f'k = {k}: Fehler ≠ σ_(k+1)'"}, {"name": "k = alle", "code": "A = np.random.default_rng(3).random((5, 3)); assert np.allclose(best_rang_k(A, 3), A), 'mit vollem Rang muss A herauskommen'"}], "hints": ["s ist ein 1D-Array. Spalten von U skalieren: `U[:, :k] * s[:k]`.", "`return U[:, :k] * s[:k] @ Vh[:k, :]`"], "ref": "Skript 7 (SVD)", "boss": false, "kind": "code"}, {"id": "la-c6", "title": "Cholesky & Dreieckssysteme", "text": "A ist symmetrisch positiv definit. Löse Ax = b mit `scipy.linalg.cholesky` (gibt R mit A = RᵀR) und zwei Dreieckssystemen: Rᵀz = b (vorwärts) und Rx = z (rückwärts), jeweils mit `solve_triangular`. Schreibe `chol_solve(A, b)`.", "template": "import numpy as np\nfrom scipy.linalg import cholesky, solve_triangular\n\ndef chol_solve(A, b):\n    R = cholesky(A)\n    # TODO: zwei Dreieckssysteme\n    pass\n\nA = np.array([[4., 2., 0.], [2., 5., 1.], [0., 1., 3.]])\nb = np.array([2., 1., 4.])\nprint(chol_solve(A, b), np.linalg.solve(A, b))\n", "solution": "", "tests": [{"name": "Beispiel", "code": "A = np.array([[4., 2., 0.], [2., 5., 1.], [0., 1., 3.]]); b = np.array([2., 1., 4.]); x = chol_solve(A, b); assert x is not None and np.allclose(A @ x, b), f'x = {x}'"}, {"name": "grosse SPD-Matrix", "code": "M = np.random.default_rng(1).random((30, 30)); A = M @ M.T + 30*np.eye(30); b = np.ones(30); assert np.allclose(A @ chol_solve(A, b), b), 'falsch'"}, {"name": "zweimal solve_triangular", "code": "body = _SRC.split('def chol_solve')[1].split('A = np.array')[0]; assert body.count('solve_triangular(') == 2 and 'np.linalg.solve' not in body and 'inv(' not in body, 'genau zwei Dreieckssysteme lösen, ohne solve/inv'"}], "hints": ["SciPys cholesky gibt die **obere** R. Rᵀ ist unten: `solve_triangular(R.T, b, lower=True)`.", "Dann rückwärts: `solve_triangular(R, z)`."], "ref": "Skript Kap. 7 (Cholesky)", "boss": false, "kind": "code"}, {"id": "la-boss", "title": "Boss: Hilbert-Hydra", "text": "Die Hilbert-Matrix Hᵢⱼ = 1/(i + j + 1) (i, j = 0…n−1) ist extrem schlecht konditioniert. Für n = 2, 3, …, 13: baue H **mit Broadcasting**, berechne `conds[i] = np.linalg.cond(H)`, löse H x = H·1 mit `np.linalg.solve` und speichere den relativen Fehler `errs[i] = ‖x − 1‖ / ‖1‖`. Zeichne beide über n im `semilogy`-Plot als `./cx_out/hilbert.png`. Beobachte: Fehler ≈ cond · eps.", "template": "import numpy as np\nimport matplotlib.pyplot as plt\n\nns = np.arange(2, 14)\nconds = np.zeros(len(ns))\nerrs = np.zeros(len(ns))\n\ndef hilbert(n):\n    # TODO: Broadcasting, keine Schleife\n    pass\n\n# TODO: Schleife über ns, Plot\nprint(conds); print(errs)\n", "solution": "", "tests": [{"name": "hilbert(3) korrekt", "code": "H = hilbert(3); assert H is not None and np.allclose(H, [[1, 1/2, 1/3], [1/2, 1/3, 1/4], [1/3, 1/4, 1/5]]), 'hilbert(3) falsch'"}, {"name": "ohne Schleife", "code": "body = _SRC.split('def hilbert')[1].split('# TODO: Schleife')[0].split('for k')[0]; assert 'for ' not in body, 'hilbert(n) ohne Schleife (Broadcasting)'"}, {"name": "Konditionszahlen", "code": "assert conds[0] > 10 and conds[-1] > 1e16, f'conds = {conds}'"}, {"name": "Fehler wächst", "code": "assert errs[0] < 1e-13 and errs[-1] > 1e-5, f'errs = {errs}'"}, {"name": "Fehler ≲ cond·eps", "code": "assert np.all(errs[:-2] < 100*conds[:-2]*np.finfo(float).eps), 'Fehler grösser als cond·eps?'"}, {"name": "Bild", "code": "import os; assert os.path.exists('cx_out/hilbert.png') and 'semilogy' in _SRC, 'semilogy-Bild cx_out/hilbert.png fehlt'"}], "hints": ["`i = np.arange(n)`, dann `1. / (i[:, None] + i[None, :] + 1)`.", "In der Schleife: `x = np.linalg.solve(H, H @ np.ones(n))`, Fehler `np.linalg.norm(x - 1) / np.linalg.norm(np.ones(n))`.", "Faustregel: man verliert log₁₀(cond) Stellen – bei n = 13 ist cond ≈ 10¹⁸, also ist nichts mehr genau."], "ref": "Kondition (Kap. 7)", "boss": true, "kind": "boss"}], "group": "tools"}, {"id": "sc", "title": "SciPy-Werkzeuge", "chap": "Werkzeug · interpolate, fft, integrate, optimize", "blurb": "Interpolatoren, DCT, quad, simpson, roots_legendre, brentq, newton, fsolve, curve_fit.", "rooms": [{"id": "sc1", "title": "scipy.interpolate", "cards": [{"title": "Interpolatoren sind Objekte", "text": "Alle Interpolatoren werden mit den Daten erzeugt und dann **wie eine Funktion aufgerufen**:\n`BarycentricInterpolator(x, y)` – Polynom-Interpolation, baryzentrisch und stabil.\n`CubicSpline(x, y, bc_type='not-a-knot')` – kubischer Spline; `s(t, 1)` gibt die erste Ableitung, `s.derivative()` eine neue Spline.\n`PchipInterpolator(x, y)` – formerhaltend, monoton. `Akima1DInterpolator(x, y, method='makima')`.\n`np.interp(t, x, y)` – stückweise linear (x aufsteigend).", "code": "from scipy.interpolate import BarycentricInterpolator, CubicSpline\np = BarycentricInterpolator(x, y)\ns = CubicSpline(x, y, bc_type='natural')\nt = np.linspace(x[0], x[-1], 500)\np(t), s(t), s(t, 1)   # Werte und Ableitung"}], "qs": [{"t": "mc", "q": "Was gibt `CubicSpline(x, y)` zurück?", "code": null, "opts": ["ein Array mit Werten", "ein aufrufbares Objekt: s(t) wertet den Spline aus", "die Koeffizienten als Liste", "nichts, es plottet"], "a": 1, "ex": "Darum: erst `s = CubicSpline(x, y)`, dann `s(t)`.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.interpolate import BarycentricInterpolator\np = BarycentricInterpolator([0., 1., 2.], [1., 3., 7.])\nprint(round(float(p(0.5)), 6))", "opts": ["1.75", "2.0", "3.0", "[1.75 3.   7.  ]"], "a": 0, "ex": "Das Interpolationspolynom ist x² + x + 1, bei 0.5: 0.25 + 0.5 + 1. (round, weil sonst 1.7500000000000002 – Rundungsfehler der Formel.)", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.interpolate import CubicSpline\ns = CubicSpline([0., 1., 2., 3.], [0., 1., 8., 27.])\nprint(round(float(s(1.5)), 6))", "opts": ["3.375", "4.5", "3.0", "4.0"], "a": 0, "ex": "Mit 4 Punkten und not-a-knot ist der Spline genau das kubische Interpolationspolynom, hier x³: 1.5³ = 3.375.", "hint": null}, {"t": "out", "q": "Und die Ableitung?", "code": "from scipy.interpolate import CubicSpline\ns = CubicSpline([0., 1., 2., 3.], [0., 1., 8., 27.])\nprint(round(float(s(2.0, 1)), 6))", "opts": ["12.0", "8.0", "6.0", "4.0"], "a": 0, "ex": "Das zweite Argument ist die Ableitungsordnung: (x³)' = 3x² = 12 bei x = 2.", "hint": null}, {"t": "mc", "q": "Welche Eigenschaft hat `PchipInterpolator`?", "code": null, "opts": ["C²-glatt", "formerhaltend: monotone Daten → monotoner Interpolant", "immer exakt für Polynome", "periodisch"], "a": 1, "ex": "Dafür ist er nur C¹ und konvergiert langsamer.", "hint": null}, {"t": "mc", "q": "Was berechnet `np.interp(t, x, y)`?", "code": null, "opts": ["einen kubischen Spline", "stückweise lineare Interpolation (x muss aufsteigend sein)", "das Interpolationspolynom", "eine FFT"], "a": 1, "ex": "Ausserhalb von [x₀, xₙ] wird der Randwert konstant fortgesetzt.", "hint": null}, {"t": "mc", "q": "Welche Randbedingung verlangt, dass y[0] == y[-1]?", "code": null, "opts": ["'natural'", "'not-a-knot'", "'periodic'", "'clamped'"], "a": 2, "ex": "Sonst gibt CubicSpline einen ValueError.", "hint": null}, {"t": "fill", "q": "Ergänze für einen natürlichen Spline.", "code": "s = CubicSpline(x, y, bc_type='____')", "acc": ["natural"], "check": "assert abs(s(x[0], 2)) < 1e-12 and abs(s(x[-1], 2)) < 1e-12", "ex": "Natürlich = zweite Ableitung am Rand gleich 0.", "hint": null, "pre": "from scipy.interpolate import CubicSpline\nx = np.linspace(0, 3, 7)\ny = np.sin(x)"}], "kind": "quiz"}, {"id": "sc-c1", "title": "BarycentricInterpolator gegen Runge", "text": "Interpoliere f(x) = 1/(1 + 25x²) mit `scipy.interpolate.BarycentricInterpolator` an n+1 **Chebyshev-Abszissen** cos(kπ/n) für n = 10, 20, 40, 80 und speichere die maximalen Fehler (auf 2001 Punkten) in `err_ch`. Zum Vergleich: `err_eq20` für 21 äquidistante Punkte.", "template": "import numpy as np\nfrom scipy.interpolate import BarycentricInterpolator\n\nf = lambda x: 1 / (1 + 25*x**2)\nt = np.linspace(-1, 1, 2001)\nns = [10, 20, 40, 80]\nerr_ch = np.zeros(len(ns))\nerr_eq20 = None\n# TODO\nprint(err_ch, err_eq20)\n", "solution": "", "tests": [{"name": "Chebyshev konvergiert", "code": "assert err_ch[-1] < 1e-6 and np.all(np.diff(err_ch) < 0), f'err_ch = {err_ch}'"}, {"name": "äquidistant schlecht", "code": "assert err_eq20 is not None and err_eq20 > 10, f'err_eq20 = {err_eq20}'"}, {"name": "BarycentricInterpolator benutzt", "code": "assert 'BarycentricInterpolator(' in _SRC.split('import')[-1], 'BarycentricInterpolator verwenden'"}], "hints": ["`x = np.cos(np.arange(n + 1) * np.pi / n)`, `p = BarycentricInterpolator(x, f(x))`, dann `p(t)`.", "Fehler: `np.max(np.abs(p(t) - f(t)))`."], "ref": "Skript 2.4, scipy.interpolate", "boss": false, "kind": "code"}, {"id": "sc2", "title": "numpy.fft & scipy.fft", "cards": [{"title": "FFT-Werkzeuge", "text": "`np.fft.fft / ifft` – volle DFT. `np.fft.fftfreq(n, d)` – Frequenzen k/(n·d) in FFT-Reihenfolge. `fftshift` – Frequenz 0 in die Mitte.\n`np.fft.rfft(y)` – für **reelle** y nur die Frequenzen 0 … n/2 (Länge n//2 + 1), weil c₋ₖ = conj(cₖ). Zurück mit `irfft(c, n)`.\n`scipy.fft` hat dieselben Funktionen (oft schneller) und zusätzlich `dct`/`idct` und `dst`.", "code": null}, {"title": "DCT für Chebyshev", "text": "Werte an den Chebyshev-**Knoten** xⱼ = cos((j + ½)π/N): `c = dct(y, type=2) / N`, dann `c[0] /= 2`.\nWerte an den Chebyshev-**Abszissen** xⱼ = cos(jπ/n): `c = dct(y, type=1) / n`, dann `c[0] /= 2` und `c[-1] /= 2`.\nSo bekommt man die Chebyshev-Koeffizienten in O(n log n) (Skript 3.6).", "code": "from scipy.fft import dct\nN = 16\nx = np.cos((np.arange(N) + 0.5) * np.pi / N)\nc = dct(f(x), type=2) / N\nc[0] /= 2"}], "qs": [{"t": "typ", "q": "Tippe die Form (shape).", "code": "print(np.fft.rfft(np.ones(8)).shape)", "acc": ["(5,)"], "ex": "rfft gibt n//2 + 1 = 5 Koeffizienten (Frequenzen 0 bis 4).", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "print(np.fft.fftfreq(8, d=0.5))", "opts": ["[ 0.    0.25  0.5   0.75 -1.   -0.75 -0.5  -0.25]", "[ 0.  1.  2.  3. -4. -3. -2. -1.]", "[0.   0.25 0.5  0.75 1.   1.25 1.5  1.75]", "[-1.   -0.75 -0.5  -0.25  0.    0.25  0.5   0.75]"], "a": 0, "ex": "fftfreq(n, d) = k/(n·d). Mit d = 0.5 (Abtastabstand) und n = 8: Schritt 0.25, negative Frequenzen hinten.", "hint": null}, {"t": "mc", "q": "Warum genügt bei reellen Daten `rfft`?", "code": null, "opts": ["weil reelle Daten keine Frequenzen haben", "weil c₋ₖ = conj(cₖ) – die negativen Frequenzen tragen keine neue Information", "weil rfft genauer ist", "das stimmt nicht"], "a": 1, "ex": "Das spart die Hälfte der Arbeit und des Speichers.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.fft import fft\nprint(np.allclose(fft(np.arange(4.)), np.fft.fft(np.arange(4.))))", "opts": ["True", "False"], "a": 0, "ex": "scipy.fft.fft und np.fft.fft berechnen dieselbe DFT (gleiche Normierung).", "hint": null}, {"t": "mc", "q": "Welcher DCT-Typ gehört zu den Chebyshev-Knoten cos((j + ½)π/N)?", "code": null, "opts": ["Typ 1", "Typ 2", "Typ 3", "Typ 4"], "a": 1, "ex": "Knoten → DCT-II, Abszissen → DCT-I (Skript 3.6.2).", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.fft import dct\nprint(np.round(dct(np.array([1., 1., 1.]), type=2), 6))", "opts": ["[6. 0. 0.]", "[3. 0. 0.]", "[1. 1. 1.]", "[2. 0. 0.]"], "a": 0, "ex": "SciPys DCT-II ohne Normierung hat den Faktor 2: y₀ = 2·Σxₙ = 6. Darum teilt man für Chebyshev durch N und halbiert c₀.", "hint": null}, {"t": "typ", "q": "Tippe die Ausgabe.", "code": "y = np.array([1., 2., 3., 4.])\nprint(np.round(np.fft.irfft(np.fft.rfft(y)), 6))", "acc": ["[1. 2. 3. 4.]"], "ex": "irfft macht rfft rückgängig (die Länge n wird aus der Eingabe erschlossen, bei ungeradem n muss man sie angeben).", "hint": null}, {"t": "fill", "q": "Ergänze so, dass k die Frequenzen in FFT-Reihenfolge enthält: 0, 1, …, −1.", "code": "k = np.fft.____(n, 1/n)", "acc": ["fftfreq"], "check": "assert list(k) == [0, 1, 2, 3, -4, -3, -2, -1]", "ex": "Die Funktion für die Frequenzen heisst fft…freq.", "hint": null, "pre": "n = 8"}], "kind": "quiz"}, {"id": "sc-c2", "title": "Chebyshev-Koeffizienten mit DCT", "text": "Schreibe `cheb_koeff(f, N)`: Werte f an den N Chebyshev-**Knoten** xⱼ = cos((j + ½)π/N) aus und berechne die Koeffizienten c₀, …, c_{N−1} der Chebyshev-Interpolation mit `scipy.fft.dct(y, type=2)`: c = dct/N, dann c₀ halbieren. Werte das Ergebnis mit `np.polynomial.chebyshev.chebval` aus.", "template": "import numpy as np\nfrom scipy.fft import dct\n\ndef cheb_koeff(f, N):\n    j = np.arange(N)\n    x = np.cos((j + 0.5) * np.pi / N)\n    # TODO\n    pass\n\nc = cheb_koeff(np.exp, 12)\nt = np.linspace(-1, 1, 7)\nprint(np.max(np.abs(np.polynomial.chebyshev.chebval(t, c) - np.exp(t))))\n", "solution": "", "tests": [{"name": "T₃ exakt", "code": "c = cheb_koeff(lambda x: 4*x**3 - 3*x, 6); assert c is not None and np.allclose(c, [0, 0, 0, 1, 0, 0]), f'c = {np.round(c, 6)}'"}, {"name": "wie chebinterpolate", "code": "c = cheb_koeff(np.cos, 10); assert np.allclose(c, np.polynomial.chebyshev.chebinterpolate(np.cos, 9)), 'stimmt nicht mit chebinterpolate überein'"}, {"name": "exp genau", "code": "c = cheb_koeff(np.exp, 16); t = np.linspace(-1, 1, 101); assert np.max(np.abs(np.polynomial.chebyshev.chebval(t, c) - np.exp(t))) < 1e-14, 'zu ungenau'"}, {"name": "dct benutzt", "code": "assert 'dct(' in _SRC.split('def cheb_koeff')[1], 'scipy.fft.dct verwenden'"}], "hints": ["`c = dct(f(x), type=2) / N`", "Danach `c[0] /= 2` und `return c`."], "ref": "Skript 3.6, scipy.fft", "boss": false, "kind": "code"}, {"id": "sc3", "title": "scipy.integrate & roots_legendre", "cards": [{"title": "Integrieren mit SciPy", "text": "`I, err = integrate.quad(f, a, b)` – adaptive Gauss-Kronrod-Quadratur, gibt **ein Tupel** (Wert, Fehlerschätzung). Auch a, b = ±np.inf.\nHilfreiche Optionen: `points=[...]` (Knicke/Spitzen), `limit=`, `epsabs=`, `args=(…)`.\nNur Abtastwerte? `integrate.trapezoid(y, x=x)` und `integrate.simpson(y, x=x)` (die alten Namen trapz/simps gibt es nicht mehr).\n`integrate.fixed_quad(f, a, b, n=5)` – Gauss-Legendre mit n Punkten. `dblquad` für 2D.", "code": null}, {"title": "roots_legendre", "text": "`x, w = scipy.special.roots_legendre(n)` – Gauss-Legendre-Knoten und -Gewichte auf [−1, 1] (wie `np.polynomial.legendre.leggauss`).\nExakt für Polynome bis Grad 2n − 1. Auf [a, b] transformieren:", "code": "from scipy.special import roots_legendre\nx, w = roots_legendre(n)\nI = (b - a)/2 * np.sum(w * f((a + b)/2 + (b - a)/2 * x))"}], "qs": [{"t": "mc", "q": "Was gibt `integrate.quad(f, a, b)` zurück?", "code": null, "opts": ["nur den Wert", "ein Tupel (Wert, Schätzung des absoluten Fehlers)", "ein Array", "die Stammfunktion"], "a": 1, "ex": "Darum `I, err = quad(...)` oder `quad(...)[0]`.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy import integrate\nI, err = integrate.quad(lambda x: x**2, 0, 3)\nprint(round(I, 10))", "opts": ["9.0", "27.0", "(9.0, 1e-13)", "3.0"], "a": 0, "ex": "∫₀³ x² dx = 27/3 = 9.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.special import roots_legendre\nx, w = roots_legendre(2)\nprint(np.round(x, 6), w)", "opts": ["[-0.57735  0.57735] [1. 1.]", "[-1.  1.] [1. 1.]", "[0.] [2.]", "[-0.774597  0.        0.774597] [0.555556 0.888889 0.555556]"], "a": 0, "ex": "Zwei Gauss-Punkte ±1/√3 mit Gewichten 1. Exakt bis Grad 3.", "hint": null}, {"t": "mc", "q": "roots_legendre(n): bis zu welchem Polynomgrad ist die Formel exakt?", "code": null, "opts": ["n − 1", "n", "2n − 1", "2n"], "a": 2, "ex": "Ordnung 2n, also exakt für Grad ≤ 2n − 1.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.integrate import simpson\nx = np.linspace(0, 2, 5)\nprint(round(simpson(x**3, x=x), 10))", "opts": ["4.0", "4.25", "2.0", "8.0"], "a": 0, "ex": "Simpson ist exakt für Polynome bis Grad 3: ∫₀² x³ dx = 4.", "hint": null}, {"t": "mc", "q": "Wann nimmt man `simpson(y, x=x)` statt `quad`?", "code": null, "opts": ["Nie", "wenn man nur Messwerte/Abtastwerte hat, keine Funktion", "wenn die Funktion glatt ist", "für unendliche Intervalle"], "a": 1, "ex": "quad braucht eine Funktion, die es an selbst gewählten Stellen auswerten kann.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy import integrate\nI = integrate.quad(lambda x: np.exp(-x**2), -np.inf, np.inf)[0]\nprint(round(I**2, 8))", "opts": ["3.14159265", "1.77245385", "1.0", "2.71828183"], "a": 0, "ex": "Das Gauss-Integral ist √π, zum Quadrat also π. quad kann unendliche Grenzen.", "hint": null}, {"t": "fill", "q": "Ergänze die Transformation der Gauss-Knoten von [−1, 1] auf [a, b].", "code": "I = (b - a)/2 * np.sum(w * f(____))", "acc": ["(a+b)/2+(b-a)/2*x", "(b-a)/2*x+(a+b)/2", "a+(b-a)*(x+1)/2", "(a+b)/2+x*(b-a)/2", "0.5*(a+b)+0.5*(b-a)*x"], "check": "assert abs(I - (np.e**2 - np.e)) < 1e-10", "ex": "Mittelpunkt (a+b)/2 plus halbe Länge mal x.", "hint": null, "pre": "from scipy.special import roots_legendre\nx, w = roots_legendre(8)\nf = np.exp\na, b = 1., 2."}, {"t": "mc", "q": "Was macht `integrate.fixed_quad(f, a, b, n=5)`?", "code": null, "opts": ["adaptiv bis 5 Stellen", "Gauss-Legendre mit genau 5 Punkten auf [a, b]", "5 Trapez-Schritte", "Monte-Carlo mit 5 Punkten"], "a": 1, "ex": "Es gibt (Wert, None) zurück – ohne Fehlerschätzung.", "hint": null}], "kind": "quiz"}, {"id": "sc-c3", "title": "Gauss mit roots_legendre", "text": "Schreibe `gauss(f, a, b, n)` mit `scipy.special.roots_legendre(n)` (Knoten auf [a, b] transformieren). Vergleiche mit `scipy.integrate.fixed_quad`, das dasselbe tut.", "template": "import numpy as np\nfrom scipy.special import roots_legendre\nfrom scipy.integrate import fixed_quad\n\ndef gauss(f, a, b, n):\n    x, w = roots_legendre(n)\n    # TODO\n    pass\n\nprint(gauss(np.exp, 0, 1, 5), fixed_quad(np.exp, 0, 1, n=5)[0], np.e - 1)\n", "solution": "", "tests": [{"name": "wie fixed_quad", "code": "assert np.isclose(gauss(np.sin, 0, 2, 6), fixed_quad(np.sin, 0, 2, n=6)[0], rtol=1e-14), 'stimmt nicht mit fixed_quad überein'"}, {"name": "exakt bis Grad 2n−1", "code": "p = lambda x: x**7 - 2*x**3; ex = (3**8 - 1)/8 - 2*(3**4 - 1)/4; assert np.isclose(gauss(p, 1, 3, 4), ex), 'Grad 7 mit n = 4 muss exakt sein'"}, {"name": "nicht exakt für Grad 2n", "code": "ex = (3**9 - 1)/9; assert not np.isclose(gauss(lambda x: x**8, 1, 3, 4), ex, rtol=1e-12), 'Grad 8 mit n = 4 sollte nicht exakt sein'"}], "hints": ["Transformation: `(a + b)/2 + (b - a)/2 * x`, Gewichte mal `(b - a)/2`.", "`return (b - a)/2 * np.sum(w * f((a + b)/2 + (b - a)/2 * x))`"], "ref": "Skript 5.5", "boss": false, "kind": "code"}, {"id": "sc4", "title": "scipy.optimize", "cards": [{"title": "Nullstellen", "text": "**1D:** `brentq(f, a, b)` – braucht einen Vorzeichenwechsel f(a)·f(b) < 0, dann sehr robust (Bisektion + Interpolation).\n`bisect(f, a, b)`, `newton(f, x0, fprime=df)` – Newton; **ohne fprime** macht newton das Sekantenverfahren.\n**Systeme:** `fsolve(F, x0)` gibt das Array x zurück; `root(F, x0, jac=J)` gibt ein Objekt mit `.x`, `.success`.", "code": null}, {"title": "Minimieren & Ausgleich", "text": "`res = minimize(f, x0, method='BFGS')` →
