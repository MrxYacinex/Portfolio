 `res.x`, `res.fun`, `res.success`.\n`popt, pcov = curve_fit(model, xdata, ydata, p0=...)` – nichtlinearer Ausgleich; model(x, *params).\n`res = least_squares(residuen, x0)` → `res.x` (Gauss-Newton/Levenberg-Marquardt-artig).", "code": "from scipy.optimize import brentq, newton, fsolve, minimize, curve_fit\nr = brentq(lambda x: np.cos(x) - x, 0, 1)\nmodel = lambda t, A, lam: A*np.exp(-lam*t)\npopt, pcov = curve_fit(model, t, y, p0=[1., 1.])"}], "qs": [{"t": "mc", "q": "Was braucht `brentq(f, a, b)`?", "code": null, "opts": ["eine Ableitung", "einen Vorzeichenwechsel: f(a) und f(b) haben verschiedene Vorzeichen", "einen Startwert", "nichts"], "a": 1, "ex": "Dann liegt nach dem Zwischenwertsatz eine Nullstelle in [a, b].", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.optimize import brentq\nprint(round(brentq(lambda x: x**2 - 2, 0, 2), 10))", "opts": ["1.4142135624", "2.0", "1.0", "-1.4142135624"], "a": 0, "ex": "Die positive Nullstelle √2 liegt in [0, 2].", "hint": null}, {"t": "mc", "q": "Was macht `newton(f, x0)` ohne `fprime`?", "code": null, "opts": ["Fehler", "das Sekantenverfahren", "Bisektion", "Newton mit numerischer Ableitung via komplexem Schritt"], "a": 1, "ex": "Mit `fprime=df` ist es das echte Newton-Verfahren (quadratische Konvergenz).", "hint": null}, {"t": "mc", "q": "Was geben `root` und `minimize` zurück?", "code": null, "opts": ["ein Array", "ein OptimizeResult-Objekt mit .x, .success, .fun …", "ein Tupel (x, f)", "nichts"], "a": 1, "ex": "fsolve dagegen gibt direkt das Array zurück.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.optimize import fsolve\nprint(np.round(fsolve(lambda v: [v[0] + v[1] - 3, v[0] - v[1] - 1], [0, 0]), 6))", "opts": ["[2. 1.]", "[1. 2.]", "[3. 1.]", "[0. 0.]"], "a": 0, "ex": "x + y = 3 und x − y = 1 → x = 2, y = 1.", "hint": null}, {"t": "mc", "q": "Was gibt `curve_fit(model, x, y)` zurück?", "code": null, "opts": ["nur die Parameter", "(popt, pcov): optimale Parameter und ihre Kovarianzmatrix", "das gefittete y", "ein OptimizeResult"], "a": 1, "ex": "Die Wurzel der Diagonale von pcov schätzt die Unsicherheit der Parameter.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "from scipy.optimize import minimize\nr = minimize(lambda v: (v[0] - 1)**2 + (v[1] + 2)**2, [0., 0.])\nprint(np.round(r.x, 4))", "opts": ["[ 1. -2.]", "[0. 0.]", "[-1.  2.]", "[1. 2.]"], "a": 0, "ex": "Das Minimum der Summe zweier Quadrate liegt bei (1, −2).", "hint": null}, {"t": "mc", "q": "Was passiert bei `brentq(lambda x: x**2 + 1, -1, 1)`?", "code": null, "opts": ["gibt 0", "ValueError: f(a) and f(b) must have different signs", "Endlosschleife", "gibt eine komplexe Zahl"], "a": 1, "ex": "x² + 1 hat keine reelle Nullstelle – und an beiden Rändern dasselbe Vorzeichen.", "hint": null}, {"t": "fill", "q": "Ergänze so, dass x_opt die Lösung enthält.", "code": "res = minimize(f, [0., 0.])\nx_opt = res.____", "acc": ["x"], "check": "assert np.allclose(x_opt, [3, -1], atol=1e-4)", "ex": "Das Attribut für den Lösungsvektor heisst wie die Variable in der Mathematik.", "hint": null, "pre": "from scipy.optimize import minimize\nf = lambda v: (v[0] - 3)**2 + (v[1] + 1)**2"}], "kind": "quiz"}, {"id": "sc-c4", "title": "quad, trapezoid, simpson", "text": "Für f(x) = eˣ·sin(3x) auf [0, 2]: Berechne `I_quad` mit `integrate.quad` (nur den Wert), und aus den Abtastwerten an 33 äquidistanten Punkten `I_trap` mit `integrate.trapezoid` und `I_simp` mit `integrate.simpson`. Speichere die Fehler `e_trap`, `e_simp` gegenüber dem exakten Wert.", "template": "import numpy as np\nfrom scipy import integrate\n\nf = lambda x: np.exp(x) * np.sin(3*x)\nexakt = (np.exp(2)*(np.sin(6) - 3*np.cos(6)) + 3) / 10\nx = np.linspace(0, 2, 33)\n# TODO\nI_quad = I_trap = I_simp = None\ne_trap = e_simp = None\nprint(I_quad, e_trap, e_simp)\n", "solution": "", "tests": [{"name": "quad genau (nur der Wert!)", "code": "assert isinstance(I_quad, float) and abs(I_quad - exakt) < 1e-12, f'I_quad = {I_quad!r} – quad gibt ein Tupel zurück, nimm [0]'"}, {"name": "trapezoid", "code": "assert I_trap is not None and abs(I_trap - np.trapezoid(f(x), x)) < 1e-14 if hasattr(np, 'trapezoid') else abs(e_trap - 0.0236) < 0.01, 'I_trap falsch'"}, {"name": "simpson genauer", "code": "assert e_simp is not None and e_simp < e_trap / 50, f'e_trap = {e_trap}, e_simp = {e_simp}'"}, {"name": "SciPy-Funktionen", "code": "assert 'trapezoid(' in _SRC and 'simpson(' in _SRC, 'integrate.trapezoid und integrate.simpson verwenden'"}], "hints": ["`integrate.quad(f, 0, 2)[0]` – das [0] nicht vergessen.", "`integrate.trapezoid(f(x), x=x)` und `integrate.simpson(f(x), x=x)`."], "ref": "scipy.integrate", "boss": false, "kind": "code"}, {"id": "sc-c5", "title": "Nullstellen-Werkzeugkasten", "text": "f(x) = cos(x) − x hat eine Nullstelle in [0, 1]. Finde sie dreimal:\n`r_brent` mit `brentq`, `r_newton` mit `newton` **und** Ableitung `fprime`, `r_sekante` mit `newton` ohne Ableitung (Sekantenverfahren). Löse ausserdem das System x² + y² = 4, y = x mit `fsolve` ab (1, 1) → `sol`.", "template": "import numpy as np\nfrom scipy.optimize import brentq, newton, fsolve\n\nf = lambda x: np.cos(x) - x\ndf = lambda x: -np.sin(x) - 1\n# TODO\nr_brent = r_newton = r_sekante = None\nsol = None\nprint(r_brent, r_newton, r_sekante, sol)\n", "solution": "", "tests": [{"name": "brentq", "code": "assert r_brent is not None and abs(r_brent - 0.7390851332151607) < 1e-10, f'r_brent = {r_brent}'"}, {"name": "newton mit fprime", "code": "assert r_newton is not None and abs(r_newton - 0.7390851332151607) < 1e-12 and 'fprime' in _SRC, 'newton mit fprime=df verwenden'"}, {"name": "Sekante", "code": "assert r_sekante is not None and abs(r_sekante - 0.7390851332151607) < 1e-10 and _SRC.count('newton(') >= 2, 'newton zweimal aufrufen (einmal ohne fprime)'"}, {"name": "fsolve", "code": "assert sol is not None and np.allclose(sol, [np.sqrt(2), np.sqrt(2)]), f'sol = {sol}'"}], "hints": ["`brentq(f, 0, 1)`, `newton(f, 0.5, fprime=df)`, `newton(f, 0.5)`.", "Für fsolve: `F = lambda v: [v[0]**2 + v[1]**2 - 4, v[1] - v[0]]`."], "ref": "Skript Kap. 6, scipy.optimize", "boss": false, "kind": "code"}, {"id": "sc-c6", "title": "curve_fit: Zerfall messen", "text": "Messdaten y ≈ A·e^(−λt) mit Rauschen. Bestimme A und λ mit `scipy.optimize.curve_fit` (Startwert p0 = [1, 1]) → `A_fit`, `lam_fit`. Mache dasselbe mit `least_squares` über die Residuen r(p) = model(t, p) − y → `p_ls`.", "template": "import numpy as np\nfrom scipy.optimize import curve_fit, least_squares\n\nrng = np.random.default_rng(7)\nt = np.linspace(0, 4, 40)\ny = 3.0*np.exp(-1.3*t) + 0.02*rng.normal(size=t.size)\nmodel = lambda t, A, lam: A*np.exp(-lam*t)\n# TODO\nA_fit = lam_fit = None\np_ls = None\nprint(A_fit, lam_fit, p_ls)\n", "solution": "", "tests": [{"name": "A ≈ 3", "code": "assert A_fit is not None and abs(A_fit - 3) < 0.05, f'A_fit = {A_fit}'"}, {"name": "λ ≈ 1.3", "code": "assert lam_fit is not None and abs(lam_fit - 1.3) < 0.05, f'lam_fit = {lam_fit}'"}, {"name": "least_squares gleich", "code": "assert p_ls is not None and np.allclose(p_ls, [A_fit, lam_fit], rtol=1e-4), f'p_ls = {p_ls}'"}], "hints": ["`popt, pcov = curve_fit(model, t, y, p0=[1., 1.])`, dann `A_fit, lam_fit = popt`.", "`least_squares(lambda p: model(t, *p) - y, [1., 1.]).x`."], "ref": "Skript 8.2, scipy.optimize", "boss": false, "kind": "code"}, {"id": "sc-boss", "title": "Boss: Quantil-Golem", "text": "Finde x > 0 mit Φ(x) = ∫₀ˣ φ(t) dt = 0.45, wobei φ(t) = e^(−t²/2)/√(2π) (also das 95%-Quantil der Normalverteilung).\n`x_brent`: brentq auf F(x) = quad(φ, 0, x)[0] − 0.45 in [0, 5].\n`x_newton`: newton auf demselben F mit der Ableitung F'(x) = φ(x) ab x₀ = 1.\n`x_gauss`: wie x_brent, aber das Integral mit eigener Gauss-Quadratur (roots_legendre, n = 20) statt quad.", "template": "import numpy as np\nfrom scipy import integrate\nfrom scipy.optimize import brentq, newton\nfrom scipy.special import roots_legendre\n\nphi = lambda t: np.exp(-t**2/2) / np.sqrt(2*np.pi)\n# TODO\nx_brent = x_newton = x_gauss = None\nprint(x_brent, x_newton, x_gauss)\n", "solution": "", "tests": [{"name": "x_brent", "code": "assert x_brent is not None and abs(x_brent - 1.6448536269514722) < 1e-9, f'x_brent = {x_brent}'"}, {"name": "x_newton", "code": "assert x_newton is not None and abs(x_newton - 1.6448536269514722) < 1e-9, f'x_newton = {x_newton}'"}, {"name": "Newton mit Ableitung", "code": "assert 'fprime' in _SRC, 'newton mit fprime = phi aufrufen (Hauptsatz: F\\'(x) = φ(x))'"}, {"name": "x_gauss", "code": "assert x_gauss is not None and abs(x_gauss - 1.6448536269514722) < 1e-9, f'x_gauss = {x_gauss}'"}, {"name": "eigene Gauss-Quadratur", "code": "assert 'roots_legendre(' in _SRC.split('phi =')[1], 'roots_legendre für x_gauss verwenden'"}], "hints": ["`F = lambda x: integrate.quad(phi, 0, x)[0] - 0.45` – dann `brentq(F, 0, 5)`.", "Hauptsatz der Analysis: F'(x) = φ(x). Also `newton(F, 1.0, fprime=phi)`.", "Gauss auf [0, x]: `x/2 * np.sum(wg * phi(x/2 + x/2*xg))`."], "ref": "quad + brentq + newton + roots_legendre", "boss": true, "kind": "boss"}], "group": "tools"}, {"id": "sy", "title": "Zufall, SymPy & Zeit", "chap": "Werkzeug · default_rng, sympy, timeit", "blurb": "Monte-Carlo mit default_rng, symbolisch ableiten mit SymPy, Laufzeiten messen.", "rooms": [{"id": "sy1", "title": "default_rng & Monte-Carlo", "cards": [{"title": "Zufallszahlen mit default_rng", "text": "`rng = np.random.default_rng(42)` erzeugt einen Generator; mit derselben Zahl (seed) kommen dieselben Zahlen – reproduzierbar.\n`rng.random(n)` gleichverteilt in [0, 1), `rng.uniform(a, b, n)`, `rng.normal(mu, sigma, n)`,\n`rng.integers(low, high, n)` – **high ist nicht dabei**, `rng.choice(liste, n)`, `rng.permutation(x)`. Form statt n: `rng.random((m, n))`.\nDas alte `np.random.seed` / `np.random.rand` ist Legacy (globaler Zustand).", "code": null}, {"title": "Monte-Carlo-Integration", "text": "∫ₐᵇ f ≈ (b − a)·mean(f(Xᵢ)) mit Xᵢ gleichverteilt auf [a, b].\nFehler ≈ (b − a)·std(f(X))/√N, also **O(N^(−1/2))** – unabhängig von der Dimension! Für 10× genauer braucht man 100× mehr Punkte.", "code": "rng = np.random.default_rng(0)\nX = rng.uniform(a, b, N)\nfx = f(X)\nI = (b - a) * fx.mean()\nerr = (b - a) * fx.std(ddof=1) / np.sqrt(N)"}], "qs": [{"t": "mc", "q": "Kann `rng.integers(1, 6, size=1000)` die Zahl 6 liefern?", "code": null, "opts": ["Ja", "Nein – die obere Grenze ist exklusiv; für einen Würfel rng.integers(1, 7)", "Nur mit Glück", "Nur bei seed 6"], "a": 1, "ex": "Wie bei range: das Ende ist nicht dabei.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "a = np.random.default_rng(5).random(3)\nb = np.random.default_rng(5).random(3)\nprint(np.array_equal(a, b))", "opts": ["True", "False"], "a": 0, "ex": "Gleicher seed → gleiche Zufallszahlen. Darum sind seeds für Tests und Abgaben praktisch.", "hint": null}, {"t": "mc", "q": "Wie fällt der Monte-Carlo-Fehler mit der Anzahl N der Punkte?", "code": null, "opts": ["O(1/N)", "O(1/√N)", "O(1/N²)", "exponentiell"], "a": 1, "ex": "Für eine Stelle mehr Genauigkeit braucht man 100× mehr Punkte.", "hint": null}, {"t": "typ", "q": "Tippe die Ausgabe.", "code": "rng = np.random.default_rng(1)\nprint(rng.random((4, 3)).shape)", "acc": ["(4, 3)"], "ex": "Statt einer Zahl kann man eine Form (Tupel) übergeben.", "hint": null}, {"t": "mc", "q": "Warum ist Monte-Carlo für hochdimensionale Integrale interessant?", "code": null, "opts": ["weil es exakt ist", "weil die Konvergenzrate O(N^(−1/2)) nicht von der Dimension abhängt", "weil es schneller als Gauss ist", "weil es keine Funktion braucht"], "a": 1, "ex": "Tensor-Gitter brauchen nᵈ Punkte – für d = 10 unmöglich.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "x = np.random.default_rng(0).uniform(2, 5, 10**6)\nprint(round(x.mean(), 1))", "opts": ["3.5", "2.5", "5.0", "0.5"], "a": 0, "ex": "Der Mittelwert einer Gleichverteilung auf [2, 5] ist 3.5 – bei einer Million Punkten sehr genau.", "hint": null}, {"t": "fill", "q": "Ergänze die Monte-Carlo-Schätzung von ∫₀¹ x² dx.", "code": "I = (b - a) * np.mean(f(____))", "acc": ["X"], "check": "assert abs(I - 1/3) < 0.01", "ex": "Die Funktion wird an den Zufallspunkten ausgewertet.", "hint": null, "pre": "rng = np.random.default_rng(3)\na, b = 0., 1.\nf = lambda x: x**2\nX = rng.uniform(a, b, 10**5)"}, {"t": "mc", "q": "Warum `default_rng` statt `np.random.seed` + `np.random.rand`?", "code": null, "opts": ["kein Unterschied", "eigenes Generator-Objekt ohne globalen Zustand, besserer Algorithmus (PCG64)", "es ist schneller zu tippen", "rand gibt es nicht"], "a": 1, "ex": "So beeinflussen sich verschiedene Teile eines Programms nicht gegenseitig.", "hint": null}], "kind": "quiz"}, {"id": "sy-c1", "title": "Monte-Carlo-π", "text": "Schreibe `mc_pi(N, rng)`: ziehe N Punkte gleichverteilt im Quadrat [0, 1]² mit dem Generator `rng` und schätze π = 4 · (Anteil der Punkte mit x² + y² ≤ 1). Benutze `np.random.default_rng`.", "template": "import numpy as np\n\ndef mc_pi(N, rng):\n    # TODO\n    pass\n\nrng = np.random.default_rng(42)\nfor N in [10**2, 10**4, 10**6]:\n    print(N, mc_pi(N, rng))\n", "solution": "", "tests": [{"name": "genau für N = 10⁶", "code": "p = mc_pi(10**6, np.random.default_rng(1)); assert p is not None and abs(p - np.pi) < 0.01, f'mc_pi = {p}'"}, {"name": "reproduzierbar", "code": "assert mc_pi(1000, np.random.default_rng(3)) == mc_pi(1000, np.random.default_rng(3)), 'gleicher seed muss gleiches Ergebnis geben – benutze rng'"}, {"name": "verwendet rng", "code": "assert mc_pi(1000, np.random.default_rng(3)) != mc_pi(1000, np.random.default_rng(4)), 'verschiedene seeds sollten verschiedene Ergebnisse geben'"}, {"name": "ohne Schleife", "code": "body = _SRC.split('def mc_pi')[1].split('rng = np.random')[0]; assert 'for ' not in body, 'vektorisiert, ohne for'"}], "hints": ["`P = rng.random((N, 2))` gibt N Punkte.", "`4 * np.mean(np.sum(P**2, axis=1) <= 1)` – der Mittelwert von True/False ist der Anteil."], "ref": "Skript 5.8", "boss": false, "kind": "code"}, {"id": "sy2", "title": "SymPy", "cards": [{"title": "Symbolisch rechnen", "text": "`import sympy as sp`, dann `x = sp.symbols('x')` (oder `x, y = sp.symbols('x y')`).\nFunktionen aus **sp** nehmen: `sp.sin`, `sp.exp`, `sp.sqrt` – `np.sin(x)` geht mit einem Symbol nicht!\n`sp.diff(f, x)`, `sp.diff(f, x, 2)` – Ableitungen. `sp.integrate(f, (x, 0, 1))` – bestimmtes Integral.\n`f.subs(x, 2)`, `.evalf()`, `sp.Rational(1, 3)`, `sp.simplify(f)`, `sp.series(f, x, 0, 4)`.", "code": null}, {"title": "lambdify: von SymPy zu NumPy", "text": "Symbolische Ausdrücke sind langsam. `g = sp.lambdify(x, f, 'numpy')` macht daraus eine schnelle NumPy-Funktion, die auch Arrays nimmt.\nTypisch: Ableitung symbolisch bestimmen, dann für Newton, Fehleranalyse oder Plots lambdifizieren.\nFür Systeme: `J = sp.Matrix([f1, f2]).jacobian([x, y])`.", "code": "import sympy as sp\nx = sp.symbols('x')\nf = sp.exp(x) * sp.sin(x)\ndf = sp.diff(f, x)\ndf_num = sp.lambdify(x, df, 'numpy')\ndf_num(np.linspace(0, 1, 5))"}], "qs": [{"t": "out", "q": "Was gibt dieser Code aus?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.diff(x**3, x))", "opts": ["3*x**2", "x**2", "3x^2", "x**4/4"], "a": 0, "ex": "Ableitung von x³. SymPy schreibt Potenzen wie Python mit **.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.diff(sp.sin(x**2), x))", "opts": ["2*x*cos(x**2)", "cos(x**2)", "2*x*sin(x**2)", "cos(2*x)"], "a": 0, "ex": "Kettenregel: cos(x²)·2x.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "import sympy as sp\nx = sp.symbols('x')\nf = sp.lambdify(x, x**2 + 1)\nprint(f(np.array([0., 1., 2.])))", "opts": ["[1. 2. 5.]", "x**2 + 1", "[0. 1. 4.]", "Error"], "a": 0, "ex": "lambdify macht aus dem Ausdruck eine Funktion, die mit NumPy-Arrays rechnet.", "hint": null}, {"t": "mc", "q": "Warum `sp.sin(x)` und nicht `np.sin(x)`, wenn x ein SymPy-Symbol ist?", "code": null, "opts": ["egal", "np.sin kann nur mit Zahlen rechnen – mit einem Symbol gibt es einen TypeError", "np.sin ist ungenauer", "sp.sin ist schneller"], "a": 1, "ex": "Erst nach lambdify rechnet man mit NumPy.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.integrate(x**2, (x, 0, 3)))", "opts": ["9", "9.0", "x**3/3", "27"], "a": 0, "ex": "Exakt als ganze Zahl, nicht als float.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "import sympy as sp\nprint(sp.Rational(1, 3) + sp.Rational(1, 6))", "opts": ["1/2", "0.5", "0.5000000000000001", "2/6"], "a": 0, "ex": "Brüche bleiben exakt. Ideal, um z.B. Quadraturgewichte exakt zu berechnen.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint((x**2).subs(x, 3))", "opts": ["9", "x**2", "3**2", "6"], "a": 0, "ex": "subs setzt einen Wert ein.", "hint": null}, {"t": "typ", "q": "Tippe die Ausgabe.", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.diff(x**4, x, 2))", "acc": ["12*x**2"], "ex": "Zweite Ableitung von x⁴: 4·3·x².", "hint": null}, {"t": "mc", "q": "Wozu dient `sp.lambdify`?", "code": null, "opts": ["zum Ableiten", "wandelt einen symbolischen Ausdruck in eine schnelle (NumPy-)Funktion um", "für Lambda-Kalkül", "zum Vereinfachen"], "a": 1, "ex": "Symbolisch auswerten ist für viele Punkte viel zu langsam.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "import sympy as sp\nx, y = sp.symbols('x y')\nprint(sp.Matrix([x*y, x + y]).jacobian([x, y]))", "opts": ["Matrix([[y, x], [1, 1]])", "Matrix([[x, y], [1, 1]])", "[[y, x], [1, 1]]", "Matrix([[y, 1], [x, 1]])"], "a": 0, "ex": "Zeile i enthält die partiellen Ableitungen von fᵢ nach x und y. Perfekt für das Newton-Verfahren in mehreren Dimensionen.", "hint": null}, {"t": "bug", "q": "Der Code soll f(x) = eˣ·x symbolisch ableiten, bricht aber ab. Welche Zeile?", "lines": ["import sympy as sp", "x = sp.symbols('x')", "f = np.exp(x) * x", "df = sp.diff(f, x)", "g = sp.lambdify(x, df)"], "bug": 2, "fix": "f = sp.exp(x) * x", "check": "assert abs(g(0.0) - 1.0) < 1e-12", "ex": "np.exp kann nicht mit einem Symbol rechnen. Für symbolische Ausdrücke `sp.exp` verwenden.", "hint": null, "pre": null}], "kind": "quiz"}, {"id": "sy-c2", "title": "Monte-Carlo mit Fehlerbalken", "text": "Schreibe `mc_integral(f, a, b, N, rng)`, die `(I, err)` zurückgibt: I = (b − a)·mean(f(X)) und die Fehlerschätzung err = (b − a)·std(f(X), ddof=1)/√N, mit X ~ gleichverteilt auf [a, b].", "template": "import numpy as np\n\ndef mc_integral(f, a, b, N, rng):\n    # TODO\n    pass\n\nrng = np.random.default_rng(0)\nI, err = mc_integral(lambda x: x**2, 0, 1, 10**5, rng)\nprint(I, '+-', err, ' exakt:', 1/3)\n", "solution": "", "tests": [{"name": "x² auf [0, 1]", "code": "I, e = mc_integral(lambda x: x**2, 0, 1, 10**5, np.random.default_rng(2)); assert abs(I - 1/3) < 4*e, f'I = {I}, err = {e}'"}, {"name": "Fehlerschätzung", "code": "I, e = mc_integral(lambda x: x**2, 0, 1, 10**5, np.random.default_rng(2)); assert 0.0008 < e < 0.0011, f'err = {e}, erwartet ≈ 0.00094'"}, {"name": "Intervall [2, 5]", "code": "I, e = mc_integral(lambda x: np.ones_like(x), 2, 5, 1000, np.random.default_rng(2)); assert np.isclose(I, 3) and e < 1e-12, f'I = {I}, err = {e}'"}, {"name": "Fehler ~ 1/√N", "code": "e1 = mc_integral(np.sin, 0, 3, 10**3, np.random.default_rng(5))[1]; e2 = mc_integral(np.sin, 0, 3, 10**5, np.random.default_rng(5))[1]; assert 7 < e1/e2 < 13, f'Verhältnis {e1/e2:.1f}, erwartet 10'"}], "hints": ["`X = rng.uniform(a, b, N)`, `fx = f(X)`.", "`err = (b - a) * fx.std(ddof=1) / np.sqrt(N)`."], "ref": "Skript 5.8", "boss": false, "kind": "code"}, {"id": "sy3", "title": "time & timeit", "cards": [{"title": "Zeit messen", "text": "`time.perf_counter()` – genaue Wanduhr (für kurze Messungen). `time.process_time()` – CPU-Zeit des Prozesses (so im Skript, Code 1.3.12).\nImmer **mehrmals messen und das Minimum nehmen**: andere Prozesse stören, das Minimum ist die beste Schätzung.\n`timeit.timeit(stmt, number=100)` gibt die **Gesamtzeit** für 100 Ausführungen; `timeit.repeat(stmt, repeat=5, number=100)` eine Liste solcher Zeiten.\nIn IPython gibt es `%timeit` – das ist kein normales Python und geht in Skripten (CodeExpert) nicht.", "code": "import time, timeit\nt0 = time.perf_counter(); f(); dt = time.perf_counter() - t0\nt = min(timeit.repeat(lambda: f(), repeat=5, number=10)) / 10   # Sekunden pro Aufruf"}], "qs": [{"t": "mc", "q": "Warum nimmt man das Minimum mehrerer Messungen?", "code": null, "opts": ["weil es schöner aussieht", "andere Prozesse verlangsamen einzelne Läufe – das Minimum ist der ungestörteste Wert", "weil der Mittelwert falsch ist", "Konvention"], "a": 1, "ex": "So steht es auch im Skript (Bemerkung 1.3.11).", "hint": null}, {"t": "mc", "q": "Was gibt `timeit.timeit(stmt, number=1000)` zurück?", "code": null, "opts": ["die Zeit pro Ausführung", "die Gesamtzeit für alle 1000 Ausführungen in Sekunden", "eine Liste", "Millisekunden"], "a": 1, "ex": "Für die Zeit pro Aufruf durch number teilen.", "hint": null}, {"t": "mc", "q": "Unterschied zwischen `time.process_time()` und `time.perf_counter()`?", "code": null, "opts": ["keiner", "process_time misst die CPU-Zeit des Prozesses, perf_counter die vergangene Wanduhr-Zeit", "perf_counter ist ungenauer", "process_time zählt Prozesse"], "a": 1, "ex": "Schläft ein Programm (time.sleep), steigt perf_counter, process_time nicht.", "hint": null}, {"t": "fill", "q": "Ergänze: Zeit pro Aufruf, wenn jede Messung 10 Aufrufe macht.", "code": "t = min(timeit.repeat(lambda: A @ A, repeat=5, number=____)) / 10", "acc": ["10"], "check": "assert t > 0", "ex": "number gibt an, wie oft pro Messung ausgeführt wird.", "hint": null, "pre": "import timeit\nA = np.ones((50, 50))"}, {"t": "mc", "q": "Du verdoppelst n und die gemessene Zeit steigt um den Faktor 8. Welche , "ref": "Skript Code 5.4.14", "boss": false, "kind": "code"}, {"id": "sy-c5", "title": "timeit: Schleife gegen NumPy", "text": "Miss mit `timeit.repeat` (repeat = 3, number = 3) die Zeit **pro Aufruf** von `summe_schleife(x)` und von `np.sum(x**2)` für x mit 200 000 Einträgen. Nimm jeweils das Minimum. Speichere `t_loop`, `t_np` und `speedup = t_loop / t_np`.", "template": "import numpy as np\nimport timeit\n\ndef summe_schleife(x):\n    s = 0.\n    for v in x:\n        s += v*v\n    return s\n\nx = np.random.default_rng(0).random(200000)\n# TODO\nt_loop = t_np = speedup = None\nprint(t_loop, t_np, speedup)\n", "solution": "", "tests": [{"name": "Zeiten gemessen", "code": "assert t_loop is not None and t_np is not None and t_loop > 0 and t_np > 0, 'Zeiten fehlen'"}, {"name": "NumPy deutlich schneller", "code": "assert speedup > 5, f'speedup = {speedup:.1f}'"}, {"name": "timeit.repeat benutzt", "code": "assert 'timeit.repeat' in _SRC and 'min(' in _SRC, 'timeit.repeat und min verwenden'"}, {"name": "pro Aufruf", "code": "assert t_loop < 1.0, f't_loop = {t_loop} – durch number teilen?'"}], "hints": ["`timeit.repeat(lambda: summe_schleife(x), repeat=3, number=3)` gibt eine Liste mit 3 Gesamtzeiten.", "`min(...)/3` ist die Zeit pro Aufruf."], "ref": "Skript 1.3.11–1.3.13", "boss": false, "kind": "code"}, {"id": "sy-boss", "title": "Boss: Newton-Drache in 2D", "text": "Löse F(x, y) = (x² + y² − 4, eˣ + y − 1) = 0 mit dem Newton-Verfahren in 2D:\nBaue F und die Jacobi-Matrix **symbolisch** (`sp.Matrix(...).jacobian`), lambdifiziere beide, und iteriere xₖ₊₁ = xₖ − J(xₖ)⁻¹F(xₖ) mit `np.linalg.solve` ab (1, −1.7). Schreibe `newton2d(v0, tol=1e-13)` → `(v, schritte)`. Vergleiche mit `scipy.optimize.fsolve` → `v_fsolve`.", "template": "import numpy as np\nimport sympy as sp\nfrom scipy.optimize import fsolve\n\nx, y = sp.symbols('x y')\nF_sym = sp.Matrix([x**2 + y**2 - 4, sp.exp(x) + y - 1])\n# TODO: J_sym, F_num, J_num\n\ndef newton2d(v0, tol=1e-13):\n    # TODO\n    pass\n\nv, k = newton2d(np.array([1., -1.7]))\nv_fsolve = None   # TODO\nprint(v, k, v_fsolve)\n", "solution": "", "tests": [{"name": "F(v) = 0", "code": "v, k = newton2d(np.array([1., -1.7])); r = [v[0]**2 + v[1]**2 - 4, np.exp(v[0]) + v[1] - 1]; assert np.allclose(r, 0, atol=1e-12), f'F(v) = {r}'"}, {"name": "schnell (quadratisch)", "code": "v, k = newton2d(np.array([1., -1.7])); assert k <= 8, f'{k} Schritte'"}, {"name": "andere Lösung", "code": "v, k = newton2d(np.array([-1.8, 0.8])); assert np.allclose([v[0]**2 + v[1]**2 - 4, np.exp(v[0]) + v[1] - 1], 0, atol=1e-12) and v[0] < 0, f'v = {v}'"}, {"name": "wie fsolve", "code": "assert v_fsolve is not None and np.allclose(v_fsolve, newton2d(np.array([1., -1.7]))[0], atol=1e-8), f'v_fsolve = {v_fsolve}'"}, {"name": "symbolische Jacobi-Matrix", "code": "assert 'jacobian' in _SRC and 'lambdify' in _SRC and 'linalg.solve' in _SRC, 'jacobian, lambdify und np.linalg.solve verwenden'"}], "hints": ["`J_sym = F_sym.jacobian([x, y])`, `F_num = sp.lambdify((x, y), F_sym)`, `J_num = sp.lambdify((x, y), J_sym)`.", "lambdify gibt verschachtelte Listen zurück: `np.array(F_num(*v), dtype=float).ravel()`.", "Newton-Schritt: `dv = np.linalg.solve(Jv, Fv)`, `v = v - dv` – nie die Inverse bilden!"], "ref": "Skript 6.7, sympy + linalg + optimize", "boss": true, "kind": "boss"}], "group": "tools"}], "examExtra": {"id": "plboss", "title": "Final Boss: Prüfungsmodus", "boss": true, "cards": [{"title": "Final Boss", "text": "Die Prüfung folgt fast genau den Übungen – CodeExpert + Moodle-Quiz. Hier eine Mischung aus allen Welten.\nZiel: ohne Hinweise durch. Viel Erfolg!", "code": null}], "qs": [{"t": "out", "q": "Was gibt dieser Code aus?", "code": "x = np.linspace(0, 1, 3)\nf = lambda t: np.where(t < 0.5, 0., 1.)\nprint(f(x).sum())", "opts": ["1.0", "2.0", "3.0", "0.0"], "a": 1, "ex": "x = [0, 0.5, 1] → [0, 1, 1] (0.5 < 0.5 ist falsch!), Summe 2.", "hint": null}, {"t": "out", "q": "Was gibt dieser Code aus?", "code": "def trapez(f, a, b, N):\n const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function md(s) {
  return esc(s).split('\n').map(l => l.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')).join('<br>');
}
const mdPara = s => s.split(/\n(?=\S)/).map(p => '<p>' + md(p) + '</p>').join('');
const KW = new Set(['def','return','for','in','if','elif','else','while','import','from','as','lambda','and','or','not','None','True','False','continue','break','pass','with','is','try','except']);
const BI = new Set(['print','len','range','list','enumerate','abs','round','sum','min','max','str','int','float','type','zip','sorted']);
function hl(code) {
  const re = /(#[^\n]*)|([rfbRFB]?"(?:[^"\\\n]|\\.)*"|[rfbRFB]?'(?:[^'\\\n]|\\.)*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?j?\b|\.\d+(?:[eE][-+]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); const t = m[0];
    if (m[1]) out += '<span class="com">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="str">' + esc(t) + '</span>';
    else if (m[3]) out += '<span class="num">' + esc(t) + '</span>';
    else if (KW.has(t)) out += '<span class="kw">' + t + '</span>';
    else if (BI.has(t) || code[re.lastIndex] === '(') out += '<span class="fn">' + t + '</span>';
    else out += esc(t);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function codeBlock(code, tag) {
  const t = tag !== undefined ? tag : (/\bnp\./.test(code) && !/import numpy/.test(code) ? 'np = numpy ✓' : '');
  return '<div class="code">' + (t ? '<span class="tag">' + esc(t) + '</span>' : '') + '<pre>' + hl(code) + '</pre></div>';
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const starsHtml = n => { let s = ''; for (let i = 0; i < 3; i++) s += i < n ? '<i>★</i>' : '★'; return s; };

function level() { let l = 1, need = 100, x = S.xp; while (x >= need) { x -= need; l++; need = Math.round(need * 1.25); } return { l, x, need }; }

const STARS = {
  cv: null, g: null, list: [], t: 0, timer: null,
  init() {
    if (RM || this.cv) return;
    const cv = document.createElement('canvas'); cv.id = 'stars'; cv.setAttribute('aria-hidden', 'true');
    document.body.prepend(cv); this.cv = cv; this.g = cv.getContext('2d');
    const cols = ['#C2C3C7', '#29ADFF', '#83769C', '#FFF1E8', '#FFCCAA', '#FFEC27'];
    for (let i = 0; i < 90; i++) this.list.push({ x: Math.random(), y: Math.random(), z: 1 + (i % 3), c: cols[i % cols.length], p: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.4 });
    const size = () => { const d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.floor(innerWidth * d); cv.height = Math.floor(innerHeight * d); this.d = d; };
    size(); addEventListener('resize', size);
    const loop = () => { if (!document.hidden) this.draw(); };
    this.timer = setInterval(loop, 1000 / 15);
  },
  draw() {
    const g = this.g, W = this.cv.width, H = this.cv.height, d = this.d;
    this.t += 1 / 15; g.clearRect(0, 0, W, H);
    for (const s of this.list) {
      s.y += 0.00018 * s.z; s.x -= 0.00006 * s.z; if (s.y > 1) s.y -= 1; if (s.x < 0) s.x += 1;
      const tw = 0.5 + 0.5 * Math.sin(this.t * s.sp + s.p);
      if (tw < 0.15) continue;
      g.globalAlpha = 0.25 + 0.55 * tw * (s.z / 3);
      g.fillStyle = s.c;
      const px = Math.round(s.z === 3 && tw > 0.85 ? 3 : 2) * d;
      g.fillRect(Math.round(s.x * W), Math.round(s.y * H), px, px);
    }
    g.globalAlpha = 1;
  },
};

/* ---------------- Python engine (Pyodide in a worker) ---------------- */
const PY = {
  w: null, state: 'off', msg: 'Python aus', pending: null, onStatus: [], startT: 0,
  setState(st, msg) { this.state = st; this.msg = msg; renderPyChip(); this.onStatus.forEach(f => f()); },
  start() {
    if (this.w) return;
    this.setState('load', 'Python lädt …');
    try { this.w = new Worker('py-worker.js'); }
    catch (e) { this.setState('err', 'Python nicht verfügbar'); return; }
    this.w.onerror = e => { this.setState('err', 'Python-Fehler: ' + (e.message || 'Worker')); };
    this.w.onmessage = ev => {
      const m = ev.data;
      if (m.type === 'status') { if (this.pending) clearTimeout(this.pending.timer); this.setState('load', m.text); }
      else if (m.type === 'ready') { this.setState('ok', 'Python bereit'); if (this.pending && this.pending.arm) { clearTimeout(this.pending.timer); this.pending.arm(); } }
      else if (m.type === 'fatal') this.setState('err', 'Python konnte nicht laden');
      else if ((m.type === 'stdout' || m.type === 'stderr') && this.pending) this.pending.onOut(m.type, m.text);
      else if (m.type === 'result' && this.pending && m.id === this.pending.id) {
        clearTimeout(this.pending.timer); const p = this.pending; this.pending = null; p.resolve(m.res);
      }
    };
  },
  run(code, tests, onOut, pre) {
    this.start();
    if (this.pending) return Promise.resolve({ ok: false, error: 'Es läuft schon ein Programm.', tests: [], images: [] });
    return new Promise(resolve => {
      const id = Math.random().toString(36).slice(2);
      const p = { id, resolve, onOut: onOut || (() => {}) };
      p.timer = null;
      const arm = p.arm = () => {
        p.timer = setTimeout(() => {
          if (this.pending !== p) return;
          this.pending = null; this.w.terminate(); this.w = null;
          resolve({ ok: false, timeout: true, error: 'Zeitlimit überschritten (20 s) – vermutlich eine Endlosschleife.', tests: [], images: [] });
          this.start();
        }, 20000);
      };
      this.pending = p;
      const go = () => { arm(); this.w.postMessage({ type: 'run', id, code, tests: tests || [], pre: pre || '' }); };
      if (this.state === 'ok') go();
      else { const f = () => { if (this.state === 'ok') { this.onStatus = this.onStatus.filter(x => x !== f); go(); } else if (this.state === 'err') { this.onStatus = this.onStatus.filter(x => x !== f); this.pending = null; resolve({ ok: false, error: 'Python konnte nicht geladen werden. Lade die Seite neu oder versuche es später.', tests: [], images: [] }); } }; this.onStatus.push(f); }
    });
  }
};
function renderPyChip() {
  const el = $('#pychip'); if (!el) return;
  el.className = 'pychip ' + (PY.state === 'ok' ? 'ok' : PY.state === 'load' ? 'load' : PY.state === 'err' ? 'err' : '');
  el.innerHTML = '<i></i>' + esc(PY.state === 'off' ? 'Python: startet bei Bedarf' : PY.msg);
}

/* error tutor */
function tutor(err) {
  if (!err) return '';
  const rules = [
    [/NameError: name '(\w+)' is not defined/, m => m[1] === 'np' ? 'Am Anfang fehlt <code>import numpy as np</code>.' : `Der Name <code>${esc(m[1])}</code> existiert (noch) nicht. Tippfehler? Oder wird er erst weiter unten definiert?`],
    [/IndentationError|TabError|unindent/, () => 'Die Einrückung passt nicht. In Python gehört alles mit 4 Leerzeichen Einzug zum Block darüber (nach <code>def</code>, <code>for</code>, <code>if</code> …).'],
    [/SyntaxError.*(expected ':'|invalid syntax)/, () => 'Syntaxfehler: Oft fehlt ein <code>:</code> nach <code>def</code>/<code>for</code>/<code>if</code>, eine Klammer ist nicht geschlossen, oder <code>=</code> statt <code>==</code>.'],
    [/SyntaxError.*never closed/, () => 'Eine Klammer wurde geöffnet, aber nie geschlossen.'],
    [/'NoneType'/, () => 'Etwas ist <code>None</code>. Meistens fehlt in einer Funktion das <code>return</code> (oder sie hat nur <code>pass</code>).'],
    [/could not be broadcast|shapes .* not aligned|matmul: Input operand/, () => 'Die Formen (shapes) der Arrays passen nicht zusammen. Gib dir mit <code>print(x.shape)</code> die Formen aus.'],
    [/IndexError/, () => 'Ein Index ist ausserhalb des Arrays. Python zählt ab 0; der letzte Index ist <code>len(x) - 1</code>.'],
    [/ZeroDivisionError/, () => 'Division durch 0. Mit NumPy-Arrays gäbe es stattdessen <code>inf</code>/<code>nan</code> und eine Warnung.'],
    [/TypeError: unsupported operand type.*'list'/, () => 'Mit Listen kann man nicht elementweise rechnen. Mach daraus ein Array: <code>np.array(liste)</code>.'],
    [/TypeError: .*takes (\d+) positional argument/, () => 'Die Funktion wird mit der falschen Anzahl Argumente aufgerufen.'],
    [/ModuleNotFoundError/, () => 'Dieses Modul gibt es hier nicht. Verfügbar sind numpy, scipy, sympy und matplotlib.'],
    [/ufunc .* Symbol|of type Symbol|of type Mul|of type Add|of type Pow/, () => 'NumPy-Funktionen (np.exp, np.sin …) können nicht mit SymPy-Symbolen rechnen. Nimm <code>sp.exp</code>, <code>sp.sin</code> – und erst nach <code>sp.lambdify</code> NumPy.'],
    [/must have different signs/, () => 'brentq braucht einen Vorzeichenwechsel: f(a) und f(b) müssen verschiedene Vorzeichen haben.'],
    [/'tuple' object|unsupported operand type.*'tuple'/, () => 'Hier ist ein Tupel im Spiel. <code>integrate.quad</code> gibt z.B. (Wert, Fehler) zurück – nimm <code>[0]</code>.'],
    [/Zeitlimit/, () => 'Prüfe deine while-Schleifen: Ändert sich die Bedingung wirklich in jedem Durchgang?'],
  ];
  for (const [re, f] of rules) { const m = err.match(re); if (m) return '<div class="tutor">' + f(m) + '</div>'; }
  return '';
}

/* console */
function makeConsole(el) {
  const c = { el, buf: '' };
  c.clear = msg => { el.innerHTML = '<div class="sys">' + esc(msg || 'Ausgabe') + '</div><pre id="cout"></pre>'; c.buf = ''; };
  c.out = (type, text) => { c.buf += text + '\n'; const p = el.querySelector('#cout'); if (p) { p.insertAdjacentHTML('beforeend', type === 'stderr' ? '<span class="err">' + esc(text) + '\n</span>' : esc(text) + '\n'); } el.scrollTop = el.scrollHeight; };
  c.result = res => {
    let h = '';
    if (res.error) h += '<pre class="err">' + esc(res.error) + '</pre>' + (res.where ? '<pre class="where">' + esc(res.where) + '</pre>' : '') + tutor(res.error);
    const imgs = (res.images || []).filter(i => i[1]);
    if (imgs.length) h += '<div class="imgs">' + imgs.map(i => `<figure><img alt="${esc(i[0])}" src="data:image/png;base64,${i[1]}"><figcaption>${esc(i[0])}</figcaption></figure>`).join('') + '</div>';
    if (!res.error && !c.buf && !imgs.length) h += '<div class="sys">Programm fertig – keine Ausgabe.</div>';
    el.insertAdjacentHTML('beforeend', h);
  };
  return c;
}

/* editor */
function makeEditor(host, value, onRun, onSubmit) {
  if (window.CodeMirror) {
    const cm = CodeMirror(host, {
      value, mode: 'python', theme: 'pico', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
      matchBrackets: true, autoCloseBrackets: true, viewportMargin: Infinity, lineWrapping: false,
      extraKeys: {
        Tab: cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end'),
        'Shift-Tab': cm => cm.indentSelection('subtract'),
        'Ctrl-Enter': () => onRun(), 'Cmd-Enter': () => onRun(),
        'Shift-Ctrl-Enter': () => onSubmit && onSubmit(), 'Shift-Cmd-Enter': () => onSubmit && onSubmit(),
      },
    });
    let marked = null;
    return {
      get: () => cm.getValue(), set: v => cm.setValue(v), focus: () => cm.focus(), onChange: f => cm.on('change', f),
      markLine: n => { if (marked !== null) cm.removeLineClass(marked, 'background', 'cm-error-line'); marked = null; if (n) { marked = n - 1; cm.addLineClass(marked, 'background', 'cm-error-line'); } },
      refresh: () => cm.refresh(),
    };
  }
  host.innerHTML = '<textarea spellcheck="false" aria-label="Code-Editor" id="ta"></textarea>';
  const ta = host.querySelector('textarea'); ta.value = value;
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.shiftKey && onSubmit ? onSubmit() : onRun(); }
  });
  return { get: () => ta.value, set: v => { ta.value = v; }, focus: () => ta.focus(), onChange: f => ta.addEventListener('input', f), markLine: () => {}, refresh: () => {} };
}

function codeRoom(r) {
  setWC(r.world);
  const st = S.rooms[r.id] || {};
  const isBoss = r.kind === 'boss';
  const draft = S.drafts[r.id] || r.template;
  const R = { r, hintsShown: 0, solShown: !!st.solSeen, submits: 0, running: false, lastTests: null };
  app.innerHTML = `
    <div class="rhead">
      <button class="btn ghost" id="back">◂ ${esc(r.world.title)}</button>
      <div class="title"><small>Welt ${r.world.n} · ${isBoss ? 'Boss' : 'Code-Aufgabe'}${r.ref ? ' · ' + esc(r.ref) : ''}</small><h1>${esc(r.title)}</h1></div>
      ${roomNav(r)}
    </div>
    <div class="bench">
      <section class="frame task">
        ${isBoss ? `<div class="bossrow"><img class="spr bossspr ${st.done ? 'dead' : ''}" id="bossspr" src="${spr(st.done ? 'crown' : 'boss')}" alt=""><div class="hp"><div class="lbl"><span>${st.done ? 'BESIEGT' : 'BOSS-LEBEN'}</span><span id="hpnum">${st.done ? 0 : r.tests.length}/${r.tests.length}</span></div><div class="bar" id="hpbar">${r.tests.map(() => `<i class="${st.done ? 'gone' : ''}"></i>`).join('')}</div></div></div>` : ''}
        <div class="txt">${mdPara(r.text)}</div>
        <div><h3>Tests (${r.tests.length})</h3><div class="tests" id="tests">${r.tests.map((t, i) => `<div class="test" id="t${i}"><i></i><span>${esc(t.name)}</span></div>`).join('')}</div></div>
        <div><h3>Hilfe</h3><div class="hints" id="hints"></div>
          <div class="actions" style="margin-top:8px"><button class="btn ghost" id="hintb">Hinweis (${r.hints.length})</button>${GAME.public ? '' : '<button class="btn ghost" id="solb">Musterlösung</button>'}</div>
          <div id="sol" class="solution"></div></div>
        <p class="note">Tipp: <code>Strg/⌘ + Enter</code> führt aus, <code>Shift + Strg/⌘ + Enter</code> gibt ab. Dein Code wird automatisch gespeichert.</p>
      </section>
      <section class="ide">
        <div class="bar">
          <span class="fname">main.py</span>
          <button class="btn" id="runb">▶ Ausführen</button>
          <button class="btn go" id="subb">✓ Abgeben</button>
          <button class="btn ghost" id="resb" title="Vorlage wiederherstellen">↺</button>
        </div>
        <div class="edwrap" id="ed"></div>
        <div class="console" id="con"><div class="ph">Hier erscheinen Ausgaben, Fehler und Bilder aus <code>./cx_out/</code>.</div></div>
      </section>
    </div>`;
  $('#back').onclick = () => go('world', r.world.id);
  bindRoomNav();
  R.hits = 0;
  if (isBoss && !st.done) {
    AU.sfx('intro');
    overlay(`<img class="spr big wobble" src="${spr('boss')}" alt=""><p class="pix" style="color:var(--pink);font-size:.75rem;margin:0">BOSS-KAMPF · WELT ${r.world.n}</p><h2>${esc(r.title.replace(/^Boss:\s*/, ''))}</h2>
      <div class="hp" style="margin:12px 0"><div class="bar">${r.tests.map(() => '<i></i>').join('')}</div></div>
      <p>Dieser Boss hat <b>${r.tests.length} Leben</b>. Jeder bestandene Test ist ein Treffer. Hinweise kosten Sterne, aber keine Leben.</p>
      <button class="btn red" data-close>⚔ Kampf beginnen</button>`, { cls: 'bossintro' });
  }
  const con = makeConsole($('#con'));
  const ed = makeEditor($('#ed'), draft, () => run(false), () => run(true));
  setTimeout(() => ed.refresh(), 30); setTimeout(() => ed.refresh(), 420);
  ed.onChange(() => { S.drafts[r.id] = ed.get(); clearTimeout(R.sv); R.sv = setTimeout(save, 400); });
  PY.start();
  const btns = ['#runb', '#subb'].map(s => $(s));
  let streamed = [];
  const reprint = () => { const p = con.el.querySelector('#cout'); streamed.forEach(([t, x]) => p.insertAdjacentHTML('beforeend', t === 'stderr' ? '<span class="err">' + esc(x) + '\n</span>' : esc(x) + '\n')); con.buf = streamed.map(s => s[1]).join(''); };
  async function run(withTests) {
    if (R.running) return;
    R.running = true; btns.forEach(b => b.disabled = true); ed.markLine(null); AU.sfx('run');
    con.clear(PY.state === 'ok' ? (withTests ? 'Läuft mit Tests …' : 'Läuft …') : 'Python wird geladen (einmalig ca. 30 MB, danach sofort) …');
    streamed = [];
    const res = await PY.run(ed.get(), withTests ? r.tests : null, (t, x) => { streamed.push([t, x]); con.out(t, x); });
    R.running = false; btns.forEach(b => b.disabled = false);
    con.clear(withTests ? 'Ausgabe (mit Tests)' : 'Ausgabe'); reprint();
    con.result(res);
    const lm = (res.where || '').match(/Zeile (\d+)/) || (res.error || '').match(/Zeile (\d+)/);
    if (lm) ed.markLine(+lm[1]);
    if (res.error) { AU.sfx('error'); FX.shake($('#con')); }
    if (withTests) grade(res);
  }
  function grade(res) {
    R.submits++;
    const n = r.tests.length;
    const results = res.tests && res.tests.length ? res.tests : r.tests.map(t => ({ name: t.name, ok: false, msg: res.timeout ? 'Zeitlimit' : 'nicht gelaufen – das Programm bricht vorher mit einem Fehler ab' }));
    const passed = results.filter(t => t.ok).length;
    const step = RM ? 0 : 140;
    let okIdx = 0;
    results.forEach((t, i) => {
      setTimeout(() => {
        const el = $('#t' + i); if (!el) return;
        el.className = 'test ' + (t.ok ? 'ok' : 'no');
        el.innerHTML = `<i></i><span>${esc(r.tests[i].name)}${t.ok ? '' : '<span class="msg">' + esc(t.msg || '') + '</span>'}</span>`;
        if (t.ok) { AU.sfx(isBoss ? 'hit' : 'tick', okIdx * 2); okIdx++; FX.burstAt(el.querySelector('i'), 6, ['#00E436', '#FFEC27']); }
        if (isBoss && t.ok) {
          const segs = [...$('#hpbar').querySelectorAll('i')]; const seg = segs.find(s => !s.classList.contains('gone'));
          if (seg) { seg.classList.add('gone'); FX.burstAt(seg, 8, ['#FF004D', '#FF77A8']); }
          FX.shake($('#bossspr')); FX.flash('#FF004D');
          $('#hpnum').textContent = Math.max(0, n - okIdx) + '/' + n;
        }
      }, i * step);
    });
    if (isBoss) $('#hpbar').querySelectorAll('i').forEach(el => el.classList.remove('gone'));
    setTimeout(() => {
      if (passed === n) win();
      else { AU.sfx('fail'); con.el.insertAdjacentHTML('afterbegin', `<div class="sys" style="color:var(--orange)">${passed}/${n} Tests bestanden${isBoss ? ' – der Boss hat noch ' + (n - passed) + ' Leben' : ''}.</div>`); }
    }, n * step + 120);
  }
  function win() {
    const prev = S.rooms[r.id] || {};
    const stars = R.solShown ? 1 : R.hintsShown ? 2 : 3;
    const first = !prev.done;
    S.rooms[r.id] = { done: true, stars: Math.max(prev.stars || 0, stars), solSeen: R.solShown || prev.solSeen };
    save();
    const gain = first ? (isBoss ? 150 : stars === 1 ? 15 : 50) : 0;
    AU.sfx(isBoss ? 'boss' : 'win'); FX.confetti();
    if (isBoss) { const b = $('#bossspr'); if (b) { b.src = spr('crown'); b.classList.add('dead'); } const l = app.querySelector('.hp .lbl span'); if (l) l.textContent = 'BESIEGT'; }
    con.el.insertAdjacentHTML('afterbegin', `<div class="victory"><img class="spr vic bob" src="${spr(isBoss ? 'crown' : 'medal')}" alt=""><b>${isBoss ? 'BOSS BESIEGT!' : 'ALLE TESTS BESTANDEN'}</b><span class="stars" style="color:var(--yellow)">${starsHtml(stars)}</span> ${first ? ' · +' + gain + ' XP' : ''}<div class="actions" style="justify-content:center;margin-top:8px"><button class="btn go" id="nextr">Nächster Raum ▸</button><button class="btn ghost" id="maprb">${esc(r.world.title)}</button></div></div>`);
    const rs = r.world.rooms, nr = rs[rs.indexOf(r) + 1] || nextRoom();
    $('#nextr').onclick = () => nr ? go('room', nr.id) : go('home');
    $('#maprb').onclick = () => go('world', r.world.id);
    con.el.scrollTop = 0;
    setTimeout(() => addXP(gain, $('.victory')), 300);
    if (!gain) checkBadges();
  }
  $('#runb').onclick = () => run(false);
  $('#subb').onclick = () => run(true);
  $('#resb').onclick = () => {
    const b = $('#resb');
    if (b.dataset.armed) { ed.set(r.template); delete S.drafts[r.id]; save(); b.dataset.armed = ''; b.textContent = '↺'; toast('Vorlage wiederhergestellt'); }
    else { b.dataset.armed = '1'; b.textContent = 'Wirklich zurücksetzen?'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '↺'; }, 3000); }
  };
  $('#hintb').onclick = () => {
    if (R.hintsShown >= r.hints.length) return;
    AU.sfx('hint');
    $('#hints').insertAdjacentHTML('beforeend', `<div class="hint"><b>Hinweis ${R.hintsShown + 1}:</b> ${md(r.hints[R.hintsShown])}</div>`);
    R.hintsShown++; $('#hintb').textContent = R.hintsShown < r.hints.length ? `Noch ein Hinweis (${r.hints.length - R.hintsShown})` : 'Keine weiteren Hinweise';
    if (R.hintsShown >= r.hints.length) $('#hintb').disabled = true;
  };
  if ($('#solb')) $('#solb').onclick = () => {
    const sol = $('#sol');
    if (sol.innerHTML) { sol.innerHTML = ''; return; }
    if (!R.solShown && R.submits === 0 && !$('#solb').dataset.armed) {
      $('#solb').dataset.armed = '1'; $('#solb').textContent = 'Erst selbst versuchen? Nochmal klicken'; return;
    }
    R.solShown = true; S.rooms[r.id] = Object.assign(S.rooms[r.id] || {}, { solSeen: true }); save();
    sol.innerHTML = `<p class="note" style="margin:10px 0 0">Vergleiche mit deinem Code. Tipp: Nicht kopieren – abtippen und verstehen. (Mit Lösung gibt es nur einen Stern.)</p>${codeBlock(r.solution, 'Musterlösung')}`;
    $('#solb').textContent = 'Lösung ausblenden';
  };
  KEYH = null;
}

const normSpace = s => s.trim().replace(/\s+/g, ' ');
const normTight = s => s.replace(/\s+/g, '').replace(/"/g, "'");

}
function bindExHead() {
  $('#exquit').onclick = () => { const b = $('#exquit'); if (b.dataset.armed) { clearInterval(EX.tick); EX = null; go('home'); } else { b.dataset.armed = '1'; b.textContent = 'Wirklich abbrechen?'; } };
  examTick();
}
function examStep() {
  window.scrollTo(0, 0); KEYH = null;
  if (EX.i < EX.qs.length) {
    const q = EX.qs[EX.i]; const st = { q, sel: null };
    if (q.room) setWC(q.room.world);
    app.innerHTML = `<div class="qwrap">${exHead('Teil 1: Moodle')}<div class="frame qpanel">
      <div class="qmeta"><span class="kind">${KIND[q.t]}</span><span>${q.room ? esc(q.room.world.title) : ''}</span></div>
      <p class="qtext">${md(q.q)}</p>${questionBody(q, st)}
      <div class="actions"><button class="btn go" id="exnext" disabled>Antwort speichern ▸</button><button class="btn ghost" id="exskip">Überspringen</button></div></div></div>`;
    bindExHead();
    bindQuestion(q, st, v => { $('#exnext').disabled = !v; });
    $('#exnext').onclick = () => { EX.ans[EX.i] = { ok: isCorrect(q, st) }; EX.i++; examStep(); };
    $('#exskip').onclick = () => { EX.ans[EX.i] = { ok: false, skipped: true }; EX.i++; examStep(); };
  } else if (EX.i < EX.qs.length + EX.codes.length) {
    const r = EX.codes[EX.i - EX.qs.length]; setWC(r.world);
    app.innerHTML = `${exHead('Teil 2: CodeExpert')}<div class="bench"><section class="frame task"><h2 style="font-size:1.3rem">${esc(r.title)}</h2><div class="txt">${mdPara(r.text)}</div>
      <div><h3>Tests (${r.tests.length})</h3><div class="tests" id="tests">${r.tests.map((t, i) => `<div class="test" id="t${i}"><i></i><span>${esc(t.name)}</span></div>`).join('')}</div></div>
      <p class="note">Ausführen ist beliebig oft erlaubt. „Abgeben“ bewertet mit den Tests und geht zur nächsten Aufgabe.</p></section>
      <section class="ide"><div class="bar"><span class="fname">main.py</span><button class="btn" id="runb">▶ Ausführen</button><button class="btn go" id="subb">✓ Abgeben ▸</button></div><div class="edwrap" id="ed"></div><div class="console" id="con"><div class="ph">Ausgabe</div></div></section></div>`;
    bindExHead();
    const con = makeConsole($('#con'));
    const ed = makeEditor($('#ed'), r.template, () => run(false), () => run(true));
    setTimeout(() => ed.refresh(), 30);
    let busy = false;
    async function run(final) {
      if (busy) return; busy = true; $('#runb').disabled = $('#subb').disabled = true;
      con.clear(final ? 'Bewertung läuft …' : 'Läuft …');
      const res = await PY.run(ed.get(), final ? r.tests : null, con.out);
      busy = false; $('#runb').disabled = $('#subb').disabled = false;
      const sy = con.el.querySelector('.sys'); if (sy) sy.textContent = 'Ausgabe';
      con.result(res);
      if (final) {
        const passed = (res.tests || []).filter(t => t.ok).length;
        EX.codeRes.push({ r, passed, n: r.tests.length }); EX.i++; examStep();
      }
    }
    $('#runb').onclick = () => run(false);
    $('#subb').onclick = () => run(true);
  } else examFinish();
}
function examFinish() {
  if (!EX) return;
  clearInterval(EX.tick);
  const qOk = EX.ans.filter(a => a && a.ok).length;
  const cPts = EX.codeRes.reduce((s, c) => s + 2 * c.passed / c.n, 0);
  const maxPts = EX.qs.length + 2 * EX.codes.length;
  const pts = qOk + cPts; const pct = Math.round(100 * pts / maxPts);
  S.exams.push({ pct, date: new Date().toISOString().slice(0, 10) }); save();
  AU.sfx(pct >= 70 ? 'boss' : 'win'); if (pct >= 70) FX.confetti();
  setTimeout(() => addXP(Math.round(pct / 2), app.querySelector('.end h2')), 400);
  const E = EX; EX = null; setWC(null); window.scrollTo(0, 0);
  app.innerHTML = `<div class="qwrap"><div class="rhead"><div class="title"><small>Probeprüfung</small><h1>Auswertung</h1></div></div>
    <div class="frame end"><h2>${pct} %</h2><div class="nums"><div><b>${qOk}/${E.qs.length}</b><span>Moodle-Teil</span></div><div><b>${cPts.toFixed(1)}/${2 * E.codes.length}</b><span>CodeExpert-Teil (je 2 P.)</span></div></div>
    <p class="note">${pct >= 70 ? 'Sehr gut – so kann die Prüfung kommen.' : pct >= 50 ? 'Solide. Schau dir die falschen Fragen unten an und wiederhole die Räume dazu.' : 'Hier lohnt sich noch Training: die Räume der markierten Themen nochmal spielen.'}</p></div>
    <div class="frame qpanel" style="margin-top:16px"><h3 class="pix" style="font-size:.85rem;margin-bottom:10px">Teil 1 im Detail</h3><div class="examlist">
    ${E.qs.map((q, i) => { const a = E.ans[i] || { ok: false }; if (!a.ok && !S.mistakes.includes(q.id)) S.mistakes.push(q.id); return `<div class="examitem"><span>${md(q.q)}</span><b class="${a.ok ? 'ok-t' : 'no-t'}">${a.ok ? 'RICHTIG' : a.skipped ? 'ÜBERSPRUNGEN' : 'FALSCH'}</b>${a.ok ? '' : '<div class="note" style="flex-basis:100%">' + md(q.ex) + '</div>'}</div>`; }).join('')}
    </div><h3 class="pix" style="font-size:.85rem;margin:16px 0 10px">Teil 2</h3><div class="examlist">
    ${E.codeRes.map(c => `<div class="examitem"><span>${esc(c.r.title)}</span><b class="${c.passed === c.n ? 'ok-t' : 'no-t'}">${c.passed}/${c.n} Tests</b><button class="btn ghost" data-room="${c.r.id}">Raum öffnen</button></div>`).join('') || '<p class="note">Nicht erreicht.</p>'}
    </div><div class="actions"><button class="btn go" id="again">Neue Probeprüfung</button><button class="btn ghost" id="map">Karte</button></div></div></div>`;
  save();
  app.querySelectorAll('[data-room]').forEach(b => b.onclick = () => go('room', b.dataset.room));
  $('#again').onclick = () => go('exam'); $('#map').onclick = () => go('home');
}

/* ---------------- CHEAT SHEET ---------------- */
function cheat(wid) {
  const only = wid ? GAME.worlds.find(w => w.id === wid) : null;
  setWC(only);
  let h = `<div class="rhead"><button class="btn ghost" id="back">◂ ${only ? esc(only.title) : 'Karte'}</button><div class="title"><small>${only ? 'Welt ' + only.n : 'Alle Welten'}</small><h1>Spickzettel</h1></div>${only ? '<button class="btn ghost" id="allc">Alle Welten</button>' : ''}</div>`;
  (only ? [only] : GAME.worlds).forEach(w => {
    const cards = w.rooms.filter(r => r.kind === 'quiz').flatMap(r => r.cards || []).filter(c => !/^Boss/.test(c.title));
    if (!cards.length) return;
    h += `<div style="--wc: var(${w.color})"><h2 class="sect">${w.n} · ${esc(w.title)} <span class="note">${esc(w.chap)}</span></h2><div class="cgrid">` +
      cards.map(c => `<div class="frame ccard"><h3>${esc(c.title)}</h3>${mdPara(c.text)}${c.code ? codeBlock(c.code) : ''}</div>`).join('') + '</div></div>';
  });
  app.innerHTML = h;
  $('#back').onclick = () => only ? go('world', only.id) : go('home');
  const a = $('#allc'); if (a) a.onclick = () => go('cheat');
}

/* ---------------- boot ---------------- */
STARS.init();
renderHud();
const h0 = (location.hash || '').slice(1);
if (h0 && ROOM[h0]) go('room', h0);
else if (h0.startsWith('w-') && GAME.worlds.some(w => w.id === h0.slice(2))) go('world', h0.slice(2));
else if (['labor', 'cheat', 'exam', 'badges'].includes(h0)) go(h0); else go('home');
let titleSeen = false; try { titleSeen = !!sessionStorage.getItem('numcs.title'); } catch (e) {}
if (!titleSeen && (!h0 || h0 === 'home')) titleScreen();
</script>
