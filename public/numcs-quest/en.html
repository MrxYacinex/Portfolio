.pi*x)\nNs = 2**np.arange(3, 8)\nt = np.linspace(0, 2, 5001)\n# TODO: errors for both variants, then the orders\np_exakt = None\np_grad = None\nprint(p_exakt, p_grad)\n", "solution": "", "tests": [{"name": "p_exakt ≈ 4", "code": "assert p_exakt is not None and 3.7 < p_exakt < 4.3, f'p_exakt = {p_exakt}'"}, {"name": "p_grad clearly smaller", "code": "assert p_grad is not None and 1.5 < p_grad < 3.5, f'p_grad = {p_grad}'"}, {"name": "comparison", "code": "assert p_exakt > p_grad + 0.5, 'with exact derivatives the order should be higher'"}], "hints": ["For each N: nodes `x = np.linspace(0, 2, N+1)`, then two errors with hermite(...).", "Order: `-np.polyfit(np.log(Ns), np.log(err), 1)[0]`.", "np.gradient estimates the derivatives only with O(h²) (at the boundary even O(h)) – that costs order."], "ref": "Script 4.2 (Theorem 4.2.2)", "boss": true, "kind": "boss"}], "group": "kapitel"}, {"id": "qu", "title": "Quadrature", "chap": "Script chapter 5", "blurb": "Midpoint, trapezoidal, Simpson, order, Gauss, adaptive quadrature.", "rooms": [{"id": "qu1", "title": "Quadrature basics", "cards": [{"title": "Quadrature rules", "text": "Qₙ(f) = Σ ωᵢ f(cᵢ) ≈ ∫ₐᵇ f(x) dx with nodes cᵢ and weights ωᵢ.\nIdea: replace f by an interpolation polynomial and integrate that exactly → weights ωⱼ = ∫ ℓⱼ(x) dx.\n**Order p:** exact for all polynomials of degree ≤ p − 1 (definition 5.3.8). Symmetric rules have even order.\nMidpoint: order 2, trapezoidal: order 2, Simpson: order 4.", "code": null}, {"title": "Composite rules", "text": "Split the interval into N pieces of length h and apply the local rule to each.\nIf the local rule has order p and f is smooth enough: error = O(hᵖ) = O(N⁻ᵖ) (theorem 5.4.4).\nSmoothness limits the order: for f with a kink, Simpson brings no more than trapezoidal.\nFrom Newton-Cotes order 8 on, negative weights appear – bad for stability.", "code": "x, h = np.linspace(a, b, N + 1, retstep=True)\nI = h/2 * (f(x[0]) + 2*np.sum(f(x[1:-1])) + f(x[-1]))   # trapezoidal"}], "qs": [{"t": "mc", "q": "When does a quadrature rule have order p?", "code": null, "opts": ["If it has p nodes", "If it integrates all polynomials of degree ≤ p − 1 exactly (and xᵖ not)", "If the error falls like p·h", "If it has p weights"], "a": 1, "ex": "Definition 5.3.8.", "hint": null}, {"t": "mc", "q": "What order does the midpoint rule Q(f) = (b − a)·f((a + b)/2) have?", "code": null, "opts": ["1", "2", "3", "4"], "a": 1, "ex": "It is exact for linear functions (symmetry!), not for x².", "hint": null}, {"t": "mc", "q": "Why does Simpson's rule have order 4 even though it's based only on a parabola (degree 2)?", "code": null, "opts": ["Chance", "Because it is symmetric – symmetric rules have even order (theorem 5.3.11)", "Because it has 4 nodes", "Because h is small"], "a": 1, "ex": "Exact up to degree 2 → order ≥ 3, symmetric → even → 4.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "f = lambda x: x**3\nprint(2/6 * (f(0) + 4*f(1) + f(2)))", "opts": ["4.0", "3.0", "4.666666666666667", "2.0"], "a": 0, "ex": "Simpson on [0, 2] with h = 1: (b−a)/6·(f(a) + 4f(m) + f(b)) = 4 – exact because of order 4.", "hint": null}, {"t": "mc", "q": "The composite trapezoidal rule has error O(h²). You double N. The error becomes …", "code": null, "opts": ["halved", "quartered", "divided by 16", "stay the same"], "a": 1, "ex": "h halved → h² quartered.", "hint": null}, {"t": "mc", "q": "f has a kink at x = 0.5 (only C⁰). What does Simpson gain over trapezoidal?", "code": null, "opts": ["Order 4 instead of 2", "Hardly anything – the missing smoothness limits the convergence", "Exact results", "Simpson diverges"], "a": 1, "ex": "The order from theorem 5.4.4 requires enough smoothness.", "hint": null}, {"t": "mc", "q": "How do you get the weights of an interpolatory quadrature rule?", "code": null, "opts": ["ωⱼ = f(cⱼ)", "ωⱼ = ∫ₐᵇ ℓⱼ(x) dx (integral of the Lagrange polynomial)", "ωⱼ = 1/n", "randomly"], "a": 1, "ex": "Remark 5.3.7.", "hint": null}, {"t": "mc", "q": "What is the problem with high-order Newton-Cotes rules (equispaced nodes)?", "code": null, "opts": ["They are too slow", "From order 8 on there are negative weights → cancellation and instability", "They are not exact for constants", "None of them"], "a": 1, "ex": "Besides, Runge's phenomenon is behind it.", "hint": null}, {"t": "fill", "q": "Complete the composite Simpson rule (2N+1 points, spacing h).", "code": "I = h/3 * np.sum(f(x[:-2:2]) + ____*f(x[1:-1:2]) + f(x[2::2]))", "acc": ["4", "4.", "4.0"], "check": "assert abs(I - (np.e - 1)) < 1e-6", "ex": "Weights 1, 4, 1 per double interval.", "hint": null, "pre": "f = np.exp\nN = 8\nx, h = np.linspace(0, 1, 2*N + 1, retstep=True)"}], "kind": "quiz"}, {"id": "qu-c1", "title": "Composite midpoint rule", "text": "Write `mpr(f, a, b, N)`: composite midpoint rule with N equally long subintervals, h·Σ f(midpoints). Without a loop!", "template": "import numpy as np\n\ndef mpr(f, a, b, N):\n    # TODO\n    pass\n\nprint(mpr(np.exp, 0, 1, 100), np.e - 1)\n", "solution": "", "tests": [{"name": "exact for lines", "code": "assert np.isclose(mpr(lambda x: 3*x + 1, 0, 2, 3), 8), 'linear functions must be exact'"}, {"name": "exp accurate", "code": "assert abs(mpr(np.exp, 0, 1, 100) - (np.e - 1)) < 2e-5, 'too inaccurate'"}, {"name": "order 2", "code": "e1 = abs(mpr(np.exp, 0, 1, 10) - (np.e-1)); e2 = abs(mpr(np.exp, 0, 1, 20) - (np.e-1)); assert 3.8 < e1/e2 < 4.2, f'ratio {e1/e2:.2f}, expected 4'"}, {"name": "without a loop", "code": "body = _SRC.split('def mpr')[1].split('print(')[0]; assert 'for ' not in body, 'please vectorize'"}], "hints": ["Midpoints: `a + h*(np.arange(N) + 0.5)` with `h = (b - a)/N`.", "Result `h * np.sum(f(m))`."], "ref": "Script 5.4", "boss": false, "kind": "code"}, {"id": "qu2", "title": "Gauss & adaptivity", "cards": [{"title": "Gauss-Legendre and Clenshaw-Curtis", "text": "With n nodes, **Gauss-Legendre** reaches the maximum possible order **2n** (nodes = zeros of the Legendre polynomial Pₙ).\nThe weights are positive. Computation: Golub-Welsch (eigenvalues of a tridiagonal matrix, O(n³)) or faster in O(n).\n**Clenshaw-Curtis:** nodes = Chebyshev abscissas, weights via FFT in O(n log n); for smooth f almost as good as Gauss.", "code": null}, {"title": "Adaptive quadrature", "text": "Idea: refine where the error is large. Local error estimate = difference of two rules\nof different order (e.g. |Simpson − trapezoidal|) – almost free, because the midpoints are reused.\nStop when the estimated total error < rtol·|I| or < abstol (for I ≈ 0).", "code": null}], "qs": [{"t": "mc", "q": "What order does Gauss-Legendre with n nodes have?", "code": null, "opts": ["n", "n + 1", "2n", "2n + 1"], "a": 2, "ex": "Exact for all polynomials of degree ≤ 2n − 1.", "hint": null}, {"t": "mc", "q": "What are the Gauss-Legendre nodes?", "code": null, "opts": ["equispaced points", "Chebyshev abscissas", "the zeros of the Legendre polynomial Pₙ", "random points"], "a": 2, "ex": "Golub-Welsch computes them as eigenvalues of the Jacobi matrix.", "hint": null}, {"t": "mc", "q": "What sign do the Gauss-Legendre weights have?", "code": null, "opts": ["always positive", "alternating", "can be negative", "all equal"], "a": 0, "ex": "Theorem 5.5.15: bᵢ = ∫ ℓᵢ(t)² dt > 0.", "hint": null}, {"t": "mc", "q": "What is the advantage of Clenshaw-Curtis over Gauss?", "code": null, "opts": ["Higher order", "Nodes and weights via FFT in O(n log n), and the nodes are nested (reusable)", "Negative weights", "Exact for all functions"], "a": 1, "ex": "For smooth f both converge similarly fast.", "hint": null}, {"t": "mc", "q": "How does the adaptive quadrature from code 5.6.2 estimate the local error?", "code": null, "opts": ["With the exact solution", "With |Simpson − trapezoidal| on every subinterval", "With Monte Carlo", "Not at all"], "a": 1, "ex": "The more accurate rule provides the value, the difference the error indicator.", "hint": null}, {"t": "mc", "q": "Why does adaptive quadrature need an absolute tolerance `abstol` besides `rtol`?", "code": null, "opts": ["To make it faster", "In case the integral is ≈ 0 – then a relative tolerance is meaningless", "For negative functions", "Not at all"], "a": 1, "ex": "rtol·|I| would then be ≈ 0 and the recursion would never stop.", "hint": null}, {"t": "mc", "q": "For f(x) = exp(6 sin 2πx): where does adaptive quadrature put most points?", "code": null, "opts": ["evenly", "where f changes quickly (around the peak at x ≈ 0.25)", "only at the boundary", "at x = 0.75"], "a": 1, "ex": "Refinement happens where |Simpson − trapezoidal| is large.", "hint": null}, {"t": "mc", "q": "Which polynomials does Gauss with 5 points integrate exactly?", "code": null, "opts": ["up to degree 4", "up to degree 5", "up to degree 9", "up to degree 10"], "a": 2, "ex": "Order 2n = 10 → exact up to degree 9.", "hint": null}], "kind": "quiz"}, {"id": "qu-c2", "title": "Trapezoidal and Simpson rule", "text": "Write the composite rules as in the script (code 5.4.6, 5.4.7):\n`trapez(f, a, b, N)` with N subintervals and `simpson(f, a, b, N)` with N subintervals (so 2N+1 points).", "template": "import numpy as np\n\ndef trapez(f, a, b, N):\n    x, h = np.linspace(a, b, N + 1, retstep=True)\n    # TODO\n    pass\n\ndef simpson(f, a, b, N):\n    x, h = np.linspace(a, b, 2*N + 1, retstep=True)\n    # TODO\n    pass\n\nprint(trapez(np.exp, 0, 1, 10), simpson(np.exp, 0, 1, 10), np.e - 1)\n", "solution": "", "tests": [{"name": "trapezoidal exact for lines", "code": "assert np.isclose(trapez(lambda x: 2*x, 0, 3, 4), 9), 'trapezoidal: lines exact'"}, {"name": "trapezoidal order 2", "code": "e1 = abs(trapez(np.exp, 0, 1, 16) - (np.e-1)); e2 = abs(trapez(np.exp, 0, 1, 32) - (np.e-1)); assert 3.8 < e1/e2 < 4.2, f'ratio {e1/e2:.2f}'"}, {"name": "Simpson exact for cubics", "code": "assert np.isclose(simpson(lambda x: x**3, 0, 2, 1), 4), 'Simpson: x³ exact (order 4)'"}, {"name": "Simpson order 4", "code": "e1 = abs(simpson(np.exp, 0, 1, 8) - (np.e-1)); e2 = abs(simpson(np.exp, 0, 1, 16) - (np.e-1)); assert 14 < e1/e2 < 18, f'ratio {e1/e2:.2f}, expected 16'"}], "hints": ["Trapezoidal: endpoints with weight h/2, interior ones with h: `h/2*(f(x[0]) + 2*np.sum(f(x[1:-1])) + f(x[-1]))`.", "Simpson: `h/3*np.sum(f(x[:-2:2]) + 4*f(x[1:-1:2]) + f(x[2::2]))` – pattern 1, 4, 1 per subinterval."], "ref": "Script Code 5.4.6–5.4.7", "boss": false, "kind": "code"}, {"id": "qu-c3", "title": "Order of a quadrature rule", "text": "A quadrature rule on [−1, 1] has **order p** if it integrates all polynomials of degree ≤ p−1 exactly and x^p no longer (definition 5.3.8). Write `ordnung(knoten, gewichte)` that finds p by testing the monomials x⁰, x¹, x², … Exact: ∫₋₁¹ xᵏ dx = (1 − (−1)^{k+1})/(k+1).", "template": "import numpy as np\n\ndef ordnung(knoten, gewichte):\n    c = np.asarray(knoten, dtype=float); w = np.asarray(gewichte, dtype=float)\n    # TODO: k = 0, 1, 2, ... up to the first mismatch\n    pass\n\nprint(ordnung([0.], [2.]))                     # midpoint: 2\nprint(ordnung([-1., 0., 1.], [1/3, 4/3, 1/3]))   # Simpson: 4\n", "solution": "", "tests": [{"name": "midpoint rule: 2", "code": "assert ordnung([0.], [2.]) == 2, f'{ordnung([0.], [2.])}'"}, {"name": "trapezoidal rule: 2", "code": "assert ordnung([-1., 1.], [1., 1.]) == 2, f'{ordnung([-1., 1.], [1., 1.])}'"}, {"name": "Simpson: 4", "code": "assert ordnung([-1., 0., 1.], [1/3, 4/3, 1/3]) == 4, 'Simpson'"}, {"name": "Gauss 2 points: 4", "code": "s = 1/np.sqrt(3); assert ordnung([-s, s], [1., 1.]) == 4, 'Gauss-2'"}, {"name": "Gauss 5 points: 10", "code": "x, w = np.polynomial.legendre.leggauss(5); assert ordnung(x, w) == 10, f'{ordnung(x, w)}'"}], "hints": ["For k = 0, 1, 2, …: compare `np.sum(w * c**k)` with the exact integral (tolerance ~1e-12).", "The first k that doesn't match is the order."], "ref": "Script 5.3.8–5.3.11", "boss": false, "kind": "code"}, {"id": "qu-c4", "title": "From the reference interval to [a, b]", "text": "Nodes ĉ and weights ŵ are given on [−1, 1]. On [a, b] we have cᵢ = (a+b)/2 + (b−a)/2·ĉᵢ and wᵢ = (b−a)/2·ŵᵢ. Write `transformiere(knoten, gewichte, a, b)` → `(c, w)` and `quad(f, a, b, knoten, gewichte)`.", "template": "import numpy as np\n\ndef transformiere(knoten, gewichte, a, b):\n    # TODO\n    pass\n\ndef quad(f, a, b, knoten, gewichte):\n    # TODO\n    pass\n\nprint(quad(lambda x: x**3, 0, 2, [-1., 0., 1.], [1/3, 4/3, 1/3]))   # 4\n", "solution": "", "tests": [{"name": "Simpson on [0, 2]", "code": "assert np.isclose(quad(lambda x: x**3, 0, 2, [-1., 0., 1.], [1/3, 4/3, 1/3]), 4), 'x³ on [0, 2]'"}, {"name": "nodes on [2, 6]", "code": "c, w = transformiere(np.array([-1., 0., 1.]), np.array([1/3, 4/3, 1/3]), 2, 6); assert np.allclose(c, [2, 4, 6]) and np.isclose(w.sum(), 4), f'c = {c}, w = {w}'"}, {"name": "Gauss on [0, 1]", "code": "x, w = np.polynomial.legendre.leggauss(8); assert abs(quad(np.exp, 0, 1, x, w) - (np.e - 1)) < 1e-14, 'Gauss-8 on [0,1]'"}], "hints": ["The sum of the weights must equal the interval length b − a.", "`quad` = `np.sum(w * f(c))` with the transformed c, w."], "ref": "Script 5.3", "boss": false, "kind": "code"}, {"id": "qu-c5", "title": "Gauss-Legendre with Golub-Welsch", "text": "The Gauss nodes are the eigenvalues of the symmetric Jacobi matrix J with off-diagonal bᵢ = i/√(4i² − 1), i = 1…n−1; the weights are 2·(first component of the eigenvector)² (code 5.5.16). Write `gaussquad(n)` → `(x, w)`. `leggauss` is not allowed.", "template": "import numpy as np\n\ndef gaussquad(n):\n    i = np.arange(1, n)\n    # TODO: b, J, eigh, weights\n    pass\n\nx, w = gaussquad(3)\nprint(x, w)   # [-0.7746  0.  0.7746] [0.5556 0.8889 0.5556]\n", "solution": "", "tests": [{"name": "like leggauss", "code": "for n in [2, 5, 10]:\n    x, w = gaussquad(n); xr, wr = np.polynomial.legendre.leggauss(n)\n    assert np.allclose(np.sort(x), xr) and np.allclose(w[np.argsort(x)], wr), f'n = {n} wrong'"}, {"name": "order 2n", "code": "x, w = gaussquad(4); assert np.isclose(np.sum(w*x**6), 2/7) and not np.isclose(np.sum(w*x**8), 2/9), 'Gauss with 4 points is exact up to degree 7'"}, {"name": "positive weights", "code": "x, w = gaussquad(12); assert np.all(w > 0) and np.isclose(w.sum(), 2), 'weights positive, sum 2'"}, {"name": "without leggauss", "code": "body = _SRC.split('def gaussquad')[1].split('x, w =')[0]; assert 'leggauss' not in body, 'leggauss is not allowed'"}], "hints": ["`J = np.diag(b, -1) + np.diag(b, 1)` – symmetric, so `np.linalg.eigh`.", "`x, ev = np.linalg.eigh(J)`, weights `2 * ev[0, :]**2`."], "ref": "Script 5.5, Code 5.5.16", "boss": false, "kind": "code"}, {"id": "qu-c6", "title": "h-adaptive quadrature", "text": "Implement `adaptquad(f, M, rtol, abstol)` following code 5.6.2: local trapezoidal and Simpson values on every interval of the mesh M, error estimate |Simpson − trapezoidal|, and recursive refinement of the intervals with a large error.", "template": "import numpy as np\n\ndef adaptquad(f, M, rtol, abstol):\n    h = np.diff(M)\n    mp = 0.5*(M[:-1] + M[1:])\n    fx = f(M); fm = f(mp)\n    trp_loc = h*(fx[:-1] + 2*fm + fx[1:]) / 4\n    simp_loc = h*(fx[:-1] + 4*fm + fx[1:]) / 6\n    I = simp_loc.sum()\n    # TODO: error estimate and refinement\n    return I\n\nf = lambda x: np.exp(6*np.sin(2*np.pi*x))\nprint(adaptquad(f, np.arange(11.)/10, 1e-6, 1e-10))\n", "solution": "", "tests": [{"name": "exp(6 sin 2πx)", "code": "from scipy import integrate; f = lambda x: np.exp(6*np.sin(2*np.pi*x)); ex = integrate.quad(f, 0, 1, epsabs=1e-13)[0]; I = adaptquad(f, np.arange(11.)/10, 1e-6, 1e-10); assert abs(I-ex)/ex < 1e-6, f'rel. error {abs(I-ex)/ex:.1e}'"}, {"name": "peak at 0", "code": "from scipy import integrate; f = lambda x: 1/(1e-4 + x**2); ex = integrate.quad(f, 0, 1, points=[0], epsabs=1e-12)[0]; I = adaptquad(f, np.linspace(0, 1, 11), 1e-6, 1e-10); assert abs(I-ex)/ex < 1e-5, f'rel. error {abs(I-ex)/ex:.1e}'"}, {"name": "recursive", "code": "assert _SRC.count('adaptquad(') >= 3, 'adaptquad should call itself'"}], "hints": ["`est_loc = np.abs(simp_loc - trp_loc)`, `err_tot = est_loc.sum()`.", "Refine if `err_tot > rtol*abs(I) and err_tot > abstol`: intervals with `est_loc > 0.9*err_tot/len(est_loc)` get their midpoint added.", "`I = adaptquad(f, np.sort(np.append(M, mp[refcells])), rtol, abstol)`."], "ref": "Script 5.6, Code 5.6.2", "boss": false, "kind": "code"}, {"id": "qu-boss", "title": "Boss: Quadrature Titan", "text": "For f(x) = exp(x)·cos(3x) on [0, 2] compare the composite trapezoidal and Simpson rules with N = 2, 4, …, 256 and Gauss-Legendre with n = 1, …, 12 points. Determine the orders of convergence `p_tr`, `p_si` (polyfit in log-log over N) and the Gauss error `err_gauss12` at n = 12. Plot everything (error against number of function evaluations) as\n`./cx_out/quadratur.png`.", "template": "import numpy as np\nimport matplotlib.pyplot as plt\n\nf = lambda x: np.exp(x)*np.cos(3*x)\na, b = 0., 2.\nexakt = (np.exp(2)*(np.cos(6) + 3*np.sin(6)) - 1) / 10\n\ndef trapez(f, a, b, N):\n    x, h = np.linspace(a, b, N + 1, retstep=True)\n    return h/2*(f(x[0]) + 2*np.sum(f(x[1:-1])) + f(x[-1]))\n\ndef simpson(f, a, b, N):\n    x, h = np.linspace(a, b, 2*N + 1, retstep=True)\n    return h/3*np.sum(f(x[:-2:2]) + 4*f(x[1:-1:2]) + f(x[2::2]))\n\nNs = 2**np.arange(1, 9)\n# TODO: errors, orders p_tr, p_si, Gauss error, plot\np_tr = p_si = err_gauss12 = None\nprint(p_tr, p_si, err_gauss12)\n", "solution": "", "tests": [{"name": "trapezoidal order ≈ 2", "code": "assert p_tr is not None and 1.8 < p_tr < 2.2, f'p_tr = {p_tr}'"}, {"name": "Simpson order ≈ 4", "code": "assert p_si is not None and 3.6 < p_si < 4.4, f'p_si = {p_si}'"}, {"name": "Gauss with 12 points very accurate", "code": "assert err_gauss12 is not None and err_gauss12 < 1e-10, f'err_gauss12 = {err_gauss12}'"}, {"name": "figure", "code": "import os; assert os.path.exists('cx_out/quadratur.png'), 'cx_out/quadratur.png missing'"}], "hints": ["Error arrays with a list comprehension: `np.array([abs(trapez(f, a, b, N) - exakt) for N in Ns])`.", "For Simpson the error almost reaches eps at large N – fit the order only over the first N values (e.g. `Ns[:6]`).", "Gauss on [a, b]: transform the nodes/weights from `np.polynomial.legendre.leggauss(n)`."], "ref": "Script 5.4–5.5", "boss": true, "kind": "boss"}], "group": "kapitel"}, {"id": "la", "title": "Linear Algebra", "chap": "Toolbox · numpy.linalg, scipy.linalg", "blurb": "@, dot, vdot, outer, kron, einsum, solve, lstsq, QR, SVD, LU, Cholesky, condition.", "rooms": [{"id": "la1", "title": "@, dot, vdot, outer, kron", "cards": [{"title": "Five products, five meanings", "text": "`a * b` – element-wise (same shape or broadcasting).\n`a @ b` or `np.dot(a, b)` – dot product Σ aᵢbᵢ, **without** conjugation. For matrices: matrix product.\n`np.vdot(b, a)` – complex inner product bᴴa: the **first** argument is conjugated.\n`np.outer(a, b)` – tensor product abᵀ, matrix with entries aᵢbⱼ (the same as `a[:, None] * b[None, :]`).\n`np.kron(A, B)` – Kronecker product: every entry Aᵢⱼ is replaced by the block Aᵢⱼ·B.", "code": "a = np.array([1., 2., 3.])\nb = np.array([4.j, 5.j, 6.j])\na * b          # [ 4j 10j 18j]\nb @ a          # 32j       (no conjugation)\nnp.vdot(b, a)  # -32j      (b conjugated)\nnp.outer(a, a) # 3x3 matrix a_i a_j"}, {"title": "Watch the shapes", "text": "1D arrays are neither rows nor columns in NumPy. `A @ x` with x of length n gives a 1D array again.\n`x @ A` computes xᵀA (row times matrix).\n`@` requires arrays with at least one dimension – scalar times matrix is written with `*`.\n`np.kron(A, B)` for A (m×n) and B (l×k) has the shape (m·l) × (n·k).", "code": "A = np.array([[1, 2], [3, 4]])\nx = np.array([1, 1])\nA @ x   # [3 7]  row sums\nx @ A   # [4 6]  column sums"}], "qs": [{"t": "out", "q": "What does this code print?", "code": "a = np.array([1, 2, 3])\nb = np.array([4, 5, 6])\nprint(a @ b)", "opts": ["32", "[ 4 10 18]", "[5 7 9]", "ValueError"], "a": 0, "ex": "1·4 + 2·5 + 3·6 = 32. For 1D arrays `@` is the dot product.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "print(np.outer([1, 2], [3, 4]))", "opts": ["[[3 4]\n [6 8]]", "11", "[3 8]", "[[3 6]\n [4 8]]"], "a": 0, "ex": "Entry (i, j) is aᵢ·bⱼ: row 1 = 1·[3, 4], row 2 = 2·[3, 4].", "hint": null}, {"t": "out", "q": "Complex! What does this code print?", "code": "b = np.array([1j, 2])\nprint(np.vdot(b, b))", "opts": ["(5+0j)", "(3+0j)", "5", "(-1+4j)"], "a": 0, "ex": "vdot conjugates the first argument: |i|² + |2|² = 1 + 4 = 5. That's the squared norm.", "hint": null}, {"t": "out", "q": "And without conjugation?", "code": "b = np.array([1j, 2])\nprint(b @ b)", "opts": ["(3+0j)", "(5+0j)", "5", "(-1+4j)"], "a": 0, "ex": "i·i + 2·2 = −1 + 4 = 3. So for complex vectors `@` is **not** an inner product in the sense of the norm.", "hint": null}, {"t": "mc", "q": "Which line computes the complex inner product ⟨b, a⟩ = bᴴa?", "code": null, "opts": ["b @ a", "np.dot(b, a)", "np.vdot(b, a)", "np.outer(b, a)"], "a": 2, "ex": "Only `np.vdot` conjugates. Alternatively `np.dot(b.conj(), a)` (script code 1.3.1).", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "B = np.array([[1, 2], [3, 4]])\nprint(np.kron(np.eye(2), B))", "opts": ["[[1. 2. 0. 0.]\n [3. 4. 0. 0.]\n [0. 0. 1. 2.]\n [0. 0. 3. 4.]]", "[[1. 0. 2. 0.]\n [0. 1. 0. 2.]\n [3. 0. 4. 0.]\n [0. 3. 0. 4.]]", "[[1. 2.]\n [3. 4.]]", "[[1. 0.]\n [0. 4.]]"], "a": 0, "ex": "I ⊗ B is a block-diagonal matrix with B on the diagonal. (B ⊗ I would be the second option.)", "hint": null}, {"t": "typ", "q": "Type the shape.", "code": "print(np.kron(np.ones((2, 3)), np.ones((4, 5))).shape)", "acc": ["(8, 15)"], "ex": "(2·4) × (3·5) – the rows multiply, and so do the columns.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "A = np.array([[1, 2], [3, 4]])\nx = np.array([1, 1])\nprint(x @ A)", "opts": ["[4 6]", "[3 7]", "10", "[[1 2]\n [3 4]]"], "a": 0, "ex": "x @ A = xᵀA: sum of the rows, i.e. column sums. A @ x would give the row sums [3 7].", "hint": null}, {"t": "mc", "q": "What happens with `2 @ A` (A is a 2×2 matrix)?", "code": null, "opts": ["Result 2·A", "ValueError: @ needs arrays with at least one dimension – for scalars you use *", "Trace of A times 2", "A gets squared"], "a": 1, "ex": "Scalar times matrix is written `2 * A`.", "hint": null}, {"t": "fill", "q": "Complete it so that M is the same as np.outer(a, b) (broadcasting).", "code": "M = a[:, None] * ____", "acc": ["b[None,:]", "b[None, :]", "b", "b[np.newaxis,:]", "b[np.newaxis, :]"], "check": "assert np.allclose(M, np.outer(a, b))", "ex": "Column (n, 1) times row (1, m) gives (n, m).", "hint": null, "pre": "a = np.array([1., 2., 3.])\nb = np.array([4., 5.])"}], "kind": "quiz"}, {"id": "la-c1", "title": "Products course", "text": "Compute with the appropriate NumPy functions:\n`skal` = ⟨b, a⟩ = bᴴa (complex inner product, b conjugated),\n`dyad` = a·bᵀ (tensor product, **without** conjugation),\n`K` = A ⊗ B (Kronecker product),\n`y` = A·(A·v) – with two matrix-vector products, not with A·A.", "template": "import numpy as np\na = np.array([1., 2., 3.])\nb = np.array([1j, 2., 1 - 1j])\nA = np.array([[1., 2.], [3., 4.]])\nB = np.array([[0., 1.], [1., 0.]])\nv = np.array([1., -1.])\n\nskal = None   # TODO\ndyad = None   # TODO\nK = None      # TODO\ny = None      # TODO\nprint(skal, dyad.shape if dyad is not None else None, K, y, sep='\\n')\n", "solution": "", "tests": [{"name": "skal = bᴴa", "code": "assert skal is not None and np.isclose(skal, np.sum(np.conj(b)*a)), f'skal = {skal}'"}, {"name": "dyad = a bᵀ", "code": "assert dyad is not None and np.allclose(dyad, a[:, None]*b[None, :]), 'dyad is wrong (no conjugation!)'"}, {"name": "K = A ⊗ B", "code": "assert K is not None and K.shape == (4, 4) and np.allclose(K[2:, :2], 3*B), 'K is wrong'"}, {"name": "y = A(Av)", "code": "assert y is not None and np.allclose(y, np.array([[7., 10.], [15., 22.]]) @ v), f'y = {y}'"}, {"name": "without A @ A", "code": "assert 'A @ A' not in _SRC and 'A@A' not in _SRC, 'please use two matrix-vector products instead of A @ A'"}], "hints": ["`np.vdot(b, a)` conjugates b. `np.outer(a, b)` does not conjugate.", "`np.kron(A, B)`; for y: `A @ (A @ v)` – parentheses decide the cost: O(n²) instead of O(n³)."], "ref": "Script Code 1.3.1–1.3.2", "boss": false, "kind": "code"}, {"id": "la2", "title": "einsum", "cards": [{"title": "Einstein summation", "text": "Every argument gets one letter per axis. **An index that appears in the inputs but not after `->` is summed over.**\nAfter `->` comes the shape of the result. Without `->` the non-repeated indices are output in alphabetical order.", "code": "np.einsum('i,i->', a, b)        # dot product  a @ b\nnp.einsum('i,j->ij', a, b)      # outer(a, b)\nnp.einsum('ij,j->i', A, x)      # A @ x\nnp.einsum('ik,kj->ij', A, B)    # A @ B\nnp.einsum('ii->', A)            # trace\nnp.einsum('ii->i', A)           # diagonal\nnp.einsum('ij->ji', A)          # transpose\nnp.einsum('ij->j', A)           # column sums\nnp.einsum('s,st,t->', x, A, x)  # quadratic form xᵀAx"}], "qs": [{"t": "out", "q": "What does this code print?", "code": "A = np.array([[1, 2], [3, 4]])\nprint(np.einsum('ii->', A))", "opts": ["5", "[1 4]", "10", "[[1 0]\n [0 4]]"], "a": 0, "ex": "i appears twice and disappears: Σᵢ Aᵢᵢ = 1 + 4, the trace.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "A = np.array([[1, 2], [3, 4]])\nprint(np.einsum('ij->j', A))", "opts": ["[4 6]", "[3 7]", "10", "[1 4]"], "a": 0, "ex": "i is summed, j stays: sum over the rows = column sums.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "A = np.array([[1, 2], [3, 4]])\nprint(np.einsum('ij->ji', A))", "opts": ["[[1 3]\n [2 4]]", "[[1 2]\n [3 4]]", "[4 6]", "10"], "a": 0, "ex": "Nothing is summed, only the axes are swapped: the transpose.", "hint": null}, {"t": "mc", "q": "What does `np.einsum('ik,kj->ij', A, B)` compute?", "code": null, "opts": ["A * B", "A @ B", "A.T @ B", "np.kron(A, B)"], "a": 1, "ex": "k appears in both factors and is summed: Σₖ AᵢₖBₖⱼ – the matrix product.", "hint": null}, {"t": "mc", "q": "What does `np.einsum('i,j->ij', a, b)` compute?", "code": null, "opts": ["a @ b", "np.outer(a, b)", "a * b", "np.vdot(a, b)"], "a": 1, "ex": "No index is summed, both stay: matrix aᵢbⱼ.", "hint": null}, {"t": "fill", "q": "Complete it so that y = A @ x is computed.", "code": "y = np.einsum('____', A, x)", "acc": ["ij,j->i", "ij,j"], "check": "assert np.allclose(y, A @ x)", "ex": "A has the indices ij, x the index j. j should be summed, i stays.", "hint": null, "pre": "A = np.arange(6.).reshape(2, 3)\nx = np.array([1., 2., 3.])"}, {"t": "out", "q": "What does this code print?", "code": "A = np.array([[1., 2.], [3., 4.]])\nx = np.array([1., 2.])\nprint(np.einsum('s,st,t->', x, A, x))", "opts": ["27.0", "[ 5. 11.]", "30.0", "13.0"], "a": 0, "ex": "xᵀAx = 1·1·1 + 1·2·2 + 2·3·1 + 2·4·2 = 1 + 4 + 6 + 16 = 27.", "hint": null}, {"t": "typ", "q": "Type the output.", "code": "print(np.einsum('ii->i', np.arange(9).reshape(3, 3)))", "acc": ["[0 4 8]"], "ex": "'ii->i' reads out the diagonal.", "hint": null}, {"t": "mc", "q": "What is `np.einsum('ij,ij->', A, B)`?", "code": null, "opts": ["A @ B", "Sum of all Aᵢⱼ·Bᵢⱼ (Frobenius inner product)", "It's not the trace of A @ B.T", "An error"], "a": 1, "ex": "Both indices are summed: Σᵢⱼ AᵢⱼBᵢⱼ = np.sum(A * B). By the way, that equals the trace of Aᵀ B.", "hint": null}], "kind": "quiz"}, {"id": "la-c2", "title": "einsum translator", "text": "Write every function **only with `np.einsum`** (no `@`, no `.T`, no `np.sum`, no `np.trace`):\n`spur(A)`, `diagonale(A)`, `matvec(A, x)` = A·x, `matmul(A, B)` = A·B, `frob(A, B)` = Σᵢⱼ AᵢⱼBᵢⱼ, `transp(A)` = Aᵀ.", "template": "import numpy as np\n\ndef spur(A):       return None   # TODO\ndef diagonale(A):  return None   # TODO\ndef matvec(A, x):  return None   # TODO\ndef matmul(A, B):  return None   # TODO\ndef frob(A, B):    return None   # TODO\ndef transp(A):     return None   # TODO\n\nA = np.arange(9.).reshape(3, 3)\nprint(spur(A), diagonale(A))\n", "solution": "", "tests": [{"name": "spur & diagonale", "code": "A = np.random.default_rng(1).random((4, 4)); assert np.isclose(spur(A), np.trace(A)) and np.allclose(diagonale(A), np.diag(A)), 'spur/diagonale wrong'"}, {"name": "matvec", "code": "rng = np.random.default_rng(2); A = rng.random((3, 5)); x = rng.random(5); assert np.allclose(matvec(A, x), A @ x), 'matvec wrong'"}, {"name": "matmul (rectangular)", "code": "rng = np.random.default_rng(3); A = rng.random((2, 4)); B = rng.random((4, 3)); assert np.allclose(matmul(A, B), A @ B), 'matmul wrong'"}, {"name": "frob & transp", "code": "rng = np.random.default_rng(4); A, B = rng.random((2, 3, 3)); assert np.isclose(frob(A, B), np.sum(A*B)) and np.allclose(transp(A), A.T), 'frob/transp wrong'"}, {"name": "einsum only", "code": "body = _SRC.split('A = np.arange')[0]; assert all(s not in body for s in ['@', '.T', 'np.sum', 'np.trace', 'np.diag', 'dot(']), 'use np.einsum only'"}], "hints": ["A repeated index is summed, the result comes after `->`.", "Trace 'ii->', diagonal 'ii->i', A·x 'ij,j->i', A·B 'ik,kj->ij', Frobenius 'ij,ij->', transpose 'ij->ji'."], "ref": "Script Code 1.3.2", "boss": false, "kind": "code"}, {"id": "la3", "title": "numpy.linalg", "cards": [{"title": "The most important functions", "text": "`np.linalg.solve(A, b)` – solves Ax = b (LU, O(n³)). Use `inv` only if you really need the inverse.\n`np.linalg.norm(x)` – 2-norm for vectors, Frobenius for matrices; `norm(A, 2)` spectral norm, `norm(A, np.inf)` max. row sum.\n`np.linalg.det`, `np.linalg.matrix_rank`, `np.linalg.cond(A)` = σ_max/σ_min.\n`np.linalg.eig` (general), `np.linalg.eigh` (symmetric: real eigenvalues, sorted **ascending**).", "code": null}, {"title": "Decompositions: QR, SVD, lstsq", "text": "`Q, R = np.linalg.qr(A)` – reduced QR decomposition A = QR.\n`U, s, Vh = np.linalg.svd(A)` – **s is a 1D array** (descending), A = U @ np.diag(s) @ Vh (with `full_matrices=False`).\nBest rank-k approximation: `U[:, :k] * s[:k] @ Vh[:k, :]`, error in the 2-norm = s[k].\n`x, res, rank, sv = np.linalg.lstsq(A, b, rcond=None)` – least-squares solution.", "code": "U, s, Vh = np.linalg.svd(A, full_matrices=False)\nA2 = U[:, :2] * s[:2] @ Vh[:2, :]     # best rank-2 approximation\nx = np.linalg.lstsq(A, b, rcond=None)[0]"}], "qs": [{"t": "out", "q": "What does this code print?", "code": "print(np.linalg.norm([3., 4.]))", "opts": ["5.0", "7.0", "25.0", "4.0"], "a": 0, "ex": "The default norm for vectors is the 2-norm: √(9 + 16).", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "A = np.array([[1., 2.], [3., 4.]])\nprint(np.linalg.norm(A, np.inf))", "opts": ["7.0", "6.0", "5.477225575051661", "4.0"], "a": 0, "ex": "The ∞-norm of a matrix is the maximum absolute row sum: max(1+2, 3+4) = 7.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "A = np.array([[1., 2.], [3., 4.]])\nprint(round(np.linalg.det(A), 6))", "opts": ["-2.0", "2.0", "10.0", "-2"], "a": 0, "ex": "1·4 − 2·3 = −2. round, because det is computed via LU and has small rounding errors.", "hint": null}, {"t": "mc", "q": "What does `np.linalg.svd(A)` return?", "code": null, "opts": ["U, Σ (matrix), V", "U, s (1D, descending), Vh with A = U @ np.diag(s) @ Vh", "only the singular values", "Q, R"], "a": 1, "ex": "Careful: s is a vector and the third result is already Vᴴ, not V.", "hint": null}, {"t": "mc", "q": "When do you use `np.linalg.eigh` instead of `eig`?", "code": null, "opts": ["Always", "For symmetric/Hermitian matrices – real eigenvalues, sorted ascending, more stable", "For triangular matrices", "Never"], "a": 1, "ex": "Golub-Welsch for the Gauss nodes uses `eigh` for exactly this reason.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "print(np.linalg.eigh(np.array([[2., 1.], [1., 2.]]))[0])", "opts": ["[1. 3.]", "[3. 1.]", "[2. 2.]", "(1.0, 3.0)"], "a": 0, "ex": "Eigenvalues 1 and 3, sorted ascending by eigh.", "hint": null}, {"t": "out", "q": "What does this code print? (the signs in QR are not unique, hence abs)", "code": "Q, R = np.linalg.qr(np.array([[3., 0.], [4., 5.]]))\nprint(np.round(np.abs(R), 6))", "opts": ["[[5. 4.]\n [0. 3.]]", "[[3. 0.]\n [4. 5.]]", "[[5. 0.]\n [4. 3.]]", "[[1. 0.]\n [0. 1.]]"], "a": 0, "ex": "The first column [3, 4] has length 5. Projecting the second column onto q₁ = [0.6, 0.8] gives 4, the rest [−2.4, 1.8] has length 3.", "hint": null}, {"t": "mc", "q": "What does `np.linalg.lstsq(A, b, rcond=None)` return?", "code": null, "opts": ["only x", "(x, residuals, rank, singular values) – x is the first element", "Q and R", "the pseudoinverse"], "a": 1, "ex": "That's why you often write `np.linalg.lstsq(A, b, rcond=None)[0]`.", "hint": null}, {"t": "typ", "q": "Type the output.", "code": "print(np.linalg.matrix_rank(np.outer([1, 2, 3], [1, 1])))", "acc": ["1"], "ex": "A tensor product of two vectors always has rank 1.", "hint": null}, {"t": "mc", "q": "What does `np.linalg.cond(A)` measure?", "code": null, "opts": ["the determinant", "σ_max/σ_min – how strongly relative errors in b can be amplified in the solution of Ax = b", "the number of zeros", "the runtime"], "a": 1, "ex": "Rule of thumb: you lose about log₁₀(cond) digits of accuracy.", "hint": null}, {"t": "bug", "q": "The best rank-1 approximation should be formed, but a ValueError appears. Which line?", "lines": ["U, s, Vh = np.linalg.svd(A)", "k = 1", "A1 = U[:, :k] @ s[:k] @ Vh[:k, :]", "err = np.linalg.norm(A - A1, 2)"], "bug": 2, "fix": "A1 = U[:, :k] * s[:k] @ Vh[:k, :]", "check": "assert np.isclose(err, np.linalg.svd(A)[1][1])", "ex": "s is a 1D array. `U[:, :k] @ s[:k]` turns it into a vector. You scale the columns of U with `*` (broadcasting) – or use `np.diag(s[:k])`.", "hint": null, "pre": "A = np.array([[3., 1.], [1., 3.], [1., 1.]])"}], "kind": "quiz"}, {"id": "la-c3", "title": "Factor once, solve often", "text": "Write `loese_alle(A, rhs)`: rhs is a **list** of right-hand sides b₁, b₂, … Compute the LU decomposition **once** with\n`scipy.linalg.lu_factor` and then solve each system with `lu_solve`. Return the solutions as a list. Afterwards check with `scipy.linalg.lu` that A = P·L·U.", "template": "import numpy as np\nfrom scipy.linalg import lu, lu_factor, lu_solve\n\ndef loese_alle(A, rhs):\n    # TODO: lu_factor once, then lu_solve for every b\n    pass\n\nA = np.array([[4., 3., 0.], [3., 4., -1.], [0., -1., 4.]])\nrhs = [np.array([24., 30., -24.]), np.array([1., 0., 0.])]\nprint(loese_alle(A, rhs))\nP, L, U = lu(A)\nprint(np.allclose(A, P @ L @ U))\n", "solution": "", "tests": [{"name": "correct solutions", "code": "rng = np.random.default_rng(5); A = rng.random((6, 6)) + 6*np.eye(6); bs = [rng.random(6) for _ in range(4)]; xs = loese_alle(A, bs); assert xs is not None and len(xs) == 4 and all(np.allclose(A @ x, b) for x, b in zip(xs, bs)), 'solutions wrong'"}, {"name": "example", "code": "xs = loese_alle(np.array([[4., 3., 0.], [3., 4., -1.], [0., -1., 4.]]), [np.array([24., 30., -24.])]); assert np.allclose(xs[0], [3, 4, -5]), f'{xs[0]}'"}, {"name": "lu_factor only once", "code": "body = _SRC.split('def loese_alle')[1].split('A = np.array')[0]; assert body.count('lu_factor(') == 1 and 'lu_solve' in body and 'for' in body.split('lu_factor(')[1] and 'lu_factor' not in body.split('for')[1], 'call lu_factor exactly once, before the loop'"}], "hints": ["`lu_piv = lu_factor(A)` before the loop.", "`return [lu_solve(lu_piv, b) for b in rhs]`"], "ref": "Script Kap. 7 (LU), scipy.linalg", "boss": false, "kind": "code"}, {"id": "la4", "title": "scipy.linalg", "cards": [{"title": "More decompositions", "text": "`scipy.linalg` has the same basic functions as `numpy.linalg`, plus:\n`P, L, U = lu(A)` with A = P @ L @ U (row pivoting).\n`lu, piv = lu_factor(A)` once (O(n³)), then `lu_solve((lu, piv), b)` as often as you like (O(n²) each).\n`cholesky(A)` for symmetric positive definite A – returns the **upper** matrix R with A = RᵀR **by default** (NumPy returns the lower L!).\n`solve_triangular(R, b, lower=False)` – back substitution in O(n²).\n`solve_banded((l, u), ab, b)` – banded matrices in O(n). `qr(A, mode='economic')`, `svdvals(A)`.", "code": "from scipy.linalg import lu_factor, lu_solve, cholesky, solve_triangular\nlu_piv = lu_factor(A)\nx1 = lu_solve(lu_piv, b1)\nx2 = lu_solve(lu_piv, b2)     # no new O(n^3)!\nR = cholesky(S)               # S = R.T @ R"}], "qs": [{"t": "mc", "q": "`np.linalg.cholesky(A)` returns L (lower triangular matrix). What does `scipy.linalg.cholesky(A)` return by default?", "code": null, "opts": ["also L", "R (upper triangular matrix) with A = RᵀR", "L and U", "the eigenvalues"], "a": 1, "ex": "With `lower=True` you get the lower one in SciPy too. A classic trap!", "hint": null}, {"t": "mc", "q": "What does `P, L, U = scipy.linalg.lu(A)` return?", "code": null, "opts": ["A = L @ U without pivoting", "A = P @ L @ U with a permutation matrix P", "P = pivot indices as a vector", "A = U @ L"], "a": 1, "ex": "lu_factor, on the other hand, stores L and U compactly in one matrix plus a pivot vector.", "hint": null}, {"t": "mc", "q": "Why `lu_factor` + `lu_solve` instead of `solve` every time?", "code": null, "opts": ["Because solve calculates wrongly", "With many right-hand sides: the decomposition costs O(n³) once, every further solve only O(n²)", "Because it needs less memory", "No difference"], "a": 1, "ex": "Typical for Newton's method or time steps with the same matrix.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.linalg import solve_triangular\nR = np.array([[2., 1.], [0., 4.]])\nprint(solve_triangular(R, np.array([4., 8.])))", "opts": ["[1. 2.]", "[2. 2.]", "[2. 1.]", "[4. 2.]"], "a": 0, "ex": "Backwards: 4x₂ = 8 → x₂ = 2, then 2x₁ + 2 = 4 → x₁ = 1.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.linalg import cholesky\nprint(cholesky(np.array([[4., 2.], [2., 5.]])))", "opts": ["[[2. 1.]\n [0. 2.]]", "[[2. 0.]\n [1. 2.]]", "[[4. 2.]\n [2. 5.]]", "[[2. 1.]\n [1. 2.]]"], "a": 0, "ex": "Upper triangular matrix R: r₁₁ = √4 = 2, r₁₂ = 2/2 = 1, r₂₂ = √(5 − 1) = 2. Check: RᵀR = A.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.linalg import lu\nP, L, U = lu(np.array([[1., 2.], [3., 4.]]))\nprint(L)", "opts": ["[[1.         0.        ]\n [0.33333333 1.        ]]", "[[1. 0.]\n [3. 1.]]", "[[3. 4.]\n [0. 1.]]", "[[1. 0.]\n [0. 1.]]"], "a": 0, "ex": "With pivoting the row [3, 4] (largest modulus in column 1) moves to the top, hence l₂₁ = 1/3.", "hint": null}, {"t": "mc", "q": "What is `scipy.linalg.solve_banded` good for?", "code": null, "opts": ["for random matrices", "for banded matrices, e.g. tridiagonal systems as with splines – cost O(n) instead of O(n³)", "for triangular matrices", "for eigenvalues"], "a": 1, "ex": "The matrix is passed compactly as an (l+u+1) × n array.", "hint": null}, {"t": "fill", "q": "Complete the solve with the stored LU decomposition.", "code": "x = lu_solve(____, b)", "acc": ["lu_piv"], "check": "assert np.allclose(A @ x, b)", "ex": "lu_solve gets the result of lu_factor (the tuple) as its first argument.", "hint": null, "pre": "from scipy.linalg import lu_factor, lu_solve\nA = np.array([[4., 1.], [2., 3.]])\nb = np.array([1., 2.])\nlu_piv = lu_factor(A)"}, {"t": "mc", "q": "Which call solves Rx = b for an upper triangular matrix R in O(n²)?", "code": null, "opts": ["np.linalg.inv(R) @ b", "scipy.linalg.solve_triangular(R, b)", "np.linalg.solve(R, b)", "np.linalg.lstsq(R, b)"], "a": 1, "ex": "solve and inv don't know that R is triangular and compute in O(n³).", "hint": null}], "kind": "quiz"}, {"id": "la-c4", "title": "Line fit: lstsq and QR", "text": "Fit the line y ≈ c₀ + c₁·x to the measured data (least squares), in two ways:\n`c_lstsq` with `np.linalg.lstsq`, and `c_qr` via the QR decomposition: A = QR, then R·c = Qᵀy with `scipy.linalg.solve_triangular`. A is the matrix with the columns [1, x].", "template": "import numpy as np\nfrom scipy.linalg import solve_triangular\n\nx = np.array([0., 1., 2., 3., 4., 5.])\ny = np.array([1.1, 2.9, 5.2, 7.1, 8.8, 11.2])\nA = None        # TODO: columns [1, x]\nc_lstsq = None  # TODO\nc_qr = None     # TODO\nprint(c_lstsq, c_qr)\n", "solution": "", "tests": [{"name": "A has shape (6, 2)", "code": "assert A is not None and A.shape == (6, 2) and np.allclose(A[:, 0], 1), 'A should have the columns [1, x]'"}, {"name": "lstsq correct", "code": "ref = np.polyfit(x, y, 1)[::-1]; assert c_lstsq is not None and np.allclose(c_lstsq, ref), f'c_lstsq = {c_lstsq}, expected {ref}'"}, {"name": "QR correct", "code": "ref = np.polyfit(x, y, 1)[::-1]; assert c_qr is not None and np.allclose(c_qr, ref), f'c_qr = {c_qr}'"}, {"name": "QR route used", "code": "assert 'qr(' in _SRC and 'solve_triangular(' in _SRC.split('import')[-1], 'use np.linalg.qr and solve_triangular'"}], "hints": ["`A = np.column_stack([np.ones_like(x), x])`.", "`np.linalg.lstsq(A, y, rcond=None)[0]`.", "`Q, R = np.linalg.qr(A)`, then `solve_triangular(R, Q.T @ y)`."], "ref": "Script 8.1", "boss": false, "kind": "code"}, {"id": "la-c5", "title": "Best approximation with the SVD", "text": "Write `best_rang_k(A, k)` that computes the best rank-k approximation of A (in the 2-norm) with `np.linalg.svd`. Theorem (Eckart-Young): ‖A − Aₖ‖₂ = σₖ₊₁. Test it on the example.", "template": "import numpy as np\n\ndef best_rang_k(A, k):\n    U, s, Vh = np.linalg.svd(A, full_matrices=False)\n    # TODO\n    pass\n\nA = np.random.default_rng(0).random((8, 5))\nA2 = best_rang_k(A, 2)\ns = np.linalg.svd(A, compute_uv=False)\nprint(np.linalg.norm(A - A2, 2), s[2])\n", "solution": "", "tests": [{"name": "shape", "code": "A = np.random.default_rng(1).random((7, 4)); assert best_rang_k(A, 2).shape == (7, 4), 'wrong shape'"}, {"name": "rank k", "code": "A = np.random.default_rng(1).random((7, 4)); assert np.linalg.matrix_rank(best_rang_k(A, 2)) == 2, 'rank is not k'"}, {"name": "Eckart-Young", "code": "A = np.random.default_rng(2).random((9, 6)); s = np.linalg.svd(A, compute_uv=False)\nfor k in [1, 3, 5]:\n    assert np.isclose(np.linalg.norm(A - best_rang_k(A, k), 2), s[k]), f'k = {k}: error ≠ σ_(k+1)'"}, {"name": "k = all", "code": "A = np.random.default_rng(3).random((5, 3)); assert np.allclose(best_rang_k(A, 3), A), 'with full rank the result must be A'"}], "hints": ["s is a 1D array. Scale the columns of U: `U[:, :k] * s[:k]`.", "`return U[:, :k] * s[:k] @ Vh[:k, :]`"], "ref": "Script 7 (SVD)", "boss": false, "kind": "code"}, {"id": "la-c6", "title": "Cholesky & triangular systems", "text": "A is symmetric positive definite. Solve Ax = b with `scipy.linalg.cholesky` (returns R with A = RᵀR) and two triangular systems: Rᵀz = b (forward) and Rx = z (backward), each with `solve_triangular`. Write `chol_solve(A, b)`.", "template": "import numpy as np\nfrom scipy.linalg import cholesky, solve_triangular\n\ndef chol_solve(A, b):\n    R = cholesky(A)\n    # TODO: two triangular systems\n    pass\n\nA = np.array([[4., 2., 0.], [2., 5., 1.], [0., 1., 3.]])\nb = np.array([2., 1., 4.])\nprint(chol_solve(A, b), np.linalg.solve(A, b))\n", "solution": "", "tests": [{"name": "example", "code": "A = np.array([[4., 2., 0.], [2., 5., 1.], [0., 1., 3.]]); b = np.array([2., 1., 4.]); x = chol_solve(A, b); assert x is not None and np.allclose(A @ x, b), f'x = {x}'"}, {"name": "large SPD matrix", "code": "M = np.random.default_rng(1).random((30, 30)); A = M @ M.T + 30*np.eye(30); b = np.ones(30); assert np.allclose(A @ chol_solve(A, b), b), 'wrong'"}, {"name": "solve_triangular twice", "code": "body = _SRC.split('def chol_solve')[1].split('A = np.array')[0]; assert body.count('solve_triangular(') == 2 and 'np.linalg.solve' not in body and 'inv(' not in body, 'solve exactly two triangular systems, without solve/inv'"}], "hints": ["SciPy's cholesky returns the **upper** R. Rᵀ is lower: `solve_triangular(R.T, b, lower=True)`.", "Then backwards: `solve_triangular(R, z)`."], "ref": "Script Kap. 7 (Cholesky)", "boss": false, "kind": "code"}, {"id": "la-boss", "title": "Boss: Hilbert Hydra", "text": "The Hilbert matrix Hᵢⱼ = 1/(i + j + 1) (i, j = 0…n−1) is extremely badly conditioned. For n = 2, 3, …, 13: build H **with broadcasting**, compute `conds[i] = np.linalg.cond(H)`, solve H x = H·1 with `np.linalg.solve` and store the relative error `errs[i] = ‖x − 1‖ / ‖1‖`. Plot both against n in a `semilogy` plot as `./cx_out/hilbert.png`. Observe: error ≈ cond · eps.", "template": "import numpy as np\nimport matplotlib.pyplot as plt\n\nns = np.arange(2, 14)\nconds = np.zeros(len(ns))\nerrs = np.zeros(len(ns))\n\ndef hilbert(n):\n    # TODO: broadcasting, no loop\n    pass\n\n# TODO: loop over ns, plot\nprint(conds); print(errs)\n", "solution": "", "tests": [{"name": "hilbert(3) correct", "code": "H = hilbert(3); assert H is not None and np.allclose(H, [[1, 1/2, 1/3], [1/2, 1/3, 1/4], [1/3, 1/4, 1/5]]), 'hilbert(3) wrong'"}, {"name": "without a loop", "code": "body = _SRC.split('def hilbert')[1].split('# TODO: loop')[0].split('for k')[0]; assert 'for ' not in body, 'hilbert(n) without a loop (broadcasting)'"}, {"name": "condition numbers", "code": "assert conds[0] > 10 and conds[-1] > 1e16, f'conds = {conds}'"}, {"name": "error grows", "code": "assert errs[0] < 1e-13 and errs[-1] > 1e-5, f'errs = {errs}'"}, {"name": "error ≲ cond·eps", "code": "assert np.all(errs[:-2] < 100*conds[:-2]*np.finfo(float).eps), 'error larger than cond·eps?'"}, {"name": "figure", "code": "import os; assert os.path.exists('cx_out/hilbert.png') and 'semilogy' in _SRC, 'semilogy figure cx_out/hilbert.png missing'"}], "hints": ["`i = np.arange(n)`, then `1. / (i[:, None] + i[None, :] + 1)`.", "In the loop: `x = np.linalg.solve(H, H @ np.ones(n))`, error `np.linalg.norm(x - 1) / np.linalg.norm(np.ones(n))`.", "Rule of thumb: you lose log₁₀(cond) digits – at n = 13 cond ≈ 10¹⁸, so nothing is accurate any more."], "ref": "Kondition (Kap. 7)", "boss": true, "kind": "boss"}], "group": "tools"}, {"id": "sc", "title": "SciPy Tools", "chap": "Toolbox · interpolate, fft, integrate, optimize", "blurb": "Interpolators, DCT, quad, simpson, roots_legendre, brentq, newton, fsolve, curve_fit.", "rooms": [{"id": "sc1", "title": "scipy.interpolate", "cards": [{"title": "Interpolators are objects", "text": "All interpolators are created with the data and then **called like a function**:\n`BarycentricInterpolator(x, y)` – polynomial interpolation, barycentric and stable.\n`CubicSpline(x, y, bc_type='not-a-knot')` – cubic spline; `s(t, 1)` gives the first derivative, `s.derivative()` a new spline.\n`PchipInterpolator(x, y)` – shape-preserving, monotone. `Akima1DInterpolator(x, y, method='makima')`.\n`np.interp(t, x, y)` – piecewise linear (x ascending).", "code": "from scipy.interpolate import BarycentricInterpolator, CubicSpline\np = BarycentricInterpolator(x, y)\ns = CubicSpline(x, y, bc_type='natural')\nt = np.linspace(x[0], x[-1], 500)\np(t), s(t), s(t, 1)   # values and derivative"}], "qs": [{"t": "mc", "q": "What does `CubicSpline(x, y)` return?", "code": null, "opts": ["an array of values", "a callable object: s(t) evaluates the spline", "the coefficients as a list", "nothing, it plots"], "a": 1, "ex": "So: first `s = CubicSpline(x, y)`, then `s(t)`.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.interpolate import BarycentricInterpolator\np = BarycentricInterpolator([0., 1., 2.], [1., 3., 7.])\nprint(round(float(p(0.5)), 6))", "opts": ["1.75", "2.0", "3.0", "[1.75 3.   7.  ]"], "a": 0, "ex": "The interpolation polynomial is x² + x + 1, at 0.5: 0.25 + 0.5 + 1. (round, because otherwise 1.7500000000000002 – rounding error of the formula.)", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.interpolate import CubicSpline\ns = CubicSpline([0., 1., 2., 3.], [0., 1., 8., 27.])\nprint(round(float(s(1.5)), 6))", "opts": ["3.375", "4.5", "3.0", "4.0"], "a": 0, "ex": "With 4 points and not-a-knot the spline is exactly the cubic interpolation polynomial, here x³: 1.5³ = 3.375.", "hint": null}, {"t": "out", "q": "And the derivative?", "code": "from scipy.interpolate import CubicSpline\ns = CubicSpline([0., 1., 2., 3.], [0., 1., 8., 27.])\nprint(round(float(s(2.0, 1)), 6))", "opts": ["12.0", "8.0", "6.0", "4.0"], "a": 0, "ex": "The second argument is the order of the derivative: (x³)' = 3x² = 12 at x = 2.", "hint": null}, {"t": "mc", "q": "What property does `PchipInterpolator` have?", "code": null, "opts": ["C²-smooth", "shape-preserving: monotone data → monotone interpolant", "always exact for polynomials", "periodic"], "a": 1, "ex": "In exchange it is only C¹ and converges more slowly.", "hint": null}, {"t": "mc", "q": "What does `np.interp(t, x, y)` compute?", "code": null, "opts": ["a cubic spline", "piecewise linear interpolation (x must be ascending)", "the interpolation polynomial", "an FFT"], "a": 1, "ex": "Outside [x₀, xₙ] the boundary value is continued as a constant.", "hint": null}, {"t": "mc", "q": "Which boundary condition requires y[0] == y[-1]?", "code": null, "opts": ["'natural'", "'not-a-knot'", "'periodic'", "'clamped'"], "a": 2, "ex": "Otherwise CubicSpline raises a ValueError.", "hint": null}, {"t": "fill", "q": "Complete it for a natural spline.", "code": "s = CubicSpline(x, y, bc_type='____')", "acc": ["natural"], "check": "assert abs(s(x[0], 2)) < 1e-12 and abs(s(x[-1], 2)) < 1e-12", "ex": "Natural = second derivative equal to 0 at the boundary.", "hint": null, "pre": "from scipy.interpolate import CubicSpline\nx = np.linspace(0, 3, 7)\ny = np.sin(x)"}], "kind": "quiz"}, {"id": "sc-c1", "title": "BarycentricInterpolator vs. Runge", "text": "Interpolate f(x) = 1/(1 + 25x²) with `scipy.interpolate.BarycentricInterpolator` at n+1 **Chebyshev abscissas** cos(kπ/n) for n = 10, 20, 40, 80 and store the maximum errors (on 2001 points) in `err_ch`. For comparison: `err_eq20` for 21 equispaced points.", "template": "import numpy as np\nfrom scipy.interpolate import BarycentricInterpolator\n\nf = lambda x: 1 / (1 + 25*x**2)\nt = np.linspace(-1, 1, 2001)\nns = [10, 20, 40, 80]\nerr_ch = np.zeros(len(ns))\nerr_eq20 = None\n# TODO\nprint(err_ch, err_eq20)\n", "solution": "", "tests": [{"name": "Chebyshev converges", "code": "assert err_ch[-1] < 1e-6 and np.all(np.diff(err_ch) < 0), f'err_ch = {err_ch}'"}, {"name": "equispaced is bad", "code": "assert err_eq20 is not None and err_eq20 > 10, f'err_eq20 = {err_eq20}'"}, {"name": "BarycentricInterpolator used", "code": "assert 'BarycentricInterpolator(' in _SRC.split('import')[-1], 'use BarycentricInterpolator'"}], "hints": ["`x = np.cos(np.arange(n + 1) * np.pi / n)`, `p = BarycentricInterpolator(x, f(x))`, then `p(t)`.", "Error: `np.max(np.abs(p(t) - f(t)))`."], "ref": "Script 2.4, scipy.interpolate", "boss": false, "kind": "code"}, {"id": "sc2", "title": "numpy.fft & scipy.fft", "cards": [{"title": "FFT tools", "text": "`np.fft.fft / ifft` – full DFT. `np.fft.fftfreq(n, d)` – frequencies k/(n·d) in FFT order. `fftshift` – frequency 0 to the middle.\n`np.fft.rfft(y)` – for **real** y only the frequencies 0 … n/2 (length n//2 + 1), because c₋ₖ = conj(cₖ). Back with `irfft(c, n)`.\n`scipy.fft` has the same functions (often faster) plus `dct`/`idct` and `dst`.", "code": null}, {"title": "DCT for Chebyshev", "text": "Values at the Chebyshev **nodes** xⱼ = cos((j + ½)π/N): `c = dct(y, type=2) / N`, then `c[0] /= 2`.\nValues at the Chebyshev **abscissas** xⱼ = cos(jπ/n): `c = dct(y, type=1) / n`, then `c[0] /= 2` and `c[-1] /= 2`.\nThat's how you get the Chebyshev coefficients in O(n log n) (script 3.6).", "code": "from scipy.fft import dct\nN = 16\nx = np.cos((np.arange(N) + 0.5) * np.pi / N)\nc = dct(f(x), type=2) / N\nc[0] /= 2"}], "qs": [{"t": "typ", "q": "Type the shape.", "code": "print(np.fft.rfft(np.ones(8)).shape)", "acc": ["(5,)"], "ex": "rfft gives n//2 + 1 = 5 coefficients (frequencies 0 to 4).", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "print(np.fft.fftfreq(8, d=0.5))", "opts": ["[ 0.    0.25  0.5   0.75 -1.   -0.75 -0.5  -0.25]", "[ 0.  1.  2.  3. -4. -3. -2. -1.]", "[0.   0.25 0.5  0.75 1.   1.25 1.5  1.75]", "[-1.   -0.75 -0.5  -0.25  0.    0.25  0.5   0.75]"], "a": 0, "ex": "fftfreq(n, d) = k/(n·d). With d = 0.5 (sample spacing) and n = 8: step 0.25, negative frequencies at the back.", "hint": null}, {"t": "mc", "q": "Why is `rfft` enough for real data?", "code": null, "opts": ["because real data have no frequencies", "because c₋ₖ = conj(cₖ) – the negative frequencies carry no new information", "because rfft is more accurate", "that's not true"], "a": 1, "ex": "That saves half the work and memory.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.fft import fft\nprint(np.allclose(fft(np.arange(4.)), np.fft.fft(np.arange(4.))))", "opts": ["True", "False"], "a": 0, "ex": "scipy.fft.fft and np.fft.fft compute the same DFT (same normalization).", "hint": null}, {"t": "mc", "q": "Which DCT type belongs to the Chebyshev nodes cos((j + ½)π/N)?", "code": null, "opts": ["Type 1", "Type 2", "Type 3", "Type 4"], "a": 1, "ex": "Nodes → DCT-II, abscissas → DCT-I (script 3.6.2).", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.fft import dct\nprint(np.round(dct(np.array([1., 1., 1.]), type=2), 6))", "opts": ["[6. 0. 0.]", "[3. 0. 0.]", "[1. 1. 1.]", "[2. 0. 0.]"], "a": 0, "ex": "SciPy's DCT-II without normalization has the factor 2: y₀ = 2·Σxₙ = 6. That's why for Chebyshev you divide by N and halve c₀.", "hint": null}, {"t": "typ", "q": "Type the output.", "code": "y = np.array([1., 2., 3., 4.])\nprint(np.round(np.fft.irfft(np.fft.rfft(y)), 6))", "acc": ["[1. 2. 3. 4.]"], "ex": "irfft undoes rfft (the length n is inferred from the input; for odd n you have to pass it).", "hint": null}, {"t": "fill", "q": "Complete it so that k contains the frequencies in FFT order: 0, 1, …, −1.", "code": "k = np.fft.____(n, 1/n)", "acc": ["fftfreq"], "check": "assert list(k) == [0, 1, 2, 3, -4, -3, -2, -1]", "ex": "The function for the frequencies is called fft…freq.", "hint": null, "pre": "n = 8"}], "kind": "quiz"}, {"id": "sc-c2", "title": "Chebyshev coefficients with the DCT", "text": "Write `cheb_koeff(f, N)`: evaluate f at the N Chebyshev **nodes** xⱼ = cos((j + ½)π/N) and compute the coefficients c₀, …, c_{N−1} of the Chebyshev interpolant with `scipy.fft.dct(y, type=2)`: c = dct/N, then halve c₀. Evaluate the result with `np.polynomial.chebyshev.chebval`.", "template": "import numpy as np\nfrom scipy.fft import dct\n\ndef cheb_koeff(f, N):\n    j = np.arange(N)\n    x = np.cos((j + 0.5) * np.pi / N)\n    # TODO\n    pass\n\nc = cheb_koeff(np.exp, 12)\nt = np.linspace(-1, 1, 7)\nprint(np.max(np.abs(np.polynomial.chebyshev.chebval(t, c) - np.exp(t))))\n", "solution": "", "tests": [{"name": "T₃ exact", "code": "c = cheb_koeff(lambda x: 4*x**3 - 3*x, 6); assert c is not None and np.allclose(c, [0, 0, 0, 1, 0, 0]), f'c = {np.round(c, 6)}'"}, {"name": "like chebinterpolate", "code": "c = cheb_koeff(np.cos, 10); assert np.allclose(c, np.polynomial.chebyshev.chebinterpolate(np.cos, 9)), 'does not match chebinterpolate'"}, {"name": "exp accurate", "code": "c = cheb_koeff(np.exp, 16); t = np.linspace(-1, 1, 101); assert np.max(np.abs(np.polynomial.chebyshev.chebval(t, c) - np.exp(t))) < 1e-14, 'too inaccurate'"}, {"name": "dct used", "code": "assert 'dct(' in _SRC.split('def cheb_koeff')[1], 'use scipy.fft.dct'"}], "hints": ["`c = dct(f(x), type=2) / N`", "Then `c[0] /= 2` and `return c`."], "ref": "Script 3.6, scipy.fft", "boss": false, "kind": "code"}, {"id": "sc3", "title": "scipy.integrate & roots_legendre", "cards": [{"title": "Integrating with SciPy", "text": "`I, err = integrate.quad(f, a, b)` – adaptive Gauss-Kronrod quadrature, returns **a tuple** (value, error estimate). a, b = ±np.inf work too.\nUseful options: `points=[...]` (kinks/peaks), `limit=`, `epsabs=`, `args=(…)`.\nOnly samples? `integrate.trapezoid(y, x=x)` and `integrate.simpson(y, x=x)` (the old names trapz/simps no longer exist).\n`integrate.fixed_quad(f, a, b, n=5)` – Gauss-Legendre with n points. `dblquad` for 2D.", "code": null}, {"title": "roots_legendre", "text": "`x, w = scipy.special.roots_legendre(n)` – Gauss-Legendre nodes and weights on [−1, 1] (like `np.polynomial.legendre.leggauss`).\nExact for polynomials up to degree 2n − 1. Transform to [a, b]:", "code": "from scipy.special import roots_legendre\nx, w = roots_legendre(n)\nI = (b - a)/2 * np.sum(w * f((a + b)/2 + (b - a)/2 * x))"}], "qs": [{"t": "mc", "q": "What does `integrate.quad(f, a, b)` return?", "code": null, "opts": ["only the value", "a tuple (value, estimate of the absolute error)", "an array", "the antiderivative"], "a": 1, "ex": "Hence `I, err = quad(...)` or `quad(...)[0]`.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy import integrate\nI, err = integrate.quad(lambda x: x**2, 0, 3)\nprint(round(I, 10))", "opts": ["9.0", "27.0", "(9.0, 1e-13)", "3.0"], "a": 0, "ex": "∫₀³ x² dx = 27/3 = 9.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.special import roots_legendre\nx, w = roots_legendre(2)\nprint(np.round(x, 6), w)", "opts": ["[-0.57735  0.57735] [1. 1.]", "[-1.  1.] [1. 1.]", "[0.] [2.]", "[-0.774597  0.        0.774597] [0.555556 0.888889 0.555556]"], "a": 0, "ex": "Two Gauss points ±1/√3 with weights 1. Exact up to degree 3.", "hint": null}, {"t": "mc", "q": "roots_legendre(n): up to which polynomial degree is the rule exact?", "code": null, "opts": ["n − 1", "n", "2n − 1", "2n"], "a": 2, "ex": "Order 2n, so exact for degree ≤ 2n − 1.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.integrate import simpson\nx = np.linspace(0, 2, 5)\nprint(round(simpson(x**3, x=x), 10))", "opts": ["4.0", "4.25", "2.0", "8.0"], "a": 0, "ex": "Simpson is exact for polynomials up to degree 3: ∫₀² x³ dx = 4.", "hint": null}, {"t": "mc", "q": "When do you use `simpson(y, x=x)` instead of `quad`?", "code": null, "opts": ["Never", "when you only have measured/sampled values, no function", "when the function is smooth", "for infinite intervals"], "a": 1, "ex": "quad needs a function that it can evaluate at points of its own choosing.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy import integrate\nI = integrate.quad(lambda x: np.exp(-x**2), -np.inf, np.inf)[0]\nprint(round(I**2, 8))", "opts": ["3.14159265", "1.77245385", "1.0", "2.71828183"], "a": 0, "ex": "The Gaussian integral is √π, so squared it's π. quad can handle infinite limits.", "hint": null}, {"t": "fill", "q": "Complete the transformation of the Gauss nodes from [−1, 1] to [a, b].", "code": "I = (b - a)/2 * np.sum(w * f(____))", "acc": ["(a+b)/2+(b-a)/2*x", "(b-a)/2*x+(a+b)/2", "a+(b-a)*(x+1)/2", "(a+b)/2+x*(b-a)/2", "0.5*(a+b)+0.5*(b-a)*x"], "check": "assert abs(I - (np.e**2 - np.e)) < 1e-10", "ex": "Midpoint (a+b)/2 plus half the length times x.", "hint": null, "pre": "from scipy.special import roots_legendre\nx, w = roots_legendre(8)\nf = np.exp\na, b = 1., 2."}, {"t": "mc", "q": "What does `integrate.fixed_quad(f, a, b, n=5)` do?", "code": null, "opts": ["adaptive to 5 digits", "Gauss-Legendre with exactly 5 points on [a, b]", "5 trapezoidal steps", "Monte Carlo with 5 points"], "a": 1, "ex": "It returns (value, None) – without an error estimate.", "hint": null}], "kind": "quiz"}, {"id": "sc-c3", "title": "Gauss with roots_legendre", "text": "Write `gauss(f, a, b, n)` with `scipy.special.roots_legendre(n)` (transform the nodes to [a, b]). Compare with `scipy.integrate.fixed_quad`, which does the same thing.", "template": "import numpy as np\nfrom scipy.special import roots_legendre\nfrom scipy.integrate import fixed_quad\n\ndef gauss(f, a, b, n):\n    x, w = roots_legendre(n)\n    # TODO\n    pass\n\nprint(gauss(np.exp, 0, 1, 5), fixed_quad(np.exp, 0, 1, n=5)[0], np.e - 1)\n", "solution": "", "tests": [{"name": "like fixed_quad", "code": "assert np.isclose(gauss(np.sin, 0, 2, 6), fixed_quad(np.sin, 0, 2, n=6)[0], rtol=1e-14), 'does not match fixed_quad'"}, {"name": "exact up to degree 2n−1", "code": "p = lambda x: x**7 - 2*x**3; ex = (3**8 - 1)/8 - 2*(3**4 - 1)/4; assert np.isclose(gauss(p, 1, 3, 4), ex), 'degree 7 with n = 4 must be exact'"}, {"name": "not exact for degree 2n", "code": "ex = (3**9 - 1)/9; assert not np.isclose(gauss(lambda x: x**8, 1, 3, 4), ex, rtol=1e-12), 'degree 8 with n = 4 should not be exact'"}], "hints": ["Transformation: `(a + b)/2 + (b - a)/2 * x`, weights times `(b - a)/2`.", "`return (b - a)/2 * np.sum(w * f((a + b)/2 + (b - a)/2 * x))`"], "ref": "Script 5.5", "boss": false, "kind": "code"}, {"id": "sc4", "title": "scipy.optimize", "cards": [{"title": "Roots", "text": "**1D:** `brentq(f, a, b)` – needs a sign change f(a)·f(b) < 0, then very robust (bisection + interpolation).\n`bisect(f, a, b)`, `newton(f, x0, fprime=df)` – Newton; **without fprime** newton does the secant method.\n**Systems:** `fsolve(F, x0)` returns the array x; `root(F, x0, jac=J)` returns an object with `.x`, `.success`.", "code": null}, {"title": "Minimizing & fitting", "text": "`res = minimize(f, x0, method='BFGS')` → `res.x`, `res.fun`, `res.success`.\n`popt, pcov = curve_fit(model, xdata, ydata, p0=...)` – nonlinear fitting; model(x, *params).\n`res = least_squares(residuals, x0)` → `res.x` (Gauss-Newton/Levenberg-Marquardt style).", "code": "from scipy.optimize import brentq, newton, fsolve, minimize, curve_fit\nr = brentq(lambda x: np.cos(x) - x, 0, 1)\nmodel = lambda t, A, lam: A*np.exp(-lam*t)\npopt, pcov = curve_fit(model, t, y, p0=[1., 1.])"}], "qs": [{"t": "mc", "q": "What does `brentq(f, a, b)` need?", "code": null, "opts": ["a derivative", "a sign change: f(a) and f(b) have different signs", "a start value", "nothing"], "a": 1, "ex": "Then by the intermediate value theorem there is a root in [a, b].", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.optimize import brentq\nprint(round(brentq(lambda x: x**2 - 2, 0, 2), 10))", "opts": ["1.4142135624", "2.0", "1.0", "-1.4142135624"], "a": 0, "ex": "The positive root √2 lies in [0, 2].", "hint": null}, {"t": "mc", "q": "What does `newton(f, x0)` do without `fprime`?", "code": null, "opts": ["Error", "the secant method", "Bisection", "Newton with a numerical derivative via the complex step"], "a": 1, "ex": "With `fprime=df` it's the real Newton method (quadratic convergence).", "hint": null}, {"t": "mc", "q": "What do `root` and `minimize` return?", "code": null, "opts": ["an array", "an OptimizeResult object with .x, .success, .fun …", "a tuple (x, f)", "nothing"], "a": 1, "ex": "fsolve, on the other hand, returns the array directly.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.optimize import fsolve\nprint(np.round(fsolve(lambda v: [v[0] + v[1] - 3, v[0] - v[1] - 1], [0, 0]), 6))", "opts": ["[2. 1.]", "[1. 2.]", "[3. 1.]", "[0. 0.]"], "a": 0, "ex": "x + y = 3 and x − y = 1 → x = 2, y = 1.", "hint": null}, {"t": "mc", "q": "What does `curve_fit(model, x, y)` return?", "code": null, "opts": ["only the parameters", "(popt, pcov): optimal parameters and their covariance matrix", "the fitted y", "an OptimizeResult"], "a": 1, "ex": "The square root of the diagonal of pcov estimates the uncertainty of the parameters.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "from scipy.optimize import minimize\nr = minimize(lambda v: (v[0] - 1)**2 + (v[1] + 2)**2, [0., 0.])\nprint(np.round(r.x, 4))", "opts": ["[ 1. -2.]", "[0. 0.]", "[-1.  2.]", "[1. 2.]"], "a": 0, "ex": "The minimum of the sum of two squares is at (1, −2).", "hint": null}, {"t": "mc", "q": "What happens with `brentq(lambda x: x**2 + 1, -1, 1)`?", "code": null, "opts": ["returns 0", "ValueError: f(a) and f(b) must have different signs", "Infinite loop", "returns a complex number"], "a": 1, "ex": "x² + 1 has no real root – and the same sign at both ends.", "hint": null}, {"t": "fill", "q": "Complete it so that x_opt contains the solution.", "code": "res = minimize(f, [0., 0.])\nx_opt = res.____", "acc": ["x"], "check": "assert np.allclose(x_opt, [3, -1], atol=1e-4)", "ex": "The attribute for the solution vector is named like the variable in mathematics.", "hint": null, "pre": "from scipy.optimize import minimize\nf = lambda v: (v[0] - 3)**2 + (v[1] + 1)**2"}], "kind": "quiz"}, {"id": "sc-c4", "title": "quad, trapezoid, simpson", "text": "For f(x) = eˣ·sin(3x) on [0, 2]: compute `I_quad` with `integrate.quad` (the value only), and from the samples at 33 equispaced points `I_trap` with `integrate.trapezoid` and `I_simp` with `integrate.simpson`. Store the errors `e_trap`, `e_simp` with respect to the exact value.", "template": "import numpy as np\nfrom scipy import integrate\n\nf = lambda x: np.exp(x) * np.sin(3*x)\nexakt = (np.exp(2)*(np.sin(6) - 3*np.cos(6)) + 3) / 10\nx = np.linspace(0, 2, 33)\n# TODO\nI_quad = I_trap = I_simp = None\ne_trap = e_simp = None\nprint(I_quad, e_trap, e_simp)\n", "solution": "", "tests": [{"name": "quad accurate (value only!)", "code": "assert isinstance(I_quad, float) and abs(I_quad - exakt) < 1e-12, f'I_quad = {I_quad!r} – quad returns a tuple, take [0]'"}, {"name": "trapezoid", "code": "assert I_trap is not None and abs(I_trap - np.trapezoid(f(x), x)) < 1e-14 if hasattr(np, 'trapezoid') else abs(e_trap - 0.0236) < 0.01, 'I_trap wrong'"}, {"name": "simpson more accurate", "code": "assert e_simp is not None and e_simp < e_trap / 50, f'e_trap = {e_trap}, e_simp = {e_simp}'"}, {"name": "SciPy functions", "code": "assert 'trapezoid(' in _SRC and 'simpson(' in _SRC, 'use integrate.trapezoid and integrate.simpson'"}], "hints": ["`integrate.quad(f, 0, 2)[0]` – don't forget the [0].", "`integrate.trapezoid(f(x), x=x)` and `integrate.simpson(f(x), x=x)`."], "ref": "scipy.integrate", "boss": false, "kind": "code"}, {"id": "sc-c5", "title": "Root-finding toolbox", "text": "f(x) = cos(x) − x has a root in [0, 1]. Find it three times:\n`r_brent` with `brentq`, `r_newton` with `newton` **and** the derivative `fprime`, `r_sekante` with `newton` without a derivative (secant method). Also solve the system x² + y² = 4, y = x with `fsolve` starting at (1, 1) → `sol`.", "template": "import numpy as np\nfrom scipy.optimize import brentq, newton, fsolve\n\nf = lambda x: np.cos(x) - x\ndf = lambda x: -np.sin(x) - 1\n# TODO\nr_brent = r_newton = r_sekante = None\nsol = None\nprint(r_brent, r_newton, r_sekante, sol)\n", "solution": "", "tests": [{"name": "brentq", "code": "assert r_brent is not None and abs(r_brent - 0.7390851332151607) < 1e-10, f'r_brent = {r_brent}'"}, {"name": "newton with fprime", "code": "assert r_newton is not None and abs(r_newton - 0.7390851332151607) < 1e-12 and 'fprime' in _SRC, 'use newton with fprime=df'"}, {"name": "secant", "code": "assert r_sekante is not None and abs(r_sekante - 0.7390851332151607) < 1e-10 and _SRC.count('newton(') >= 2, 'call newton twice (once without fprime)'"}, {"name": "fsolve", "code": "assert sol is not None and np.allclose(sol, [np.sqrt(2), np.sqrt(2)]), f'sol = {sol}'"}], "hints": ["`brentq(f, 0, 1)`, `newton(f, 0.5, fprime=df)`, `newton(f, 0.5)`.", "For fsolve: `F = lambda v: [v[0]**2 + v[1]**2 - 4, v[1] - v[0]]`."], "ref": "Script Kap. 6, scipy.optimize", "boss": false, "kind": "code"}, {"id": "sc-c6", "title": "curve_fit: measuring decay", "text": "Measured data y ≈ A·e^(−λt) with noise. Determine A and λ with `scipy.optimize.curve_fit` (start value p0 = [1, 1]) → `A_fit`, `lam_fit`. Do the same with `least_squares` on the residuals r(p) = model(t, p) − y → `p_ls`.", "template": "import numpy as np\nfrom scipy.optimize import curve_fit, least_squares\n\nrng = np.random.default_rng(7)\nt = np.linspace(0, 4, 40)\ny = 3.0*np.exp(-1.3*t) + 0.02*rng.normal(size=t.size)\nmodel = lambda t, A, lam: A*np.exp(-lam*t)\n# TODO\nA_fit = lam_fit = None\np_ls = None\nprint(A_fit, lam_fit, p_ls)\n", "solution": "", "tests": [{"name": "A ≈ 3", "code": "assert A_fit is not None and abs(A_fit - 3) < 0.05, f'A_fit = {A_fit}'"}, {"name": "λ ≈ 1.3", "code": "assert lam_fit is not None and abs(lam_fit - 1.3) < 0.05, f'lam_fit = {lam_fit}'"}, {"name": "least_squares agrees", "code": "assert p_ls is not None and np.allclose(p_ls, [A_fit, lam_fit], rtol=1e-4), f'p_ls = {p_ls}'"}], "hints": ["`popt, pcov = curve_fit(model, t, y, p0=[1., 1.])`, then `A_fit, lam_fit = popt`.", "`least_squares(lambda p: model(t, *p) - y, [1., 1.]).x`."], "ref": "Script 8.2, scipy.optimize", "boss": false, "kind": "code"}, {"id": "sc-boss", "title": "Boss: Quantile Golem", "text": "Find x > 0 with Φ(x) = ∫₀ˣ φ(t) dt = 0.45, where φ(t) = e^(−t²/2)/√(2π) (i.e. the 95% quantile of the normal distribution).\n`x_brent`: brentq on F(x) = quad(φ, 0, x)[0] − 0.45 in [0, 5].\n`x_newton`: newton on the same F with the derivative F'(x) = φ(x) from x₀ = 1.\n`x_gauss`: like x_brent, but the integral with your own Gauss quadrature (roots_legendre, n = 20) instead of quad.", "template": "import numpy as np\nfrom scipy import integrate\nfrom scipy.optimize import brentq, newton\nfrom scipy.special import roots_legendre\n\nphi = lambda t: np.exp(-t**2/2) / np.sqrt(2*np.pi)\n# TODO\nx_brent = x_newton = x_gauss = None\nprint(x_brent, x_newton, x_gauss)\n", "solution": "", "tests": [{"name": "x_brent", "code": "assert x_brent is not None and abs(x_brent - 1.6448536269514722) < 1e-9, f'x_brent = {x_brent}'"}, {"name": "x_newton", "code": "assert x_newton is not None and abs(x_newton - 1.6448536269514722) < 1e-9, f'x_newton = {x_newton}'"}, {"name": "Newton with derivative", "code": "assert 'fprime' in _SRC, 'call newton with fprime = phi (fundamental theorem: F\\'(x) = φ(x))'"}, {"name": "x_gauss", "code": "assert x_gauss is not None and abs(x_gauss - 1.6448536269514722) < 1e-9, f'x_gauss = {x_gauss}'"}, {"name": "own Gauss quadrature", "code": "assert 'roots_legendre(' in _SRC.split('phi =')[1], 'use roots_legendre for x_gauss'"}], "hints": ["`F = lambda x: integrate.quad(phi, 0, x)[0] - 0.45` – then `brentq(F, 0, 5)`.", "Fundamental theorem of calculus: F'(x) = φ(x). So `newton(F, 1.0, fprime=phi)`.", "Gauss on [0, x]: `x/2 * np.sum(wg * phi(x/2 + x/2*xg))`."], "ref": "quad + brentq + newton + roots_legendre", "boss": true, "kind": "boss"}], "group": "tools"}, {"id": "sy", "title": "Randomness, SymPy & Time", "chap": "Toolbox · default_rng, sympy, timeit", "blurb": "Monte Carlo with default_rng, symbolic differentiation with SymPy, measuring runtimes.", "rooms": [{"id": "sy1", "title": "default_rng & Monte Carlo", "cards": [{"title": "Random numbers with default_rng", "text": "`rng = np.random.default_rng(42)` creates a generator; the same number (seed) gives the same numbers – reproducible.\n`rng.random(n)` uniform on [0, 1), `rng.uniform(a, b, n)`, `rng.normal(mu, sigma, n)`,\n`rng.integers(low, high, n)` – **high is not included**, `rng.choice(list, n)`, `rng.permutation(x)`. A shape instead of n: `rng.random((m, n))`.\nThe old `np.random.seed` / `np.random.rand` is legacy (global state).", "code": null}, {"title": "Monte Carlo integration", "text": "∫ₐᵇ f ≈ (b − a)·mean(f(Xᵢ)) with Xᵢ uniformly distributed on [a, b].\nError ≈ (b − a)·std(f(X))/√N, so **O(N^(−1/2))** – independent of the dimension! To be 10× more accurate you need 100× more points.", "code": "rng = np.random.default_rng(0)\nX = rng.uniform(a, b, N)\nfx = f(X)\nI = (b - a) * fx.mean()\nerr = (b - a) * fx.std(ddof=1) / np.sqrt(N)"}], "qs": [{"t": "mc", "q": "Can `rng.integers(1, 6, size=1000)` produce the number 6?", "code": null, "opts": ["Ja", "No – the upper bound is exclusive; for a die use rng.integers(1, 7)", "Only with luck", "Only with seed 6"], "a": 1, "ex": "Like range: the end is not included.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "a = np.random.default_rng(5).random(3)\nb = np.random.default_rng(5).random(3)\nprint(np.array_equal(a, b))", "opts": ["True", "False"], "a": 0, "ex": "Same seed → same random numbers. That's why seeds are handy for tests and submissions.", "hint": null}, {"t": "mc", "q": "How does the Monte Carlo error fall with the number N of points?", "code": null, "opts": ["O(1/N)", "O(1/√N)", "O(1/N²)", "exponentially"], "a": 1, "ex": "For one more digit of accuracy you need 100× more points.", "hint": null}, {"t": "typ", "q": "Type the output.", "code": "rng = np.random.default_rng(1)\nprint(rng.random((4, 3)).shape)", "acc": ["(4, 3)"], "ex": "Instead of a number you can pass a shape (tuple).", "hint": null}, {"t": "mc", "q": "Why is Monte Carlo interesting for high-dimensional integrals?", "code": null, "opts": ["because it is exact", "because the convergence rate O(N^(−1/2)) doesn't depend on the dimension", "because it is faster than Gauss", "because it needs no function"], "a": 1, "ex": "Tensor grids need nᵈ points – impossible for d = 10.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "x = np.random.default_rng(0).uniform(2, 5, 10**6)\nprint(round(x.mean(), 1))", "opts": ["3.5", "2.5", "5.0", "0.5"], "a": 0, "ex": "The mean of a uniform distribution on [2, 5] is 3.5 – with a million points very accurate.", "hint": null}, {"t": "fill", "q": "Complete the Monte Carlo estimate of ∫₀¹ x² dx.", "code": "I = (b - a) * np.mean(f(____))", "acc": ["X"], "check": "assert abs(I - 1/3) < 0.01", "ex": "The function is evaluated at the random points.", "hint": null, "pre": "rng = np.random.default_rng(3)\na, b = 0., 1.\nf = lambda x: x**2\nX = rng.uniform(a, b, 10**5)"}, {"t": "mc", "q": "Why `default_rng` instead of `np.random.seed` + `np.random.rand`?", "code": null, "opts": ["no difference", "its own generator object without global state, better algorithm (PCG64)", "it's faster to type", "rand doesn't exist"], "a": 1, "ex": "That way different parts of a program don't influence each other.", "hint": null}], "kind": "quiz"}, {"id": "sy-c1", "title": "Monte Carlo π", "text": "Write `mc_pi(N, rng)`: draw N points uniformly in the square [0, 1]² with the generator `rng` and estimate π = 4 · (fraction of points with x² + y² ≤ 1). Use `np.random.default_rng`.", "template": "import numpy as np\n\ndef mc_pi(N, rng):\n    # TODO\n    pass\n\nrng = np.random.default_rng(42)\nfor N in [10**2, 10**4, 10**6]:\n    print(N, mc_pi(N, rng))\n", "solution": "", "tests": [{"name": "accurate for N = 10⁶", "code": "p = mc_pi(10**6, np.random.default_rng(1)); assert p is not None and abs(p - np.pi) < 0.01, f'mc_pi = {p}'"}, {"name": "reproducible", "code": "assert mc_pi(1000, np.random.default_rng(3)) == mc_pi(1000, np.random.default_rng(3)), 'same seed must give the same result – use rng'"}, {"name": "uses rng", "code": "assert mc_pi(1000, np.random.default_rng(3)) != mc_pi(1000, np.random.default_rng(4)), 'different seeds should give different results'"}, {"name": "without a loop", "code": "body = _SRC.split('def mc_pi')[1].split('rng = np.random')[0]; assert 'for ' not in body, 'vectorized, without for'"}], "hints": ["`P = rng.random((N, 2))` gives N points.", "`4 * np.mean(np.sum(P**2, axis=1) <= 1)` – the mean of True/False is the fraction."], "ref": "Script 5.8", "boss": false, "kind": "code"}, {"id": "sy2", "title": "SymPy", "cards": [{"title": "Symbolic computation", "text": "`import sympy as sp`, then `x = sp.symbols('x')` (or `x, y = sp.symbols('x y')`).\nTake functions from **sp**: `sp.sin`, `sp.exp`, `sp.sqrt` – `np.sin(x)` doesn't work with a symbol!\n`sp.diff(f, x)`, `sp.diff(f, x, 2)` – derivatives. `sp.integrate(f, (x, 0, 1))` – definite integral.\n`f.subs(x, 2)`, `.evalf()`, `sp.Rational(1, 3)`, `sp.simplify(f)`, `sp.series(f, x, 0, 4)`.", "code": null}, {"title": "lambdify: from SymPy to NumPy", "text": "Symbolic expressions are slow. `g = sp.lambdify(x, f, 'numpy')` turns one into a fast NumPy function that also takes arrays.\nTypical: determine the derivative symbolically, then lambdify it for Newton, error analysis or plots.\nFor systems: `J = sp.Matrix([f1, f2]).jacobian([x, y])`.", "code": "import sympy as sp\nx = sp.symbols('x')\nf = sp.exp(x) * sp.sin(x)\ndf = sp.diff(f, x)\ndf_num = sp.lambdify(x, df, 'numpy')\ndf_num(np.linspace(0, 1, 5))"}], "qs": [{"t": "out", "q": "What does this code print?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.diff(x**3, x))", "opts": ["3*x**2", "x**2", "3x^2", "x**4/4"], "a": 0, "ex": "Derivative of x³. SymPy writes powers like Python, with **.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.diff(sp.sin(x**2), x))", "opts": ["2*x*cos(x**2)", "cos(x**2)", "2*x*sin(x**2)", "cos(2*x)"], "a": 0, "ex": "Chain rule: cos(x²)·2x.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "import sympy as sp\nx = sp.symbols('x')\nf = sp.lambdify(x, x**2 + 1)\nprint(f(np.array([0., 1., 2.])))", "opts": ["[1. 2. 5.]", "x**2 + 1", "[0. 1. 4.]", "Error"], "a": 0, "ex": "lambdify turns the expression into a function that computes with NumPy arrays.", "hint": null}, {"t": "mc", "q": "Why `sp.sin(x)` and not `np.sin(x)` when x is a SymPy symbol?", "code": null, "opts": ["doesn't matter", "np.sin can only compute with numbers – with a symbol you get a TypeError", "np.sin is less accurate", "sp.sin is faster"], "a": 1, "ex": "Only after lambdify do you compute with NumPy.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.integrate(x**2, (x, 0, 3)))", "opts": ["9", "9.0", "x**3/3", "27"], "a": 0, "ex": "Exactly, as an integer, not as a float.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "import sympy as sp\nprint(sp.Rational(1, 3) + sp.Rational(1, 6))", "opts": ["1/2", "0.5", "0.5000000000000001", "2/6"], "a": 0, "ex": "Fractions stay exact. Ideal for computing quadrature weights exactly, for example.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "import sympy as sp\nx = sp.symbols('x')\nprint((x**2).subs(x, 3))", "opts": ["9", "x**2", "3**2", "6"], "a": 0, "ex": "subs substitutes a value.", "hint": null}, {"t": "typ", "q": "Type the output.", "code": "import sympy as sp\nx = sp.symbols('x')\nprint(sp.diff(x**4, x, 2))", "acc": ["12*x**2"], "ex": "Second derivative of x⁴: 4·3·x².", "hint": null}, {"t": "mc", "q": "What is `sp.lambdify` for?", "code": null, "opts": ["for differentiation", "turns a symbolic expression into a fast (NumPy) function", "for lambda calculus", "for simplifying"], "a": 1, "ex": "Evaluating symbolically is far too slow for many points.", "hint": null}, {"t": "out", "q": "What does this code print?", "code": "import sympy as sp\nx, y = sp.symbols('x y')\nprint(sp.Matrix([x*y, x + y]).jacobian([x, y]))", "opts": ["Matrix([[y, x], [1, 1]])", "Matrix([[x, y], [1, 1]])", "[[y, x], [1, 1]]", "Matrix([[y, 1], [x, 1]])"], "a": 0, "ex": "Row i contains the partial derivatives of fᵢ with respect to x and y. Perfect for Newton's method in several dimensions.", "hint": null}, {"t": "bug", "q": "The code should differentiate f(x) = eˣ·x symbolically, but it crashes. Which line?", "lines": ["import sympy as sp", "x = sp.symbols('x')", "f = np.exp(x) * x", "df = sp.diff(f, x)", "g = sp.lambdify(x, df)"], "bug": 2, "fix": "f = sp.exp(x) * x", "check": "assert abs(g(0.0) - 1.0) < 1e-12", "ex": "np.exp can't compute with a symbol. For symbolic expressions use `sp.exp`.", "hint": null, "pre": null}], "kind": "quiz"}, {"id": "sy-c2", "title": "Monte Carlo with error bars", "text": "Write `mc_integral(f, a, b, N, rng)` that returns `(I, err)`: I = (b − a)·mean(f(X)) and the error estimate err = (b − a)·std(f(X), ddof=1)/√N, with X ~ uniform on [a, b].", "template": "import numpy as np\n\ndef mc_integral(f, a, b, N, rng):\n    # TODO\n    pass\n\nrng = np.random.default_rng(0)\nI, err = mc_integral(lambda x: x**2, 0, 1, 10**5, rng)\nprint(I, '+-', err, ' exact:', 1/3)
