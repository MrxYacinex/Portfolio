\n", "solution": "", "tests": [{"name": "x² on [0, 1]", "code": "I, e = mc_integral(lambda x: x**2, 0, 1, 10**5, np.random.default_rng(2)); assert abs(I - 1/3) < 4*e, f'I = {I}, err = {e}'"}, {"name": "error estimate", "code": "I, e = mc_integral(lambda x: x**2, 0, 1, 10**5, np.random.default_rng(2)); assert 0.0008 < e < 0.0011, f'err = {e}, expected ≈ 0.00094'"}, {"name": "interval [2, 5]", "code": "I, e = mc_integral(lambda x: np.ones_like(x), 2, 5, 1000, np.random.default_rng(2)); assert np.isclose(I, 3) and e < 1e-12, f'I = {I}, err = {e}'"}, {"name": "error ~ 1/√N", "code": "e1 = mc_integral(np.sin, 0, 3, 10**3, np.random.default_rng(5))[1]; e2 = mc_integral(np.sin, 0, 3, 10**5, np.random.default_rng(5))[1]; assert 7 < e1/e2 < 13, f'ratio {e1/e2:.1f}, expected 10'"}], "hints": ["`X = rng.uniform(a, b, N)`, `fx = f(X)`.", "`err = (b - a) * fx.std(ddof=1) / np.sqrt(N)`."], "ref": "Script 5.8", "boss": false, "kind": "code"}, {"id": "sy3", "title": "time & timeit", "cards": [{"title": "Measuring time", "text": "`time.perf_counter()` – precise wall clock (for short measurements). `time.process_time()` – CPU time of the process (as in the script, code 1.3.12).\nAlways **measure several times and take the minimum**: other processes interfere, the minimum is the best estimate.\n`timeit.timeit(stmt, number=100)` gives the **total time** for 100 executions; `timeit.repeat(stmt, repeat=5, number=100)` a list of such times.\nIPython has `%timeit` – that's not normal Python and doesn't work in scripts (CodeExpert).", "code": "import time, timeit\nt0 = time.perf_counter(); f(); dt = time.perf_counter() - t0\nt = min(timeit.repeat(lambda: f(), repeat=5, number=10)) / 10   # seconds per call"}], "qs": [{"t": "mc", "q": "Why do you take the minimum of several measurements?", "code": null, "opts": ["because it looks nicer", "other processes slow down individual runs – the minimum is the least disturbed value", "because the mean is wrong", "Convention"], "a": 1, "ex": "That's wh const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function md(s) {
  return esc(s).split('\n').map(l => l.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')).join('<br>');
}
const mdPara = s => s.split(/\n(?=\S)/).map(p => '<p>' + md(p) + '</p>').join('');
const KW = new Set(['def','return','for','in','if','elif','else','while','import','from','as','lambda','and','or','not','None','True','False','continue','break','pass','with','is','try','except']);
const BI = new Set(['print','len','range','list','enumerate','abs','round','sum','min','max','str','int','float','type','zip','sorted']);
function hl(code) {
  const re = /(#[^\n]*)|([rfbRFB]?"(?:[^"\\\n]|\\.)*"|[rfbRFB]?'(?:[^'\\\n]|\\.)*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?j?\b|\.\d+(?:[eE][-+]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); const t = m[0];
    if (m[1]) out += '<span class="com">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="str">' + esc(t) + '</span>';
    else if (m[3]) out += '<span class="num">' + esc(t) + '</span>';
    else if (KW.has(t)) out += '<span class="kw">' + t + '</span>';
    else if (BI.has(t) || code[re.lastIndex] === '(') out += '<span class="fn">' + t + '</span>';
    else out += esc(t);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function codeBlock(code, tag) {
  const t = tag !== undefined ? tag : (/\bnp\./.test(code) && !/import numpy/.test(code) ? 'np = numpy ✓' : '');
  return '<div class="code">' + (t ? '<span class="tag">' + esc(t) + '</span>' : '') + '<pre>' + hl(code) + '</pre></div>';
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2000); }
const starsHtml = n => { let s = ''; for (let i = 0; i < 3; i++) s += i < n ? '<i>★</i>' : '★'; return s; };
const setWC = w => document.documentElement.style.setProperty('--wc', w ? 'var(' + w.color + ')' : 'var(--sky)');
const roomDone = id => !!(S.rooms[id] && S.rooms[id].done);
function level() { let l = 1, need = 100, x = S.xp; while (x >= need) { x -= need; l++; need = Math.round(need * 1.25); } return { l, x, need }; }
function addXP(n, el) {
  if (!n) return;
  const before = level().l; S.xp += n; touchDay(); if (new Date().getHours() < 4) S.owl = 1; save();

  renderHud(); const after = level().l;
  if (after > before) setTimeout(() => levelUp(after), 650);
  checkBadges();
}

const STARS = {
  cv: null, g: null, list: [], t: 0, timer: null,
  init() {
    if (RM || this.cv) return;
    const cv = document.createElement('canvas'); cv.id = 'stars'; cv.setAttribute('aria-hidden', 'true');
    document.body.prepend(cv); this.cv = cv; this.g = cv.getContext('2d');
    const cols = ['#C2C3C7', '#29ADFF', '#83769C', '#FFF1E8', '#FFCCAA', '#FFEC27'];
    for (let i = 0; i < 90; i++) this.list.push({ x: Math.random(), y: Math.random(), z: 1 + (i % 3), c: cols[i % cols.length], p: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.4 });
    const size = () => { const d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.floor(innerWidth * d); cv.height = Math.floor(innerHeight * d); this.d = d; };
    size(); addEventListener('resize', size);
    const loop = () => { if (!document.hidden) this.draw(); };
    this.timer = setInterval(loop, 1000 / 15);
  },
  draw() {
    const g = this.g, W = this.cv.width, H = this.cv.height, d = this.d;
    this.t += 1 / 15; g.clearRect(0, 0, W, H);
    for (const s of this.list) {
      s.y += 0.00018 * s.z; s.x -= 0.00006 * s.z; if (s.y > 1) s.y -= 1; if (s.x < 0) s.x += 1;
      const tw = 0.5 + 0.5 * Math.sin(this.t * s.sp + s.p);
      if (tw < 0.15) continue;
      g.globalAlpha = 0.25 + 0.55 * tw * (s.z / 3);
      g.fillStyle = s.c;
      const px = Math.round(s.z === 3 && tw > 0.85 ? 3 : 2) * d;
      g.fillRect(Math.round(s.x * W), Math.round(s.y * H), px, px);
    }
    g.globalAlpha = 1;
  },
};

/* ---------------- Python engine (Pyodide in a worker) ---------------- */
const PY = {
  w: null, state: 'off', msg: 'Python off', pending: null, onStatus: [], startT: 0,
  setState(st, msg) { this.state = st; this.msg = msg; renderPyChip(); this.onStatus.forEach(f => f()); },
  start() {
    if (this.w) return;
    this.setState('load', 'Loading Python …');
    try { this.w = new Worker('py-worker.js?lang=en'); }
    catch (e) { this.setState('err', 'Python not available'); return; }
    this.w.onerror = e => { this.setState('err', 'Python error: ' + (e.message || 'Worker')); };
    this.w.onmessage = ev => {
      const m = ev.data;
      if (m.type === 'status') { if (this.pending) clearTimeout(this.pending.timer); this.setState('load', m.text); }
      else if (m.type === 'ready') { this.setState('ok', 'Python ready'); if (this.pending && this.pending.arm) { clearTimeout(this.pending.timer); this.pending.arm(); } }
      else if (m.type === 'fatal') this.setState('err', 'Python could not load');
      else if ((m.type === 'stdout' || m.type === 'stderr') && this.pending) this.pending.onOut(m.type, m.text);
      else if (m.type === 'result' && this.pending && m.id === this.pending.id) {
        clearTimeout(this.pending.timer); const p = this.pending; this.pending = null; p.resolve(m.res);
      }
    };
  },
  run(code, tests, onOut, pre) {
    this.start();
    if (this.pending) return Promise.resolve({ ok: false, error: 'A program is already running.', tests: [], images: [] });
    return new Promise(resolve => {
      const id = Math.random().toString(36).slice(2);
      const p = { id, resolve, onOut: onOut || (() => {}) };
      p.timer = null;
      const arm = p.arm = () => {
        p.timer = setTimeout(() => {
          if (this.pending !== p) return;
          this.pending = null; this.w.terminate(); this.w = null;
          resolve({ ok: false, timeout: true, error: 'Time limit exceeded (20 s) – probably an infinite loop.', tests: [], images: [] });
          this.start();
        }, 20000);
      };
      this.pending = p;
      const go = () => { arm(); this.w.postMessage({ type: 'run', id, code, tests: tests || [], pre: pre || '' }); };
      if (this.state === 'ok') go();
      else { const f = () => { if (this.state === 'ok') { this.onStatus = this.onStatus.filter(x => x !== f); go(); } else if (this.state === 'err') { this.onStatus = this.onStatus.filter(x => x !== f); this.pending = null; resolve({ ok: false, error: 'Python could not be loaded. Reload the page or try again later.', tests: [], images: [] }); } }; this.onStatus.push(f); }
    });
  }
};
function renderPyChip() {
  const el = $('#pychip'); if (!el) return;
  el.className = 'pychip ' + (PY.state === 'ok' ? 'ok' : PY.state === 'load' ? 'load' : PY.state === 'err' ? 'err' : '');
  el.innerHTML = '<i></i>' + esc(PY.state === 'off' ? 'Python: starts when needed' : PY.msg);

/* error tutor */
function tutor(err) {
  if (!err) return '';
  const rules = [
    [/NameError: name '(\w+)' is not defined/, m => m[1] === 'np' ? '<code>import numpy as np</code> is missing at the top.' : `The name <code>${esc(m[1])}</code> doesn\'t exist (yet). A typo? Or is it only defined further down?`],
    [/IndentationError|TabError|unindent/, () => 'The indentation is off. In Python everything indented by 4 spaces belongs to the block above it (after <code>def</code>, <code>for</code>, <code>if</code> …).'],
    [/SyntaxError.*(expected ':'|invalid syntax)/, () => 'Syntax error: often a <code>:</code> is missing after <code>def</code>/<code>for</code>/<code>if</code>, a parenthesis isn\'t closed, or <code>=</code> instead of <code>==</code>.'],
    [/SyntaxError.*never closed/, () => 'A parenthesis was opened but never closed.'],
    [/'NoneType'/, () => 'Something is <code>None</code>. Usually a function is missing its <code>return</code> (or only has <code>pass</code>).'],
    [/could not be broadcast|shapes .* not aligned|matmul: Input operand/, () => 'The shapes of the arrays don\'t fit together. Print them with <code>print(x.shape)</code>.'],
    [/IndexError/, () => 'An index is outside the array. Python counts from 0; the last index is <code>len(x) - 1</code>.'],
    [/ZeroDivisionError/, () => 'Division by 0. With NumPy arrays you would get <code>inf</code>/<code>nan</code> and a warning instead.'],
    [/TypeError: unsupported operand type.*'list'/, () => 'You can\'t compute element-wise with lists. Turn it into an array: <code>np.array(my_list)</code>.'],
    [/TypeError: .*takes (\d+) positional argument/, () => 'The function is called with the wrong number of arguments.'],
    [/ModuleNotFoundError/, () => 'This module isn\'t available here. Available are numpy, scipy, sympy and matplotlib.'],
    [/ufunc .* Symbol|of type Symbol|of type Mul|of type Add|of type Pow/, () => 'NumPy functions (np.exp, np.sin …) can\'t compute with SymPy symbols. Use <code>sp.exp</code>, <code>sp.sin</code> – and NumPy only after <code>sp.lambdify</code>.'],
    [/must have different signs/, () => 'brentq needs a sign change: f(a) and f(b) must have different signs.'],
    [/'tuple' object|unsupported operand type.*'tuple'/, () => 'A tuple is involved here. <code>integrate.quad</code>, for example, returns (value, error) – take <code>[0]</code>.'],
    [/Time limit/, () => 'Check your while loops: does the condition really change on every pass?'],
  ];
  for (const [re, f] of rules) { const m = err.match(re); if (m) return '<div class="tutor">' + f(m) + '</div>'; }
  return '';
}

/* console */
function makeConsole(el) {
  const c = { el, buf: '' };
  c.clear = msg => { el.innerHTML = '<div class="sys">' + esc(msg || 'Output') + '</div><pre id="cout"></pre>'; c.buf = ''; };
  c.out = (type, text) => { c.buf += text + '\n'; const p = el.querySelector('#cout'); if (p) { p.insertAdjacentHTML('beforeend', type === 'stderr' ? '<span class="err">' + esc(text) + '\n</span>' : esc(text) + '\n'); } el.scrollTop = el.scrollHeight; };
  c.result = res => {
    let h = '';
    if (res.error) h += '<pre class="err">' + esc(res.error) + '</pre>' + (res.where ? '<pre class="where">' + esc(res.where) + '</pre>' : '') + tutor(res.error);
    const imgs = (res.images || []).filter(i => i[1]);
    if (imgs.length) h += '<div class="imgs">' + imgs.map(i => `<figure><img alt="${esc(i[0])}" src="data:image/png;base64,${i[1]}"><figcaption>${esc(i[0])}</figcaption></figure>`).join('') + '</div>';
    if (!res.error && !c.buf && !imgs.length) h += '<div class="sys">Program finished – no output.</div>';
    el.insertAdjacentHTML('beforeend', h);
  };
  return c;
}

/* editor */
function makeEditor(host, value, onRun, onSubmit) {
  if (window.CodeMirror) {
    const cm = CodeMirror(host, {
      value, mode: 'python', theme: 'pico', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
      matchBrackets: true, autoCloseBrackets: true, viewportMargin: Infinity, lineWrapping: false,
      extraKeys: {
        Tab: cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end'),
        'Shift-Tab': cm => cm.indentSelection('subtract'),
        'Ctrl-Enter': () => onRun(), 'Cmd-Enter': () => onRun(),
        'Shift-Ctrl-Enter': () => onSubmit && onSubmit(), 'Shift-Cmd-Enter': () => onSubmit && onSubmit(),
      },
    });
    let marked = null;
    return {
      get: () => cm.getValue(), set: v => cm.setValue(v), focus: () => cm.focus(), onChange: f => cm.on('change', f),
      markLine: n => { if (marked !== null) cm.removeLineClass(marked, 'background', 'cm-error-line'); marked = null; if (n) { marked = n - 1; cm.addLineClass(marked, 'background', 'cm-error-line'); } },
      refresh: () => cm.refresh(),
    };
  }
  host.innerHTML = '<textarea spellcheck="false" aria-label="Code-Editor" id="ta"></textarea>';
  const ta = host.querySelector('textarea'); ta.value = value;
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.shiftKey && onSubmit ? onSubmit() : onRun(); }
  });
  return { get: () => ta.value, set: v => { ta.value = v; }, focus: () => ta.focus(), onChange: f => ta.addEventListener('input', f), markLine: () => {}, refresh: () => {} };
}

function codeRoom(r) {
  setWC(r.world);
  const st = S.rooms[r.id] || {};
  const isBoss = r.kind === 'boss';
  const draft = S.drafts[r.id] || r.template;
  const R = { r, hintsShown: 0, solShown: !!st.solSeen, submits: 0, running: false, lastTests: null };
  app.innerHTML = `
    <div class="rhead">
      <button class="btn ghost" id="back">◂ ${esc(r.world.title)}</button>
      <div class="title"><small>World ${r.world.n} · ${isBoss ? 'Boss' : 'Coding task'}${r.ref ? ' · ' + esc(r.ref) : ''}</small><h1>${esc(r.title)}</h1></div>
      ${roomNav(r)}
    </div>
    <div class="bench">
      <section class="frame task">
        ${isBoss ? `<div class="bossrow"><img class="spr bossspr ${st.done ? 'dead' : ''}" id="bossspr" src="${spr(st.done ? 'crown' : 'boss')}" alt=""><div class="hp"><div class="lbl"><span>${st.done ? 'DEFEATED' : 'BOSS HP'}</span><span id="hpnum">${st.done ? 0 : r.tests.length}/${r.tests.length}</span></div><div class="bar" id="hpbar">${r.tests.map(() => `<i class="${st.done ? 'gone' : ''}"></i>`).join('')}</div></div></div>` : ''}
        <div class="txt">${mdPara(r.text)}</div>
        <div><h3>Tests (${r.tests.length})</h3><div class="tests" id="tests">${r.tests.map((t, i) => `<div class="test" id="t${i}"><i></i><span>${esc(t.name)}</span></div>`).join('')}</div></div>
        <div><h3>Help</h3><div class="hints" id="hints"></div>
          <div class="actions" style="margin-top:8px"><button class="btn ghost" id="hintb">Hint (${r.hints.length})</button>${GAME.public ? '' : '<button class="btn ghost" id="solb">Model solution</button>'}</div>
          <div id="sol" class="solution"></div></div>
        <p class="note">Tip: <code>Ctrl/⌘ + Enter</code> runs, <code>Shift + Ctrl/⌘ + Enter</code> submits. Your code is saved automatically.</p>
      </section>
      <section class="ide">
        <div class="bar">
          <span class="fname">main.py</span>
          <button class="btn" id="runb">▶ Run</button>
          <button class="btn go" id="subb">✓ Submit</button>
          <button class="btn ghost" id="resb" title="Restore template">↺</button>
        </div>
        <div class="edwrap" id="ed"></div>
        <div class="console" id="con"><div class="ph">Output, errors and figures from <code>./cx_out/</code> appear here.</div></div>
      </section>
    </div>`;
  $('#back').onclick = () => go('world', r.world.id);
  bindRoomNav();
  R.hits = 0;
  if (isBoss && !st.done) {
    AU.sfx('intro');
    overlay(`<img class="spr big wobble" src="${spr('boss')}" alt=""><p class="pix" style="color:var(--pink);font-size:.75rem;margin:0">BOSS FIGHT · WORLD ${r.world.n}</p><h2>${esc(r.title.replace(/^Boss:\s*/, ''))}</h2>
      <div class="hp" style="margin:12px 0"><div class="bar">${r.tests.map(() => '<i></i>').join('')}</div></div>
      <p>This boss has <b>${r.tests.length} lives</b>. Every passed test is a hit. Hints cost stars, but no lives.</p>
      <button class="btn red" data-close>⚔ Start the fight</button>`, { cls: 'bossintro' });
  }
  const con = makeConsole($('#con'));
  const ed = makeEditor($('#ed'), draft, () => run(false), () => run(true));
  setTimeout(() => ed.refresh(), 30); setTimeout(() => ed.refresh(), 420);
  ed.onChange(() => { S.drafts[r.id] = ed.get(); clearTimeout(R.sv); R.sv = setTimeout(save, 400); });
  PY.start();
  const btns = ['#runb', '#subb'].map(s => $(s));
  let streamed = [];
  const reprint = () => { const p = con.el.querySelector('#cout'); streamed.forEach(([t, x]) => p.insertAdjacentHTML('beforeend', t === 'stderr' ? '<span class="err">' + esc(x) + '\n</span>' : esc(x) + '\n')); con.buf = streamed.map(s => s[1]).join(''); };
  async function run(withTests) {
    if (R.running) return;
    R.running = true; btns.forEach(b => b.disabled = true); ed.markLine(null); AU.sfx('run');
    con.clear(PY.state === 'ok' ? (withTests ? 'Running with tests …' : 'Running …') : 'Loading Python (about 30 MB once, instant afterwards) …');
    streamed = [];
    const res = await PY.run(ed.get(), withTests ? r.tests : null, (t, x) => { streamed.push([t, x]); con.out(t, x); });
    R.running = false; btns.forEach(b => b.disabled = false);
    con.clear(withTests ? 'Output (with tests)' : 'Output'); reprint();
    con.result(res);
    const lm = (res.where || '').match(/line (\d+)/) || (res.error || '').match(/line (\d+)/);
    if (lm) ed.markLine(+lm[1]);
    if (res.error) { AU.sfx('error'); FX.shake($('#con')); }
    if (withTests) grade(res);
  }
  function grade(res) {
    R.submits++;
    const n = r.tests.length;
    const results = res.tests && res.tests.length ? res.tests : r.tests.map(t => ({ name: t.name, ok: false, msg: res.timeout ? 'Time limit' : 'did not run – the program stops with an error before' }));
    const passed = results.filter(t => t.ok).length;
    const step = RM ? 0 : 140;
    let okIdx = 0;
    results.forEach((t, i) => {
      setTimeout(() => {
        const el = $('#t' + i); if (!el) return;
        el.className = 'test ' + (t.ok ? 'ok' : 'no');
        el.innerHTML = `<i></i><span>${esc(r.tests[i].name)}${t.ok ? '' : '<span class="msg">' + esc(t.msg || '') + '</span>'}</span>`;
        if (t.ok) { AU.sfx(isBoss ? 'hit' : 'tick', okIdx * 2); okIdx++; FX.burstAt(el.querySelector('i'), 6, ['#00E436', '#FFEC27']); }
        if (isBoss && t.ok) {
          const segs = [...$('#hpbar').querySelectorAll('i')]; const seg = segs.find(s => !s.classList.contains('gone'));
          if (seg) { seg.classList.add('gone'); FX.burstAt(seg, 8, ['#FF004D', '#FF77A8']); }
          FX.shake($('#bossspr')); FX.flash('#FF004D');
          $('#hpnum').textContent = Math.max(0, n - okIdx) + '/' + n;
        }
      }, i * step);
    });
    if (isBoss) $('#hpbar').querySelectorAll('i').forEach(el => el.classList.remove('gone'));
    setTimeout(() => {
      if (passed === n) win();
      else { AU.sfx('fail'); con.el.insertAdjacentHTML('afterbegin', `<div class="sys" style="color:var(--orange)">${passed}/${n} tests passed${isBoss ? ' – the boss still has ' + (n - passed) + ' lives' : ''}.</div>`); }
    }, n * step + 120);
  }
  function win() {
    const prev = S.rooms[r.id] || {};
    const stars = R.solShown ? 1 : R.hintsShown ? 2 : 3;
    const first = !prev.done;
    S.rooms[r.id] = { done: true, stars: Math.max(prev.stars || 0, stars), solSeen: R.solShown || prev.solSeen };
    save();
    const gain = first ? (isBoss ? 150 : stars === 1 ? 15 : 50) : 0;
    AU.sfx(isBoss ? 'boss' : 'win'); FX.confetti();
    if (isBoss) { const b = $('#bossspr'); if (b) { b.src = spr('crown'); b.classList.add('dead'); } const l = app.querySelector('.hp .lbl span'); if (l) l.textContent = 'DEFEATED'; }
    con.el.insertAdjacentHTML('afterbegin', `<div class="victory"><img class="spr vic bob" src="${spr(isBoss ? 'crown' : 'medal')}" alt=""><b>${isBoss ? 'BOSS DEFEATED!' : 'ALL TESTS PASSED'}</b><span class="stars" style="color:var(--yellow)">${starsHtml(stars)}</span> ${first ? ' · +' + gain + ' XP' : ''}<div class="actions" style="justify-content:center;margin-top:8px"><button class="btn go" id="nextr">Next room ▸</button><button class="btn ghost" id="maprb">${esc(r.world.title)}</button></div></div>`);
    const rs = r.world.rooms, nr = rs[rs.indexOf(r) + 1] || nextRoom();
    $('#nextr').onclick = () => nr ? go('room', nr.id) : go('home');
    $('#maprb').onclick = () => go('world', r.world.id);
    con.el.scrollTop = 0;
    setTimeout(() => addXP(gain, $('.victory')), 300);
    if (!gain) checkBadges();
  }
  $('#runb').onclick = () => run(false);
  $('#subb').onclick = () => run(true);
  $('#resb').onclick = () => {
    const b = $('#resb');
    if (b.dataset.armed) { ed.set(r.template); delete S.drafts[r.id]; save(); b.dataset.armed = ''; b.textContent = '↺'; toast('Template restored'); }
    else { b.dataset.armed = '1'; b.textContent = 'Really reset?'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '↺'; }, 3000); }
  };
  $('#hintb').onclick = () => {
    if (R.hintsShown >= r.hints.length) return;
    AU.sfx('hint');
    $('#hints').insertAdjacentHTML('beforeend', `<div class="hint"><b>Hint ${R.hintsShown + 1}:</b> ${md(r.hints[R.hintsShown])}</div>`);
    R.hintsShown++; $('#hintb').textContent = R.hintsShown < r.hints.length ? `Another hint (${r.hints.length - R.hintsShown})` : 'No more hints';
    if (R.hintsShown >= r.hints.length) $('#hintb').disabled = true;
  };
  if ($('#solb')) $('#solb').onclick = () => {
    const sol = $('#sol');
    if (sol.innerHTML) { sol.innerHTML = ''; return; }
    if (!R.solShown && R.submits === 0 && !$('#solb').dataset.armed) {
      $('#solb').dataset.armed = '1'; $('#solb').textContent = 'Try it yourself first? Click again'; return;
    }
    R.solShown = true; S.rooms[r.id] = Object.assign(S.rooms[r.id] || {}, { solSeen: true }); save();
    sol.innerHTML = `<p class="note" style="margin:10px 0 0">Compare with your code. Tip: don\'t copy – type it out and understand it. (With the solution you only get one star.)</p>${codeBlock(r.solution, 'Model solution')}`;
    $('#solb').textContent = 'Hide solution';
  };
  KEYH = null;
}

         done: 0, firstTry: 0, missed: new Set(), xp: 0, streak: 0, marks: [] };

function startCustom(title, qs, opts) {

function hearts() {
  if (!QS.room) return '';
  const e = QS.missed.size, h = e === 0 ? 3 : e <= 2 ? 2 : 1;
  return `<span class="hearts" title="${h} of 3 stars still possible">${[0, 1, 2].map(i => `<img class="spr ${i < h ? '' : 'lost'}" src="${spr('heart')}" alt="">`).join('')}</span>`;
}

function finishCards() {

function nextQ() {

function questionBody(q, st) {
  let body = '';
  if (q.pre && q.t !== 'fill') body += '<div class="given">Given</div>' + codeBlock(q.pre);
  if (q.t === 'mc' || q.t === 'out') {
    if (q.code) body += codeBlock(q.code);
    st.order = shuffle(q.opts.map((_, i) => i));
    body += '<div class="opts" role="radiogroup">' + st.order.map((oi, k) => {
      const o = q.opts[oi];
      return `<button class="opt" role="radio" aria-checked="false" data-i="${oi}"><span class="k">${k + 1}</span>${q.t === 'out' ? '<pre>' + esc(o) + '</pre>' : '<span class="t">' + md(o) + '</span>'}</button>`;
    }).join('') + '</div>';
  } else if (q.t === 'typ') {
    body += codeBlock(q.code) + '<label class="given" for="ans">Your output</label><input class="answer-input" id="ans" autocomplete="off" spellcheck="false" placeholder="exactly as Python prints it">';
  } else if (q.t === 'fill') {
    if (q.pre) body += '<div class="given">Given</div>' + codeBlock(q.pre);
    const parts = q.code.split('____');
    body += '<div class="code"><pre>' + hl(parts[0]) + '<input class="blank" id="ans" autocomplete="off" spellcheck="false" aria-label="Gap" size="8">' + hl(parts[1]) + '</pre></div>';
  } else if (q.t === 'bug') {
    body += '<div class="code buglines"><pre>' + q.lines.map((l, i) => `<div class="ln" tabindex="0" role="button" data-i="${i}"><span class="no">${i + 1}</span><span>${hl(l) || ' '}</span></div>`).join('') + '</pre></div>';
  } else if (q.t === 'order') {
    st.pool = shuffle(q.lines.map((_, i) => i));
    if (st.pool.every((v, i) => v === i) && st.pool.length > 1) st.pool.reverse();
    st.ans = [];
    body += '<div class="parsons"><div class="zlabel">Your program (click = put back)</div><div class="zone target" id="zt"></div><div class="zlabel">Available lines (indentation is already correct)</div><div class="zone" id="zp"></div></div>';
  }
  return body;
}
function bindQuestion(q, st, enable) {
  if (q.t === 'mc' || q.t === 'out') {
    const btns = [...app.querySelectorAll('.opt')];
    btns.forEach(b => b.onclick = () => { if (st.checked) return; AU.sfx('select'); btns.forEach(x => { x.classList.remove('sel'); x.setAttribute('aria-checked', 'false'); }); b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); st.sel = +b.dataset.i; enable(true); });
  } else if (q.t === 'typ' || q.t === 'fill') {
    const inp = $('#ans'); inp.oninput = () => enable(inp.value.trim().length > 0); setTimeout(() => inp.focus({ preventScroll: true }), 30);
  } else if (q.t === 'bug') {
    const lns = [...app.querySelectorAll('.ln')];
    const pick = b => { if (st.checked) return; lns.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); st.sel = +b.dataset.i; enable(true); };
    lns.forEach(b => { b.onclick = () => pick(b); b.onkeydown = e => { if (e.key === ' ') { e.preventDefault(); pick(b); } }; });
  } else if (q.t === 'order') {
    const draw = () => {
      const zt = $('#zt'), zp = $('#zp');
      zt.innerHTML = st.ans.length ? st.ans.map((li, k) => `<button class="chipline" data-a="${k}" ${st.checked ? 'disabled' : ''}>${hl(q.lines[li])}</button>`).join('') : '<div class="ph">Click the lines below in the right order.</div>';
      zp.innerHTML = st.pool.length ? st.pool.map((li, k) => `<button class="chipline" data-p="${k}" ${st.checked ? 'disabled' : ''}>${hl(q.lines[li])}</button>`).join('') : '<div class="ph">All lines placed.</div>';
      zt.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { st.pool.push(st.ans.splice(+b.dataset.a, 1)[0]); draw(); });
      zp.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { st.ans.push(st.pool.splice(+b.dataset.p, 1)[0]); draw(); });
      enable(!st.pool.length && !st.checked);
    };
    st.draw = draw; draw();
  }
}
const normSpace = s => s.trim().replace(/\s+/g, ' ');
const normTight = s => s.replace(/\s+/g, '').replace(/"/g, "'");
function isCorrect(q, st) {
  if (q.t === 'mc' || q.t === 'out') return st.sel === q.a;
  if (q.t === 'typ') { const v = $('#ans').value; return q.acc.some(a => normSpace(a) === normSpace(v) || normTight(a).replace(/,/g, '') === normTight(v).replace(/,/g, '')); }
  if (q.t === 'fill') { const v = normTight($('#ans').value); return q.acc.some(a => normTight(a) === v); }
  if (q.t === 'bug') return st.sel === q.bug;
  if (q.t === 'order') return st.ans.every((li, k) => q.lines[li] === q.lines[k]);
  return false;
}
function markQuestion(q, st) {
  if (q.t === 'mc' || q.t === 'out') app.querySelectorAll('.opt').forEach(b => { b.disabled = true; const i = +b.dataset.i; if (i === q.a) b.classList.add('right'); else if (i === st.sel) b.classList.add('wrong'); });
  else if (q.t === 'bug') app.querySelectorAll('.ln').forEach(b => { const i = +b.dataset.i; if (i === q.bug) b.classList.add('right'); else if (i === st.sel) b.classList.add('wrong'); b.removeAttribute('tabindex'); });
  else if (q.t === 'order') st.draw();
  const inp = $('#ans'); if (inp) inp.disabled = true;
}
function revealHtml(q, ok) {
  let s = '';
  if (!ok) {
    if (q.t === 'typ') s = '<p>Correct output:</p>' + codeBlock(q.acc[0], '');
    if (q.t === 'fill') s = '<p>The gap takes:</p>' + codeBlock(q.acc[0], '');
    if (q.t === 'order') s = '<p>Correct order:</p>' + codeBlock(q.lines.join('\n'), '');
  }
  if (q.t === 'bug') s = '<p>Corrected line ' + (q.bug + 1) + ':</p>' + codeBlock(q.fix, '');
  return s;
}
function runnableSnippet(q) {
  if (q.t === 'out' || q.t === 'typ') return (q.pre ? q.pre + '\n' : '') + q.code;
  if (q.t === 'fill') return (q.pre ? q.pre + '\n' : '') + q.code.replace('____', q.acc[0]);
  if (q.t === 'order') return (q.pre ? q.pre + '\n' : '') + q.lines.join('\n');
  if (q.t === 'bug') { const L = q.lines.slice(); L[q.bug] = q.fix; return (q.pre ? q.pre + '\n' : '') + L.join('\n'); }
  if (q.t === 'mc' && q.code) return q.code;
  return null;
}
function tryRunButton(q) {
  const code = runnableSnippet(q); if (!code) return '';
  return `<div class="tryrun"><button class="btn ghost" id="tryb">▶ Run it yourself</button><button class="btn ghost" id="tolab">Open in the lab</button><div class="tryout" id="tryout"></div></div>`;
}
function bindTryRun(q) {

    const res = await PY.run(full, null, con.out); const sy = out.querySelector('.sys'); if (sy) sy.textContent = 'Output'; con.result(res); b.disabled = false;
  };
  const l = $('#tolab'); if (l) l.onclick = () => { S.drafts.__lab = full; save(); go('labor'); };
}
function ask(q) {
  window.scrollTo(0, 0);
  if (!QS.room && q.room) setWC(q.room.world);
  QS.currentChecked = false;
  const st = { q, sel: null, hint: false, checked: false };
  app.innerHTML = `<div class="qwrap">${qHead()}<div class="frame qpanel">
    <div class="qmeta"><span class="kind">${KIND[q.t]}${QS.streak >= 2 ? ` <span class="combo">COMBO ×${QS.streak}</span>` : ''}</span><span class="qright">Question ${QS.done + 1} / ${QS.total}${QS.missed.has(q.id) ? ' · Repeat' : ''}${!QS.room && q.room ? ' · ' + esc(q.room.world.title) : ''}${hearts()}</span></div>
    <p class="qtext">${md(q.q)}</p>${questionBody(q, st)}
    <div id="hint"></div>
    <div class="actions" id="acts"><button class="btn go" id="check" disabled>Check</button>${QS.noHints ? '' : '<button class="btn ghost" id="hintb">Hint</button>'}
      <span class="kbd">${q.t === 'mc' || q.t === 'out' ? '1–4 CHOOSE · ' : ''}ENTER = CHECK</span></div>

  if (hb) hb.onclick = () => { st.hint = true; hb.disabled = true; AU.sfx('hint'); $('#hint').innerHTML = '<div class="hint" style="margin-top:12px"><b>Hint:</b> ' + md(q.hint || FALLBACK_HINT[q.t]) + '</div>'; };
  check.onclick = () => gradeQ(st);
  KEYH = e => {
    if ((q.t === 'mc' || q.t === 'out') && !st.checked && /^[1-4]$/.test(e.key) && document.activeElement.tagName !== 'INPUT') { const b = app.querySelectorAll('.opt')[+e.key - 1]; if (b) b.click(); }
    if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); if (st.checked) { const n = $('#nextq'); if (n) n.click(); } else if (!check.disabled) check.click(); }
  };
}
function gradeQ(st) {
  const q = st.q; const ok = isCorrect(q, st);
  st.checked = true; QS.currentChecked = true; markQuestion(q, st);
  const firstAttempt = !QS.missed.has(q.id);
  let gain = 0;
  if (ok) {
    gain = firstAttempt ? 10 : 3; if (st.hint) gain = Math.max(1, Math.round(gain / 2));
    QS.streak++; if (firstAttempt) QS.firstTry++;
    if (QS.streak > S.best) S.best = QS.streak;
    if (QS.streak % 5 === 0) { gain += 5; setTimeout(() => FX.float(QS.streak + ' STREAK!', $('.qpanel'), '#FFA300'), 250); }
    QS.marks[QS.done] = firstAttempt ? 'ok' : 'no'; QS.done++;
    if (QS.training) S.mistakes = S.mistakes.filter(id => id !== q.id);
  } else {
    const hBefore = QS.missed.size; QS.streak = 0; QS.missed.add(q.id);
    if (QS.room && (hBefore === 0 || hBefore === 2)) setTimeout(() => { AU.sfx('heart'); const hs = app.querySelectorAll('.hearts img:not(.lost)'); const last = hs[hs.length - 1]; if (last) { FX.burstAt(last, 10, ['#FF004D']); last.classList.add('lost'); } }, 350);
    if (!S.mistakes.includes(q.id)) S.mistakes.push(q.id);
    QS.queue.push(q);
  }
  QS.xp += gain;
  if (ok) { AU.sfx('correct', QS.streak); } else { AU.sfx('wrong'); FX.shake(app.querySelector('.qpanel')); }
  $('#check').remove(); const hb = $('#hintb'); if (hb) hb.remove();
  $('#acts').insertAdjacentHTML('afterbegin', `<button class="btn go" id="nextq">${QS.queue.length ? 'Next ▸' : 'Results'}</button>`);
  $('#nextq').onclick = nextQ;
  const kb = app.querySelector('.kbd'); if (kb) kb.textContent = 'ENTER = NEXT';
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}" role="status"><h3>${ok ? 'CORRECT' + (gain ? ' · +' + gain + ' XP' : '') : 'NOT YET – COMES BACK AT THE END'}</h3>${revealHtml(q, ok)}<p>${md(q.ex)}</p>${tryRunButton(q)}</div>`;
  bindTryRun(q);
  $('#nextq').focus({ preventScroll: true });
  if (ok) { FX.burstAt(app.querySelector('.opt.right, .ln.right, .feedback'), 16); addXP(gain, $('.feedback h3')); }
  else checkBadges();
}

let EX = null;

function examTick() {
  if (!EX) return;

  if (el) { const m = Math.floor(t / 60000), s = Math.floor(t / 1000) % 60; el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); el.classList.toggle('low', t < 5 * 60000); }

function exHead(label) {

function bindExHead() {

function examFinish() {

  S.exams.push({ pct, date: new Date().toISOString().slice(0, 10) }); save();
  AU.sfx(pct >= 70 ? 'boss' : 'win'); if (pct >= 70) FX.confetti();
  setTimeout(() => addXP(Math.round(pct / 2), app.querySelector('.end h2')), 400);
  const E = EX; EX = null; setWC(null); window.scrollTo(0, 0);
  app.innerHTML = `<div class="qwrap"><div class="rhead"><div class="title"><small>Mock exam</small><h1>Results</h1></div></div>
    <div class="frame end"><h2>${pct} %</h2><div class="nums"><div><b>${qOk}/${E.qs.length}</b><span>Moodle part</span></div><div><b>${cPts.toFixed(1)}/${2 * E.codes.length}</b><span>CodeExpert part (2 pts each)</span></div></div>
    <p class="note">${pct >= 70 ? 'Very good – the exam can come.' : pct >= 50 ? 'Solid. Look at the wrong questions below and repeat the rooms for them.' : 'More training pays off here: play the rooms of the marked topics again.'}</p></div>
    <div class="frame qpanel" style="margin-top:16px"><h3 class="pix" style="font-size:.85rem;margin-bottom:10px">Part 1 in detail</h3><div class="examlist">
    ${E.qs.map((q, i) => { const a = E.ans[i] || { ok: false }; if (!a.ok && !S.mistakes.includes(q.id)) S.mistakes.push(q.id); return `<div class="examitem"><span>${md(q.q)}</span><b class="${a.ok ? 'ok-t' : 'no-t'}">${a.ok ? 'CORRECT' : a.skipped ? 'SKIPPED' : 'WRONG'}</b>${a.ok ? '' : '<div class="note" style="flex-basis:100%">' + md(q.ex) + '</div>'}</div>`; }).join('')}
    </div><h3 class="pix" style="font-size:.85rem;margin:16px 0 10px">Part 2</h3><div class="examlist">
    ${E.codeRes.map(c => `<div class="examitem"><span>${esc(c.r.title)}</span><b class="${c.passed === c.n ? 'ok-t' : 'no-t'}">${c.passed}/${c.n} Tests</b><button class="btn ghost" data-room="${c.r.id}">Open room</button></div>`).join('') || '<p class="note">Not reached.</p>'}
    </div><div class="actions"><button class="btn go" id="again">New mock exam</button><button class="btn ghost" id="map">Map</button></div></div></div>`;
  save();
  app.querySelectorAll('[data-room]').forEach(b => b.onclick = () => go('room', b.dataset.room));
  $('#again').onclick = () => go('exam'); $('#map').onclick = () => go('home');
}

/* ---------------- CHEAT SHEET ---------------- */
function cheat(wid) {
  const only = wid ? GAME.worlds.find(w => w.id === wid) : null;
  setWC(only);
  let h = `<div class="rhead"><button class="btn ghost" id="back">◂ ${only ? esc(only.title) : 'Map'}</button><div class="title"><small>${only ? 'World ' + only.n : 'All worlds'}</small><h1>Cheat sheet</h1></div>${only ? '<button class="btn ghost" id="allc">All worlds</button>' : ''}</div>`;
  (only ? [only] : GAME.worlds).forEach(w => {
    const cards = w.rooms.filter(r => r.kind === 'quiz').flatMap(r => r.cards || []).filter(c => !/^Boss/.test(c.title));
    if (!cards.length) return;
    h += `<div style="--wc: var(${w.color})"><h2 class="sect">${w.n} · ${esc(w.title)} <span class="note">${esc(w.chap)}</span></h2><div class="cgrid">` +
      cards.map(c => `<div class="frame ccard"><h3>${esc(c.title)}</h3>${mdPara(c.text)}${c.code ? codeBlock(c.code) : ''}</div>`).join('') + '</div></div>';
  });
  app.innerHTML = h;
  $('#back').onclick = () => only ? go('world', only.id) : go('home');
  const a = $('#allc'); if (a) a.onclick = () => go('cheat');
}

/* ---------------- boot ---------------- */
STARS.init();
renderHud();
const h0 = (location.hash || '').slice(1);
if (h0 && ROOM[h0]) go('room', h0);
else if (h0.startsWith('w-') && GAME.worlds.some(w => w.id === h0.slice(2))) go('world', h0.slice(2));
else if (['labor', 'cheat', 'exam', 'badges'].includes(h0)) go(h0); else go('home');
let titleSeen = false; try { titleSeen = !!sessionStorage.getItem('numcs.title'); } catch (e) {}
if (!titleSeen && (!h0 || h0 === 'home')) titleScreen();
</script>
