/* Layout: a fantasy-console dungeon. Worlds are floors of rooms (quiz scrolls, code terminals, boss skulls);
   code rooms are a two-pane workbench like CodeExpert. Single committed dark look in the PICO-8 palette. */
:root {
  color-scheme: dark;
  --black: #000000; --navy: #1D2B53; --plum: #7E2553; --dgreen: #008751; --brown: #AB5236; --slate: #5F574F;
  --silver: #C2C3C7; --paper: #FFF1E8; --red: #FF004D; --orange: #FFA300; --yellow: #FFEC27; --lime: #00E436;
  --sky: #29ADFF; --lav: #83769C; --pink: #FF77A8; --peach: #FFCCAA; --mint: #A8E72E; --teal: #4FE3D2;
  --bg: #141c38; --panel: #0b1022; --panel2: #18234a; --line: #2c3a6b; --muted: #9aa3c4;
  --f-pixel: "Silkscreen", "Courier New", monospace;
  --f-title: "Pixelify Sans", "Silkscreen", "Trebuchet MS", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--paper); }
body {
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(rgba(41,173,255,0.07) 1px, transparent 1.4px);
  background-size: 8px 8px;
}
::selection { background: var(--plum); color: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
code, pre { font-family: var(--f-code); }
:not(pre) > code { background: var(--black); color: var(--peach); padding: 0.05em 0.35em; font-size: 0.88em; }
h1, h2, h3 { margin: 0; font-family: var(--f-title); font-weight: 700; text-wrap: balance; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 0 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pix { font-family: var(--f-pixel); letter-spacing: 0.04em; }
img.spr { image-rendering: pixelated; display: block; }

/* pixel frame */
.frame { background: var(--panel); border: 3px solid var(--black); box-shadow: inset 0 0 0 2px var(--line), 4px 4px 0 0 var(--black); }
.btn { font-family: var(--f-pixel); font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; border: 3px solid var(--black);
  background: var(--sky); color: var(--black); padding: 8px 14px; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.25), inset 3px 3px 0 rgba(255,255,255,0.3), 3px 3px 0 var(--black);
  display: inline-flex; align-items: center; gap: 8px; transition: transform .06s; }
.btn:hover:not([disabled]) { filter: brightness(1.08); }
.btn:active:not([disabled]) { transform: translate(2px, 2px); box-shadow: inset -3px -3px 0 rgba(0,0,0,0.25), 1px 1px 0 var(--black); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.go { background: var(--lime); }
.btn.warn { background: var(--orange); }
.btn.ghost { background: var(--panel2); color: var(--paper); }
.btn.red { background: var(--red); color: var(--paper); }
.btn .k { font-size: 0.66rem; opacity: 0.7; text-transform: none; }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--black); border-bottom: 3px solid var(--navy); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--black); }
.hud .in { max-width: 1240px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo { background: none; border: 0; padding: 0; font-family: var(--f-pixel); font-weight: 700; font-size: 1.05rem; color: var(--yellow); text-shadow: 2px 2px 0 var(--plum); white-space: nowrap; }
.hud .stat { font-family: var(--f-pixel); font-size: 0.72rem; color: var(--silver); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.hud .stat b { color: var(--paper); font-weight: 700; }
.xpbar { width: 110px; height: 10px; background: var(--navy); border: 2px solid var(--slate); position: relative; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: var(--lime); }
.pychip { margin-left: auto; font-family: var(--f-pixel); font-size: 0.68rem; padding: 3px 8px; border: 2px solid var(--slate); color: var(--silver); display: flex; align-items: center; gap: 6px; }
.pychip i { width: 8px; height: 8px; background: var(--slate); display: inline-block; }
.pychip.ok i { background: var(--lime); } .pychip.load i { background: var(--orange); animation: blink 0.6s steps(2) infinite; } .pychip.err i { background: var(--red); }
@keyframes blink { 50% { opacity: 0.2; } }

/* HOME */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: end; padding: 34px 0 22px; }
.hero h1 { font-family: var(--f-pixel); font-weight: 700; font-size: clamp(2.2rem, 6.4vw, 4.6rem); line-height: 0.95; color: var(--paper); text-shadow: 4px 4px 0 var(--plum), 8px 8px 0 var(--black); }
.hero h1 span { color: var(--yellow); }
.hero p { color: var(--silver); max-width: 52ch; margin: 18px 0 0; font-size: 1.05rem; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.savecard { padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.savecard .lbl { font-family: var(--f-pixel); font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
.savecard .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.savecard .big { font-family: var(--f-pixel); font-size: 1.6rem; color: var(--yellow); }
.minimap { display: grid; grid-template-columns: repeat(auto-fit, minmax(22px, 1fr)); gap: 5px; }
.grouphead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 34px 0 14px; border-top: 3px dashed var(--navy); padding-top: 18px; }
.grouphead h2 { font-family: var(--f-pixel); font-size: 1.15rem; color: var(--yellow); }
.grouphead p { margin: 0; color: var(--muted); font-size: 0.92rem; max-width: 70ch; }
.minimap div { height: 46px; background: var(--navy); border: 2px solid var(--black); position: relative; overflow: hidden; }
.minimap div i { position: absolute; inset: auto 0 0 0; background: var(--wc); }
.minimap div span { position: absolute; top: 2px; left: 4px; font-family: var(--f-pixel); font-size: 0.6rem; color: var(--paper); text-shadow: 1px 1px 0 var(--black); z-index: 1; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 8px 0 30px; }
.mode { text-align: left; padding: 14px 16px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; align-items: center; background: var(--panel); border: 3px solid var(--black); box-shadow: inset 0 0 0 2px var(--line), 4px 4px 0 var(--black); }
.mode:hover { box-shadow: inset 0 0 0 2px var(--sky), 4px 4px 0 var(--black); }
.mode img { grid-row: span 2; width: 40px; height: 40px; }
.mode b { font-family: var(--f-pixel); font-size: 0.92rem; }
.mode span { color: var(--muted); font-size: 0.88rem; }

.floor { margin-bottom: 22px; padding: 16px 18px 18px; position: relative; }
.floor .fh { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.floor .num { font-family: var(--f-pixel); font-weight: 700; color: var(--black); background: var(--wc); padding: 4px 9px; border: 3px solid var(--black); }
.floor h2 { font-size: 1.45rem; }
.floor .chap { font-family: var(--f-pixel); font-size: 0.7rem; color: var(--wc); text-transform: uppercase; }
.floor .prog { margin-left: auto; font-family: var(--f-pixel); font-size: 0.72rem; color: var(--muted); }
.floor .blurb { color: var(--silver); margin: -6px 0 14px; font-size: 0.95rem; }
.path { display: flex; flex-wrap: wrap; gap: 10px 0; align-items: center; }
.tile { position: relative; width: 66px; height: 66px; background: var(--navy); border: 3px solid var(--black); display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); transition: transform .08s; }
.tile:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 2px var(--wc); }
.tile img { width: 34px; height: 34px; }
.tile.k-code { background: #0e1d2f; }
.tile.k-boss { width: 84px; height: 84px; background: #2a0f22; }
.tile.k-boss img { width: 48px; height: 48px; }
.tile.done { background: color-mix(in srgb, var(--wc) 32%, var(--navy)); box-shadow: inset 0 0 0 2px var(--wc); }
.tile.next { animation: pulse 1.2s steps(2) infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 3px var(--yellow); } }
.tile .stars { position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); font-size: 10px; line-height: 1; color: var(--slate); letter-spacing: 1px; white-space: nowrap; }
.tile .stars i { font-style: normal; color: var(--yellow); }
.tile .tip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--black); color: var(--paper); font-family: var(--f-pixel); font-size: 0.68rem; padding: 5px 8px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 5; border: 2px solid var(--wc); }
.tile:hover .tip, .tile:focus-visible .tip { display: block; opacity: 1; }
.link { width: 14px; height: 4px; background: repeating-linear-gradient(90deg, var(--slate) 0 4px, transparent 4px 7px); flex: none; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend img { width: 20px; height: 20px; }

/* room header */
.rhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px 0 14px; }
.rhead .title { min-width: 0; flex: 1 1 240px; }
.rhead .title small { display: block; font-family: var(--f-pixel); font-size: 0.68rem; color: var(--wc, var(--sky)); text-transform: uppercase; }
.rhead .title h1 { font-size: 1.55rem; }
.chip { font-family: var(--f-pixel); font-size: 0.66rem; padding: 3px 7px; border: 2px solid var(--wc, var(--sky)); color: var(--wc, var(--sky)); text-transform: uppercase; white-space: nowrap; }

/* CODE ROOM */
.bench { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
.task { padding: 18px; display: grid; gap: 14px; min-width: 0; }
.task .txt p { margin: 0 0 8px; }
.task h3 { font-family: var(--f-pixel); font-size: 0.8rem; color: var(--muted); text-transform: uppercase; font-weight: 400; margin-bottom: 6px; }
.hints { display: grid; gap: 8px; }
.hint { background: #261a07; border-left: 4px solid var(--orange); padding: 8px 12px; font-size: 0.95rem; }
.tests { display: grid; gap: 6px; }
.test { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 0.92rem; }
.test i { width: 12px; height: 12px; margin-top: 5px; background: var(--slate); border: 2px solid var(--black); }
.test.ok i { background: var(--lime); } .test.no i { background: var(--red); }
.test .msg { display: block; color: var(--peach); font-family: var(--f-code); font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; }
.hp { display: grid; gap: 6px; }

.console { border: 3px solid var(--black); border-top: 0; background: #05070f; min-height: 120px; max-height: 46vh; overflow: auto; padding: 10px 12px; font-family: var(--f-code); font-size: 13px; }

.console .err { color: var(--red); }

.console .tutor { margin: 8px 0 0; padding: 8px 10px; border-left: 3px solid var(--sky); background: #0c1a2c; color: var(--silver); font-family: var(--f-body); font-size: 0.92rem; }

/* QUIZ */
.qwrap { max-width: 860px; margin: 0 auto; }
.qpanel { padding: 22px; }
.qmeta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-pixel); font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }

.qbar i { flex: 1; background: var(--navy); }
.qbar i.ok { background: var(--lime); } .qbar i.no { background: var(--red); } .qbar i.cur { background: var(--yellow); }
.code { background: var(--black); color: var(--paper); padding: 12px 14px; overflow-x: auto; font-size: 0.9rem; line-height: 1.55; margin: 0 0 14px; border: 2px solid var(--navy); position: relative; }

.opt { text-align: left; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--panel2); border: 3px solid var(--black); box-shadow: inset 0 0 0 2px var(--line); min-width: 0; }

.answer-input { width: 100%; font-family: var(--f-code); font-size: 1rem; padding: 10px 12px; border: 3px solid var(--black); box-shadow: inset 0 0 0 2px var(--line); background: var(--black); color: var(--paper); }
.blank { font-family: var(--f-code); font-size: 0.9rem; padding: 1px 6px; border: 2px solid var(--yellow); background: var(--navy); color: var(--paper); min-width: 6ch; }

/* ---------- v5: life, sound, overview ---------- */

  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

  display: flex; gap: 12px; align-items: center; padding: 12px 16px; max-width: min(380px, calc(100vw - 32px)); animation: slidein 0.3s steps(5) both;
  box-shadow: inset 0 0 0 2px var(--yellow), 4px 4px 0 var(--black); }

.st { padding: 10px 12px; background: var(--panel); border: 3px solid var(--black); box-shadow: inset 0 0 0 2px var(--line); min-width: 0; text-align: left; color: var(--paper); }
button.st:hover { box-shadow: inset 0 0 0 2px var(--yellow); }

.rrow .meta { display: block; color: var(--muted); font-size: 0.85rem; }
.rrow .state { font-family: var(--f-pixel); font-size: 0.66rem; white-space: nowrap; }
.rrow .state .stars { color: var(--slate); letter-spacing: 2px; font-size: 0.9rem; }
.rrow .state .stars i { font-style: normal; color: var(--yellow); }
.rrow .state .nx { color: var(--yellow); }
.rrow .state .new { color: var(--slate); }

/* rooms */
.bossrow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.bossspr { width: 64px; height: 64px; animation: wobble 1.4s steps(2) infinite; }
.bossspr.dead { animation: none; }
.hearts { display: inline-flex; gap: 3px; margin-left: 10px; vertical-align: middle; }
.hearts img { width: 16px; height: 16px; image-rendering: pixelated; }
.hearts img.lost { filter: grayscale(1) brightness(0.35); }
.qright { display: inline-flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.combo { color: var(--orange); margin-left: 8px; display: inline-block; animation: pop 0.3s steps(3) both; }

/* badges */
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
.bcard { display: flex; gap: 12px; padding: 12px 14px; align-items: center; min-width: 0; }
.bcard img { width: 40px; height: 40px; flex: none; }
.bcard b { display: block; font-family: var(--f-pixel); font-size: 0.85rem; }
.bcard span { display: block; color: var(--silver); font-size: 0.88rem; }
.bcard small { display: block; color: var(--lime); font-family: var(--f-pixel); font-size: 0.58rem; margin-top: 2px; }
.bcard.locked { opacity: 0.55; }
.bcard.locked b { color: var(--muted); }

/* ---------- v6 polish: motion & layout ---------- */
#stars { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; image-rendering: pixelated; }
.hud, .wrap, footer { position: relative; z-index: 1; }

@keyframes viewin { from { opacity: 0; transform: translateY(10px); } }
@keyframes stagin { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
@keyframes popx { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: var(--yellow); } 100% { transform: scale(1); } }
@keyframes slidein { from { opacity: 0; transform: translateX(-12px); } }
@keyframes walk { 0% { left: 0; transform: scaleX(1); } 49.9% { left: calc(100% - 32px); transform: scaleX(1); } 50% { left: calc(100% - 32px); transform: scaleX(-1); } 100% { left: 0; transform: scaleX(-1); } }
@keyframes hop { 50% { transform: translateY(-4px); } }
@keyframes coin { 0%, 100% { transform: translateY(0) scaleX(1); } 25% { transform: translateY(-3px) scaleX(0.4); } 50% { transform: translateY(0) scaleX(1); } 75% { transform: translateY(-3px) scaleX(0.4); } }
@keyframes skull { 50% { transform: translateY(-3px); } }
@keyframes bob { 50% { transform: translateY(-5px); } }

.enter > * { animation: viewin 0.28s cubic-bezier(0.2, 0.8, 0.3, 1) backwards; }
.stag { animation: stagin 0.32s steps(5) backwards; animation-delay: var(--d, 0ms); }
.hud .stat.lv.popx b { display: inline-block; animation: popx 0.6s steps(6); }
.feedback { animation: slidein 0.22s steps(4); }
.bob { animation: bob 1.2s steps(2) infinite; }

/* hero walkway: tiny looping scene under the title */
.walkway { position: relative; height: 40px; margin-top: 22px; max-width: 46ch; border-bottom: 4px solid var(--navy); box-shadow: 0 4px 0 var(--black); }
.walkway .walker { position: absolute; bottom: 0; width: 32px; height: 32px; animation: walk 9s linear infinite; }
.walkway .walker img { width: 32px; height: 32px; animation: hop 0.3s steps(2) infinite; }
.walkway .coin { position: absolute; bottom: 10px; width: 10px; height: 10px; background: var(--yellow); border: 2px solid var(--black); box-shadow: inset -2px -2px 0 var(--orange); animation: coin 1.4s steps(4) infinite; }
.walkway .coin:nth-child(2) { animation-delay: 0.35s; } .walkway .coin:nth-child(3) { animation-delay: 0.7s; }
.walkway .skull { position: absolute; right: -40px; bottom: 2px; width: 28px; height: 28px; opacity: 0.85; animation: skull 1s steps(2) infinite; }

/* continue card progress */
.cprog { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-family: var(--f-pixel); font-size: 0.62rem; color: var(--muted); }
.cprog .wbar { flex: 1; max-width: 220px; }
.cprog .wbar i { transition: width 0.6s steps(10); }

/* group headers get a count chip */
.grouphead { align-items: center; }
.gcount { font-family: var(--f-pixel); font-size: 0.58rem; color: var(--black); background: var(--yellow); padding: 3px 7px; border: 2px solid var(--black); }
.grouphead p { flex-basis: 100%; }

/* equal-height world cards; bar + footer pinned to bottom */
.wcard { display: flex; flex-direction: column; gap: 10px; }
.wcard .pips { min-height: 15px; }
.wcard .wbar { margin-top: auto; }
.wcard:active { transform: translateY(1px); box-shadow: inset 0 0 0 2px var(--wc), 2px 2px 0 var(--black); }

/* stat tiles: consistent stack */
.st { display: flex; flex-direction: column; justify-content: flex-start; gap: 2px; }
.st .xpbar { margin-top: auto; padding-top: 0; }

/* micro interactions */
.opt { transition: transform 0.08s steps(2), box-shadow 0.08s; }
.opt:hover:not([disabled]) { transform: translateY(-2px); }
.rrow { transition: transform 0.08s steps(2); }
.rrow:hover { transform: translateX(3px); }
.btn:active:not([disabled]) { transform: translate(2px, 2px); }
.victory .vic { width: 40px; height: 40px; display: block; margin: 0 auto 8px; }

@media (max-width: 960px) {
  .walkway { max-width: none; margin-right: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .walkway .walker, .walkway .walker img, .walkway .coin, .walkway .skull, .bob { animation: none; }
  .walkway .walker { left: 0; }
}

@media (max-width: 960px) {
  .hero2 { grid-template-columns: 1fr; gap: 18px; }
  .statrow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .statrow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rrow { grid-template-columns: 42px minmax(0, 1fr); }
  .rrow .no { display: none; }
  .rrow .ic { width: 42px; height: 42px; }
  .rrow .state { grid-column: 2; }
  .hudr { margin-left: 0; }
  .contcard { grid-template-columns: 58px minmax(0, 1fr); }
  .contcard .ic { width: 58px; height: 58px; }
  .hud .stat.xp, .hud .stat:first-of-type { display: none; }
  .pychip { font-size: 0; padding: 5px; }
  .hudbtn { padding: 2px 6px; }
}

@media (max-width: 960px) {
  .bench { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; align-items: start; }
  .modes { grid-template-columns: 1fr; }
  .cgrid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .opts { grid-template-columns: 1fr; }
  .tile { width: 54px; height: 54px; } .tile img { width: 28px; height: 28px; }
  .tile.k-boss { width: 66px; height: 66px; } .tile.k-boss img { width: 38px; height: 38px; }
  .link { width: 8px; }
  .hud .stat.xp .xpbar { width: 60px; }
  .kbd { display: none; }
  .CodeMirror { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
